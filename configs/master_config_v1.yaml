ops:
  metrics_url: "http://127.0.0.1:8000/metrics"   #                 API
  reports_dir: "reports"

execution:
  manage:
    auto: true

# Bracket orders configuration for position management
brackets:
  enable: true
  oco_emulation: true  # CRITICAL: Enables OCO (One-Cancels-Other) emulation - when one bracket fills, cancel the other
  sl:
    fixed_bps: 40  # Stop loss in basis points (0.5%)
  tp:
    fixed_bps: 80  # Take profit in basis points (1%)

##############################
# New structured config (additive-only)
# Preferred path for execution domain config consumed by ExecPosFSM
##############################
trading:
  execution:
    manage:
      # Bracket orders configuration (mirrors legacy top-level `brackets` for backward compatibility)
      brackets:
        enable: true                 # Enable bracket management (SL/TP)
        oco_emulation: true          # Enable OCO emulation: when SL or TP fills, the counterpart is cancelled
        sl:
          fixed_bps: 40              # Stop Loss distance in basis points (0.5%)
        tp:
          fixed_bps: 80              # Take Profit distance in basis points (1.0%)

      # Orphaned bracket monitor (periodic/self-cleaning of reduceOnly/closePosition orders when no position exists)
      orphan_monitor:
        enabled: true                # Master switch for the monitor (background loop and startup sync)
        run_on_startup: true         # Run a one-time sync on startup to cancel orphans immediately
        periodic_interval_sec: 300   # Interval for periodic cleanup loop in seconds (default 300s)
        min_order_age_sec: 0         # Skip cancelling orders newer than this age (0 disables the filter)
        batch_cancel_limit: 50       # Max cancels per single loop run to avoid bursts
        rate_limit_per_min: 120      # Global per-minute cancel cap across symbols (0 disables)

      # OrderGuardian centralized order/position monitor & cleanup
      order_guardian:
        poll_interval_ms: 500        # Polling interval for background cleanup (0 disables)
        batch_limit: 50              # Max orders to cancel per cleanup operation
        rate_limit_per_min: 120      # Global per-minute cancel rate limit across symbols (0 disables)

      # Failsafe configuration for execution position FSM
      failsafe:
        max_hold_sec: 86400          # Emergency close timer (24h) if no decision is made

  # Decision Making configuration
  decision_making:
    roi_exit:
      enabled: true
      target_roi_pct: 50.0           # Target ROI percentage to trigger close (e.g. 50.0 = 50%)

  # Domain-specific configurations (NEW STRUCTURE)
  domains:
    execution_position:
      exposure_guard:
        max_directional_ratio: 20.0
        max_equity_utilization_pct: 0.30
        max_long_utilization_pct: 0.15
        max_short_utilization_pct: 0.15
        positions_stale_ttl_sec: 15

# Execution timing and Guardian coordination (additive)
execution:
  preflight_backoff_ms: [120, 250, 400, 800, 1200, 1800]
  anti_race_close_ms: 800
  min_post_interval_per_symbol_ms: 300
  allow_trade_with_guardian_tidy_only: false  # Disabled: blocks all entries on cold start
  fsm_periodic_cleanup_enabled: false

# Guardian cleanup pacing (additive)
guardian:
  unified: true
  enable: true
  cleanup_cycles_ms: [200, 700, 1500, 3000]
  cleanup_ttl_ms: 6000
  symbol_cooldown_ms: 4000
  emit_tidy_event: true
  ledger_db_path: "data/order_ledger.db"

# Exposure guard configuration (additive)
trading:
  execution:
    # OrderGuardian centralized order/position monitor & cleanup
    order_guardian:
      poll_interval_ms: 500        # Polling interval for background cleanup (0 disables)
      batch_limit: 50              # Max orders to cancel per cleanup operation
      rate_limit_per_min: 120      # Global per-minute cancel rate limit across symbols (0 disables)

    exposure:
      # Increase stale TTL from 5s to 15s to handle slower portfolio updates
      positions_stale_ttl_sec: 15

      # Increase equity utilization from 20% to 30% to allow more exposure
      max_equity_utilization_pct: "0.30"

      # Per-side utilization limits (increase from 12% to 15%)
      max_side_utilization_pct:
        long: "0.15"
        short: "0.15"

      # Directional ratio control (allow up to 20:1 imbalance)
      max_directional_ratio: "20.0"

      # Per-symbol concentration limit (8% of equity per symbol)
      per_symbol_cap_pct: "0.08"

      # Enable soft clipping instead of hard rejection
      count_pending_orders: true
      exclude_reduce_only: true

    # Fallback mode configuration (PHASE P0)
    fallback:
      # Retry backoff for empty position API responses
      backoff_ms: [200, 500, 1000]  # Retry delays in milliseconds

  # Risk management with soft limits
  risk:
    soft_limits:
          mode: "clip"  # "clip" or "reject"
          clip_min_notional_usdt: 10.0
          directional_ratio_max: 3.0
          side_exposure_usdt: 600.0
          margin_exposure_usdt: 1100.0

models:
  sma_trend:
    sma_short_period: 10
    sma_long_period: 50
    confidence_multiplier: 20.0
    confidence_min: 0.5
    confidence_max: 0.95
  volatility:
    enabled: true
    atr_period: 14
    atr_sma_length: 100
    threshold_multiplier: 2.0
    low_vol_multiplier: 0.5
    high_vol_confidence_multiplier: 2.0
    low_vol_confidence_multiplier: 3.0
  mean_reversion:
    threshold: 0.005
    confidence_multiplier: 100.0
