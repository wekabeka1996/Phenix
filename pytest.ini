[pytest]
python_paths = apps vfoundation/vfoundation
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --maxfail=5
    -p no:warnings
    -m "not legacy"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as asyncio tests
    ws_rest: marks tests involving WebSocket and REST API interactions
    scen: marks tests as scenario-based integration tests
    legacy: marks tests as legacy (obsolete due to config/arch changes, skip in core suite)
timeout = 30
timeout_method = thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
