# Neocortex Neural Network Configuration

# ============================================================================
# VAE (Variational Autoencoder)
# ============================================================================
vae:
  # Architecture
  input_dim: 20  # Must match len(feature_list) in ingest.yaml
  hidden_dims: [128, 64]  # Encoder: input_dim -> 128 -> 64 -> latent
  latent_dim: 16  # Compressed representation dimensionality

  # Training
  learning_rate: 0.0003
  beta: 0.01  # KL divergence weight
  free_bits_per_dim: 0.2  # Per-dimension KL floor to prevent posterior collapse
  batch_size: 64

  # Inference
  use_mean: true  # Use mean of latent distribution

  # Optional auxiliary supervision on latent mean (mu)
  regime_aux:
    enabled: true
    alpha: 2.0
    num_classes: 5
    ema_decay: 0.99
    alpha_schedule:
      start: 0.5
      end: 2.0
      steps: 10000

# ============================================================================
# World Model (RNN Dynamics)
# ============================================================================
world_model:
  # Architecture
  hidden_dim: 128  # RNN hidden state
  num_layers: 2
  dropout: 0.1

  # Training
  learning_rate: 0.001
  sequence_length: 50  # BPTT length

# ============================================================================
# PPO (Proximal Policy Optimization)
# ============================================================================
ppo:
  # Architecture
  state_dim: 16  # Must match VAE latent_dim (no extra context wired yet)
  action_dim: 5  # TREND_UP, TREND_DOWN, MEAN_REVERSION, HIGH_VOLATILITY, EXHAUSTION
  hidden_dims: [256, 128]

  # Reward mode: "pnl" (legacy trade-based) or "regime_oracle" (self-supervised regime prediction)
  reward_mode: "regime_oracle"

  # Training
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2

  # Entropy bonus: prevents policy collapse (mode collapse to single action)
  # 0.01 default → 0.05 insufficient (oscillating collapse) → 0.15 drowned reward signal → 0.08 goldilocks
  entropy_coef: 0.05
  entropy_schedule:
    start: 0.05      # Force exploration initially
    end: 0.01        # Allow convergence later
    total_steps: 10000 # Number of PPO updates over which to decay
  max_grad_norm: 0.5
  numerical_safety:
    gradient_clip_threshold: 1.0
    on_invalid: "sanitize"

  # Rollout
  rollout_length: 2048
  num_epochs: 10
  minibatch_size: 64

# ============================================================================
# Checkpointing
# ============================================================================
checkpoint_every_n_steps: 100  # Lowered for backtest mode (was 1000)
keep_last_n_checkpoints: 5

# ============================================================================
# Dream / PPO Training Trigger
# ============================================================================
# Number of completed episodes before triggering PPO training ("dreaming")
# Regime oracle settles every ~5 bars; batch 20 episodes for meaningful
# advantage normalization (avoids degenerate std=0 with n=1).
dream_episode_threshold: 20
