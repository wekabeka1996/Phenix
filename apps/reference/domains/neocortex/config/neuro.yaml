# Neocortex Neural Network Configuration

# ============================================================================
# VAE (Variational Autoencoder)
# ============================================================================
vae:
  # Architecture
  input_dim: 20  # Must match len(feature_list) in ingest.yaml
  hidden_dims: [128, 64]  # Encoder: input_dim -> 128 -> 64 -> latent
  latent_dim: 16  # Compressed representation dimensionality
  
  # Training
  learning_rate: 0.001
  beta: 1.0  # KL divergence weight
  batch_size: 64
  
  # Inference
  use_mean: true  # Use mean of latent distribution

# ============================================================================
# World Model (RNN Dynamics)
# ============================================================================
world_model:
  # Architecture
  hidden_dim: 128  # RNN hidden state
  num_layers: 2
  dropout: 0.1
  
  # Training
  learning_rate: 0.001
  sequence_length: 50  # BPTT length

# ============================================================================
# PPO (Proximal Policy Optimization)
# ============================================================================
ppo:
  # Architecture
  state_dim: 16  # Must match VAE latent_dim (no extra context wired yet)
  action_dim: 3  # LONG, SHORT, FLAT
  hidden_dims: [256, 128]
  
  # Training
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  
  # Rollout
  rollout_length: 2048
  num_epochs: 10
  minibatch_size: 64

# ============================================================================
# Checkpointing
# ============================================================================
checkpoint_every_n_steps: 1000
keep_last_n_checkpoints: 5
