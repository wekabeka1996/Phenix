# path: ppo_library/pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo_system"
version = "1.0.0"
description = "Універсальна, надійна та конфігурована реалізація PPO-агента як бібліотека."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Your Name", email = "your.email@example.com"}]

# Основні залежності, необхідні для роботи бібліотеки
dependencies = [
  "torch>=2.0.0",
  "numpy>=1.22",
]

[project.optional-dependencies]
# Залежності для розробки, тестування та запуску прикладів
dev = [
    "gymnasium",  # Для прикладів та тестів
    "pytest",     # Для запуску тестів
]

[tool.setuptools.packages.find]
# Вказуємо, де шукати вихідний код нашого пакету
where = ["."]
include = ["ppo_system*"]