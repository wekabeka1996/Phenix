#                               Account Observer

#                                              
config:
  #                          
  trading_modes:
    live: "live"
    testnet: "testnet"
    hybrid_live: "hybrid_live"
    hybrid_testnet: "hybrid_testnet"

  #                                         (              )
  poll_intervals:
    fast: 1
    normal: 5
    slow: 10
    very_slow: 30

  #                                                                
  trade_limits:
    minimal: 10
    standard: 50
    extended: 100
    maximum: 500

  #                                                              ID                (                                                             )
  max_cached_trade_ids:
    small: 1000
    medium: 5000
    large: 10000
    xlarge: 50000

  #                          Binance API
  binance_api_structure:
    live:
      api_key: "BINANCE_LIVE_API_KEY"
      api_secret: "BINANCE_LIVE_API_SECRET"
    testnet:
      api_key: "BINANCE_TESTNET_API_KEY"
      api_secret: "BINANCE_TESTNET_API_SECRET"

  #                                             account_observer
  account_observer_structure:
    poll_interval: 5
    symbols: ["BTCUSDT", "ETHUSDT", "BNBUSDT"]
    trade_limit: 50

#                           FSM
events:
  #                          
  outgoing:
    trade_executed:
      name: "EVT:TRADE_EXECUTED"
      description: "                                                                      "
      payload_schema: "trade_executed_payload"
      frequency: "high"
      priority: "normal"

  #                         (                     )
  incoming: {}

#                                     
data_types:
  #                                       
  trade_sides:
    buy: "buy"
    sell: "sell"

  #                        
  commission_types:
    maker: "maker"
    taker: "taker"

  #                                    
  venues:
    binance: "binance"
    binance_testnet: "binance_testnet"

#                                                              
symbols:
  #                                        
  major_crypto:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - ADAUSDT
    - SOLUSDT
    - DOTUSDT
    - LINKUSDT
    - LTCUSDT

  # Altcoins                                              
  mid_cap:
    - AVAXUSDT
    - MATICUSDT
    - ALGOUSDT
    - VETUSDT
    - ICPUSDT
    - FILUSDT
    - TRXUSDT
    - ETCUSDT

  # Stablecoins
  stables:
    - BUSDUSDT
    - USDCUSDT
    - DAIUSDT

#                                                       
error_codes:
  api_connection_error: "AO001"
  api_rate_limit_error: "AO002"
  api_authentication_error: "AO003"
  invalid_trade_data: "AO004"
  deduplication_failure: "AO005"
  configuration_error: "AO006"
  memory_limit_exceeded: "AO007"

error_messages:
  AO001: "                                                  Binance API"
  AO002: "                                                    API"
  AO003: "                                            API             "
  AO004: "                                                         "
  AO005: "                                                      "
  AO006: "                                                        "
  AO007: "                                      '                      "

#                                                   
metrics:
  #                     
  counters:
    trades_processed: "account_observer_trades_processed_total"
    trades_skipped_duplicates: "account_observer_trades_skipped_duplicates_total"
    api_calls_total: "account_observer_api_calls_total"
    api_errors_total: "account_observer_api_errors_total"
    poll_cycles_total: "account_observer_poll_cycles_total"

  #                     
  histograms:
    api_call_duration: "account_observer_api_call_duration_seconds"
    trade_processing_duration: "account_observer_trade_processing_duration_seconds"
    poll_cycle_duration: "account_observer_poll_cycle_duration_seconds"

  #           
  gauges:
    cached_trade_ids_count: "account_observer_cached_trade_ids_count"
    active_symbols_count: "account_observer_active_symbols_count"
    memory_usage_bytes: "account_observer_memory_usage_bytes"

#                                                           
logging:
  #                              
  levels:
    debug: "DEBUG"
    info: "INFO"
    warning: "WARNING"
    error: "ERROR"
    critical: "CRITICAL"

  #                                          
  categories:
    api_calls: "api"
    trade_processing: "trade"
    deduplication: "dedup"
    lifecycle: "lifecycle"
    errors: "error"
    performance: "perf"

  #                                    
  formats:
    standard: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    json: '{"timestamp": "%(asctime)s", "logger": "%(name)s", "level": "%(levelname)s", "message": "%(message)s"}'

#                                                             
testing:
  #                        
  mock_trades:
    - symbol: "BTCUSDT"
      id: 12345
      orderId: 67890
      price: "50000.00"
      qty: "0.001"
      quoteQty: "50.00"
      commission: "0.00025"
      commissionAsset: "BNB"
      time: 1640995200000
      isBuyer: true
      isMaker: true
      isBestMatch: true

    - symbol: "ETHUSDT"
      id: 12346
      orderId: 67891
      price: "3000.00"
      qty: "0.01"
      quoteQty: "30.00"
      commission: "0.00025"
      commissionAsset: "BNB"
      time: 1640995260000
      isBuyer: false
      isMaker: false
      isBestMatch: true

  #                                
  scenarios:
    normal_operation: "                                                                "
    duplicate_trades: "                                                  "
    api_errors: "                                  API"
    high_volume: "                                        "
    memory_pressure: "                                            '      "

#                                                       
security:
  #                                     API             
  required_permissions:
    - "Read Info"        #                                     
    - "Enable Spot & Margin Trading"  #                         (                         )
    - "Enable Futures"   #          '              
    - "Enable Reading"   #                                     

  #                            (              )
  cache_ttl:
    trade_ids: 86400    # 24             
    api_responses: 300  # 5             

  #                              
  rate_limits:
    api_calls_per_minute: 1200
    api_calls_per_hour: 72000

#                                                                     
performance:
  #                               SLA
  targets:
    data_freshness_seconds: 35
    deduplication_accuracy: 1.0
    availability_percentage: 99.5
    api_response_time_median_seconds: 5

  #                                    
  thresholds:
    high_api_latency_ms: 10000
    high_memory_usage_mb: 100
    high_error_rate_percentage: 5
    high_duplicate_rate_percentage: 1

  #                       
  optimizations:
    batch_size: 50
    parallel_requests: 3
    cache_cleanup_interval_minutes: 60</content>
