#                                                      account_balance

# =============================================================================
#                                                       
# =============================================================================

#                             (                               API)
trading_mode: "hybrid_live_data_testnet_exec"

# =============================================================================
# API                          BINANCE
# =============================================================================

binance_api:
  #                                                                      
  live:
    api_key: "${BINANCE_LIVE_API_KEY}"
    api_secret: "${BINANCE_LIVE_API_SECRET}"
    rest_url: "https://fapi.binance.com"

  #                                                                        
  testnet:
    api_key: "${BINANCE_TESTNET_API_KEY}"
    api_secret: "${BINANCE_TESTNET_API_SECRET}"
    rest_url: "https://testnet.binancefuture.com"

# =============================================================================
#                                       ACCOUNT_BALANCE
# =============================================================================

account_balance:
  #                                       API                    
  poll_interval: 30

  #                                                                  
  retry_attempts: 3
  backoff_multiplier: 2.0

  #                                         
  timeout: 10
  max_concurrent_requests: 2

  #                          
  enable_balance_filtering: true    #                                               > 0
  enable_position_filtering: true   #                                             

  #                                                               
  log_level: "INFO"
  enable_detailed_balance_logging: true

# =============================================================================
#                                           ACCOUNT_OBSERVER (                           )
# =============================================================================

account_observer:
  poll_interval: 30  #                                account_balance.poll_interval

# =============================================================================
#                                                       
# =============================================================================

#                                                                       
development_config:
  account_balance:
    poll_interval: 10
    log_level: "DEBUG"
    enable_detailed_balance_logging: true

#                                                        
production_config:
  account_balance:
    poll_interval: 60
    retry_attempts: 5
    log_level: "WARN"
    enable_detailed_balance_logging: false

#                                                                       
testing_config:
  account_balance:
    poll_interval: 5
    retry_attempts: 1
    timeout: 5
    log_level: "DEBUG"

# =============================================================================
#                                   (       .env           )
# =============================================================================

# BINANCE_LIVE_API_KEY=your_live_api_key_here
# BINANCE_LIVE_API_SECRET=your_live_api_secret_here
# BINANCE_TESTNET_API_KEY=your_testnet_api_key_here
# BINANCE_TESTNET_API_SECRET=your_testnet_api_secret_here

# =============================================================================
#                                                                  
# =============================================================================

#                                                            
detailed_example:
  trading_mode: "testnet"  #                                testnet                      

  binance_api:
    testnet:
      api_key: "your_testnet_key"
      api_secret: "your_testnet_secret"
      rest_url: "https://testnet.binancefuture.com"

  account_balance:
    #                                    API (                   )
    poll_interval: 30

    #                                           
    retry_attempts: 3          #                      3         
    backoff_multiplier: 2.0    #                                                              
    timeout: 10               #                                                                        

    #                                
    enable_balance_filtering: true   #                                                                   
    enable_position_filtering: true  #                                                                  

    #                   
    log_level: "INFO"                    #                                
    enable_detailed_balance_logging: true #                                                    USDT</content>
