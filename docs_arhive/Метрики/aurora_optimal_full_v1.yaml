  # ETHUSDT - 5m Timeframe
  # ==========================================================================
  # Performance: $180.84/month (+38.6% vs Phase 3)
  # Key: Aggressive TP1 (70% exit), Extended TP2 (30% runner)
  # ==========================================================================
  ETHUSDT:
    enabled: true
    timeframe: "5m"
    bar_seconds: 300
    capital_usd: 1000
    
    # Training Metrics (Phase 3+ Full)
    training_metrics:
      pnl_usd: 180.84
      improvement_vs_phase3: 38.6%
      trials: 3000
      source: "Phase 3+ Full Feature"
    
    # ====================
    # CORE SIGNAL FEATURES (from Phase 2/DEEP base)
    # ====================
    features:
      ema:
        period_short: 4
        period_long: 19
        # Phase 3+: EMA Clamping
        clamp_min: -0.03
        clamp_max: 0.03
      
      volume:
        window_sec: 60
        sma_length: 12
        cap_max: 4.814
      
      liquidity:
        depth_half: 1250.0
        kappa_min: 0.463
      
      obi:
        window_sec: 145
      
      tfi:
        window_sec: 290
      
      volatility:
        window_sec: 290
        sma_length: 3
        cap_max: 4.373
      
      depth_imbalance:
        use_smoothing: false
      
      delta_price:
        spike_filter_ms: 5000
      
      macro_sync:
        window: 40
    
    # ====================
    # SIGNAL WEIGHTS
    # ====================
    weights:
      ema: 0.058
      volume: 0.241
      macro: 0.131
      liquidity: 0.341
      obi: 0.155
      tfi: 0.093
      volatility: 0.036
      depth_imbalance: 0.256
      delta_price: 0.253
    
    # ====================
    # PHASE 3+: RISK SCORE COMPOSITION
    # ====================
    risk_weights:
      delta_price: 0.4
      volume: 0.5
      volatility: 0.1
    
    # ====================
    # PHASE 3: SIDE-BIAS PENALTY
    # ====================
    side_bias:
      penalty_factor: 0.9      # MAXIMUM (ETH mean-reversion heavy)
      window_sec: 600
      target_ratio: 0.6
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE THRESHOLDS
    # ====================
    regime_thresholds:
      high_volatility_multiplier: 1.3
      low_volatility_multiplier: 0.85
      trend_multiplier: 1.05
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE SIZING
    # ====================
    regime_sizing:
      high_volatility_multiplier: 0.3   # 70% SMALLER
      low_volatility_multiplier: 1.9    # 90% LARGER
      mean_reversion_multiplier: 0.8
      base_size_usd: 1000.0
    
    # ====================
    # PHASE 3+: TAKE-PROFIT LOGIC (NEW!)
    # ====================
    take_profit:
      tp_low_ratio: 0.4        # TP1 = 0.4x SL (AGGRESSIVE)
      tp_high_ratio: 1.4       # TP2 = 1.4x SL (EXTENDED)
      partial_exit_pct: 0.7    # Exit 70% at TP1, leave 30% runner
    
    # ====================
    # PHASE 3+: TRAILING STOP (NEW!)
    # ====================
    trailing_stop:
      enabled: false           # NOT USED (null in optimization)
      activation_pct: 0.005    # Default if enabled
      distance_pct: 0.004      # Default if enabled
    
    # ====================
    # PHASE 3+: COOLDOWN (NEW!)
    # ====================
    execution:
      cooldown_sec: 15         # 15s pause between trades
    
    # ====================
    # DECISION & RISK
    # ====================
    decision:
      signal_threshold: 0.271
      max_risk_score: 0.756
      allowed_regimes:
        - TREND_DOWN
        - LOW_VOLATILITY
    
    # ====================
    # EXIT PARAMETERS
    # ====================
    exit:
      sl_pct: 0.019            # 1.9% stop loss
      max_hold_sec: 900        # 15 minutes

