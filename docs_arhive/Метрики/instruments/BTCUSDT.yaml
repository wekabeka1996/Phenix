# ==============================================================================
# BTCUSDT — Aurora Instrument Configuration
# Phase 3+ BTC Quick-Fix (SWING TRADER)
# Source: AURORA_FULLSCALE_OPTIMIZATION_FINAL.md
# ==============================================================================

symbol: BTCUSDT

# Instrument Specifications (from exchange)
specs:
  step_size: "0.001"
  tick_size: "0.10"
  min_notional: "10"

# Aurora Strategy Parameters
# BTC uses Aurora tick-based strategy as PRIMARY
# MR is also enabled for diversification (FLAT regimes)
aurora:
  enabled: true  # BTC = Aurora PRIMARY + MR secondary
  weights:
    ema: 0.35
    volume: 0.10
    macro: 0.35
    liquidity: 0.10
    obi: 0.05
    tfi: 0.05
    volatility: 0.20
    depth_imbalance: 0.05
    delta_price: 0.10

  side_bias:
    penalty_factor: 0.4
    window_sec: 420
    target_ratio: 0.6

  regime_thresholds:
    HIGH_VOLATILITY: 2.5
    LOW_VOLATILITY: 0.7
    MEAN_REVERSION: 1.05
    DEFAULT: 1.0

  regime_sizing:
    HIGH_VOLATILITY: 0.3
    LOW_VOLATILITY: 1.6
    MEAN_REVERSION: 1.4

  exit:
    sl_pct: 0.035              # 3.5%
    max_hold_sec: 2400         # 40 minutes

  take_profit:
    tp_low_ratio: 0.7          # TP1 = 0.7x risk
    tp_high_ratio: 1.6         # TP2 = 1.6x risk
    partial_exit_pct: 0.5      # 50% at TP1

  trailing_stop:
    enabled: true
    activation_pct: 0.005      # Activate at 0.5% profit
    trail_pct: 0.003           # Trail 0.3% behind peak
    min_update_interval_sec: 5

  # Regime Gating
  allowed_regimes:
    - MEAN_REVERSION
    - LOW_VOLATILITY
    - TREND_UP
    - TREND_DOWN

  # Per-asset overrides
  ema_clamp:
    enabled: true
    clamp_min: -0.025
    clamp_max: 0.025

  signal_threshold:
    enabled: true
    value: 0.2

  max_risk_score:
    enabled: true
    value: 0.6

  cooldown_sec: 0              # Optuna: No cooldown (BTC liquid enough)

  # NOTE: Aurora is tick-based, NOT bar-based
  # Rolling windows (EMA, volume) use global config from domains.yaml

# Mean Reversion 1M Strategy (Track B)
mean_reversion_1m:
  enabled: true
  strategy:
    bb_window: 40
    bb_num_std: 2.3
    min_bb_width: 0.006
    entry_threshold: 0.05
    tp_to_mid: true
    cooldown_sec: 0
  # Regime Gating - BTC conservative (+$103) - exclude HIGH for safety
  allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL"]
