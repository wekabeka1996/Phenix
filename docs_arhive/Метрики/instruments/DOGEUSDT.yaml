# ==============================================================================
# DOGEUSDT — Aurora Instrument Configuration
# Phase 3+ derived from Mean Reversion optimization (1m track)
# CHAMPION asset from MR-1m research
# Source: AURORA_FULLSCALE_OPTIMIZATION_FINAL.md
# ==============================================================================

symbol: DOGEUSDT

# Instrument Specifications (from exchange)
specs:
  step_size: "1"
  tick_size: "0.00001"
  min_notional: "10"

# Aurora Strategy Parameters
# ⚠️ DOGE uses Mean Reversion strategy (Track B) as PRIMARY
# Aurora tick-based strategy is DISABLED to avoid signal conflicts
aurora:
  enabled: false  # DOGE = MR-only (Phase 3 decision)
  weights:
    # Derived from global weights (no momentum optimization exists for DOGE)
    ema: 0.15
    volume: 0.15
    macro: 0.10
    liquidity: 0.20
    obi: 0.15
    tfi: 0.12
    volatility: 0.08
    depth_imbalance: 0.15
    delta_price: 0.15

  side_bias:
    penalty_factor: 0.3        # Moderate - DOGE trends can persist
    window_sec: 300
    target_ratio: 0.6

  regime_thresholds:
    HIGH_VOLATILITY: 1.5       # Stricter in high vol (DOGE pumps hard)
    LOW_VOLATILITY: 0.85
    MEAN_REVERSION: 0.9        # Slightly looser for MR (champion asset)
    DEFAULT: 1.0

  regime_sizing:
    HIGH_VOLATILITY: 0.4       # Very conservative in high vol
    LOW_VOLATILITY: 1.5        # Moderate aggressive in low vol
    MEAN_REVERSION: 1.2        # Slightly larger for MR plays

  exit:
    # SYNCED: AURORA_FULLSCALE_OPTIMIZATION_FINAL.md (DOGE 🥇)
    sl_pct: 0.019              # 1.9% from Optuna (was 1.97%)
    max_hold_sec: 6480         # 108 min from Optuna (was 660 = 11 min!)

  take_profit:
    # SYNCED: AURORA_FULLSCALE_OPTIMIZATION_FINAL.md
    tp_low_ratio: 0.63         # TP1 = 0.63x risk (was 0.5)
    tp_high_ratio: 2.45        # TP2 = 2.45x risk (was 1.0!) - catch big DOGE moves
    partial_exit_pct: 0.38     # 38% at TP1 (was 60%)

  trailing_stop:
    # SYNCED: AURORA_FULLSCALE_OPTIMIZATION_FINAL.md
    enabled: true
    activation_pct: 0.012      # Activate at 1.2% profit (was 1.5%)
    trail_pct: 0.004           # Trail 0.4% behind peak (was 0.8%)
    min_update_interval_sec: 5

  # Regime Gating - DOGE works best in FLAT regimes (MR champion)
  allowed_regimes:
    - FLAT_LOW
    - FLAT_NORMAL
    - FLAT_HIGH
    - LOW_VOLATILITY

  # Phase 3+ per-asset overrides (use global fallbacks)
  ema_clamp:
    enabled: false

  signal_threshold:
    enabled: false

  max_risk_score:
    enabled: false

  cooldown_sec: 210            # Optuna: 3.5 min (AURORA_FULLSCALE_OPTIMIZATION_FINAL.md)

# Mean Reversion 1M Strategy (Track B) — CHAMPION 🥇
mean_reversion_1m:
  enabled: true
  strategy:
    bb_window: 20
    bb_num_std: 2.1
    min_bb_width: 0.005        # (min_vol_atr from report)
    entry_threshold: 0.05
    sl_atr_mult: 1.5           # Base, overridden below
    tp_to_mid: false           # False for outer band target
    cooldown_sec: 210
  # Asset-specific overrides
  position_mode: "DYNAMIC"     # Phase 3: Pyramiding allowed per user request
  sl_pct: 0.019                # ENABLED (Phase 3 Override)
  # Regime Gating - DOGE champion (+$387) - includes FLAT_HIGH for "жирні" угоди
  allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH"]
