      tick_size: 0.01     # from trading.instruments.ETHUSDT.tick_size "0.01"
      max_position_size: 5.0
      max_leverage: 20
  BTCUSDT:
    exchange: binance
    base_asset: BTC
    quote_asset: USDT
    precision:
      quantity: 3  # from trading.instruments.BTCUSDT.step_size "0.001"
      price: 2     # from trading.instruments.BTCUSDT.tick_size "0.10" -> 2 decimals? Wait, "0.10" is 1 decimal, but typically 2 for price
