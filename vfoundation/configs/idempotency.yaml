# Distributed Idempotency Configuration
# FSMP-P2-T02: Redis-based exactly-once semantics across multiple workers
#
# All values can be overridden via ENV variables with IDEMP_ prefix
# Example: IDEMP_TTL_MS=120000 overrides ttl_ms

# Redis connection
redis:
  url: "redis://localhost:6379/0"  # Override with REDIS_URL env var

# Idempotency record TTL
ttl_ms: 60000  # 60 seconds lease duration (IDEMP_TTL_MS)

# Operation timeouts (milliseconds)
timeouts:
  operation_ms: 100   # I/O level timeout for Redis operations (IDEMP_TIMEOUT_MS)

# Retry configuration for store operations
retry:
  max_attempts: 3   # IDEMP_RETRY_MAX_ATTEMPTS
  base_ms: 50       # IDEMP_RETRY_BASE_MS
  max_ms: 1000      # IDEMP_RETRY_MAX_MS

# Circuit Breaker for store operations
circuit_breaker:
  threshold: 0.6          # Error rate to open CB (IDEMP_CB_THRESHOLD)
  cooldown_ms: 3000       # Cooldown period (IDEMP_CB_COOLDOWN_MS)
  half_open_probes: 2     # Probes in HALF_OPEN (IDEMP_CB_HALF_OPEN_PROBES)

# Worker identification
worker:
  id: "worker-default"  # Override with WORKER_ID env var

# Lua script optimization
lua:
  cache_scripts: true  # Cache loaded Lua scripts in Redis
