# Execution Adapter Configuration
# FSMP-P2-T01: Real SDK adapter with dry_run/paper modes
# 
# All values can be overridden via ENV variables with ADAPTER_ prefix
# Example: ADAPTER_RETRY_MAX_ATTEMPTS=5 overrides retry.max_attempts

# Retry configuration for SDK calls
retry:
  max_attempts: 3  # Maximum retry attempts before failing
  base_ms: 100      # Base delay in milliseconds
  max_ms: 2000      # Maximum delay after exponential backoff
  jitter: true      # Add random jitter to backoff delays

# Circuit Breaker configuration
circuit_breaker:
  open_threshold: 0.5      # Error rate threshold to open circuit (50%)
  cooldown_ms: 5000         # Cooldown period in OPEN state (5s)
  half_open_probes: 3       # Number of probes in HALF_OPEN state
  window_size: 100          # Rolling window size for error rate calculation

# Timeouts for SDK operations (milliseconds)
timeouts:
  submit_ms: 200    # submit() call timeout
  cancel_ms: 200    # cancel() call timeout
  stream_ms: 5000   # stream() event timeout

# Rate limiting
rate_limits:
  requests_per_second: 10   # Max requests per second to exchange
  burst_size: 5             # Allow burst of N requests

# Idempotency ledger
idempotency:
  ttl_seconds: 3600         # How long to keep idempotency records (1h)
  max_entries: 10000        # Max entries before eviction (LRU)

# Metrics collection
metrics:
  p95_window_size: 1000     # Number of samples for p95 calculation
  histogram_buckets:
    - 5
    - 10
    - 25
    - 50
    - 100
    - 200
    - 500
    - 1000
    - 2000
    - 5000

# Logging
logging:
  level: INFO               # Log level for adapter
  why_max_length: 80        # Max length for WHY field
  redact_secrets: true      # Redact API keys/secrets in logs
