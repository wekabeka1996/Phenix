[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vfoundation"
version = "0.1.0"
description = "FSM-LLM Federated Modular Architecture framework (vFoundation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="vFoundation Team"}]
dependencies = [
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "typer>=0.9",
  "structlog>=24.1",
  "python-dotenv>=1.0",
  "PyNaCl>=1.5",
  "opentelemetry-sdk>=1.26; python_version>='3.10'",
  "opentelemetry-instrumentation-fastapi>=0.47b0; python_version>='3.10'",
  "redis>=5.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "fakeredis[lua]>=2.21"
]

[tool.setuptools]
# packages = ["vfoundation", "apps", "cli"]
packages = ["vfoundation"]

[tool.setuptools.package-dir]
"" = ".."

[tool.setuptools.package-data]
"vfoundation" = ["py.typed"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
