# ==============================================================================
# STRATEGIES REGISTRY — MEAN REVERSION BACKTEST
# ==============================================================================
# MR-only strategy assignments for parallel backtest execution.
# This config assigns DOGEUSDT and 1000PEPEUSDT to mean_reversion strategy.
#
# Usage: python scripts/diagnostics/run_mr_backtest.py --start 2023-06-01 --end 2023-09-30
# ==============================================================================

version: "1.0.0"

# ==============================================================================
# STRATEGY ASSIGNMENTS (MR-only)
# ==============================================================================
assignments:
  DOGEUSDT:
    - mean_reversion

  1000PEPEUSDT:
    - mean_reversion

# ==============================================================================
# ARBITRATION (single strategy — no conflicts possible)
# ==============================================================================
arbitration:
  mode: priority
  window_ms: 1000
  priority:
    mean_reversion: 1
  logging:
    rejected_why_prefix: "ARBITRATION_REJECT"
    log_level: "INFO"
