strategy:
  name: "Mean Reversion 1m"
  version: "v3.0-final"
  timeframe: "1m"
  
  # Global Settings
  global:
    position_size_usd: 1000
    maker_fee: 0.0002  # 0.02%
    taker_fee: 0.0005  # 0.05%
    slippage: 0.0001   # 0.01%
    cost_basis: 0.0008 # maker + taker + slippage
    
  # Risk Management
  risk:
    max_concurrent_positions: 5
    daily_loss_limit_usd: 500
    per_asset_exposure_pct: 20  # 20% of capital per asset
    
  # Asset Configurations (Optimized via 500-trial Optuna)
  assets:
    
    # Bitcoin - Most Stable, Tight SL
    BTCUSDT:
      enabled: true
      bb_window: 20              # 20-minute Bollinger Bands
      min_vol_atr: 0.008         # Min BB width 0.8%
      sl_pct: 0.0068             # Stop Loss 0.68%
      allowed_regimes:
        - FLAT_LOW
        - FLAT_NORMAL
        - FLAT_HIGH
      metrics:
        expected_pnl: 45.27
        win_rate: 0.657
        calmar: 0.91
        trades_per_month: 172
        
    # Dogecoin - Best Performer, Wide SL
    DOGEUSDT:
      enabled: true
      bb_window: 20              # 20-minute Bollinger Bands
      min_vol_atr: 0.010         # Min BB width 1.0%
      sl_pct: 0.0197             # Stop Loss 1.97% (meme volatility)
      allowed_regimes:
        - FLAT_LOW
        - FLAT_NORMAL
        - FLAT_HIGH
      metrics:
        expected_pnl: 88.38       # Best performer!
        win_rate: 0.644
        calmar: 1.07
        trades_per_month: 146
        
    # XRP - Balanced
    XRPUSDT:
      enabled: true
      bb_window: 20              # 20-minute Bollinger Bands
      min_vol_atr: 0.010         # Min BB width 1.0%
      sl_pct: 0.0144             # Stop Loss 1.44%
      allowed_regimes:
        - FLAT_LOW
        - FLAT_NORMAL
        - FLAT_HIGH
      metrics:
        expected_pnl: 31.41
        win_rate: 0.626
        calmar: 0.54
        trades_per_month: 107
        
    # Ethereum - Conservative, Wide SL
    ETHUSDT:
      enabled: true
      bb_window: 120             # 120-minute (2-hour) Bollinger Bands
      min_vol_atr: 0.025         # Min BB width 2.5% (high volatility filter)
      sl_pct: 0.0282             # Stop Loss 2.82% (widest)
      allowed_regimes:
        - FLAT_LOW
        - FLAT_NORMAL
        - FLAT_HIGH
      metrics:
        expected_pnl: 37.38
        win_rate: 0.697
        calmar: 0.71
        trades_per_month: 33      # Conservative, high-quality setups
        
    # Solana - Optional (low profit margin)
    SOLUSDT:
      enabled: false              # Disabled due to low PnL
      bb_window: 60               # 60-minute (1-hour) Bollinger Bands
      min_vol_atr: 0.020          # Min BB width 2.0%
      sl_pct: 0.0156              # Stop Loss 1.56%
      allowed_regimes:
        - FLAT_LOW
        - FLAT_NORMAL
        - FLAT_HIGH
      metrics:
        expected_pnl: 1.48        # Near break-even
        win_rate: 0.650
        calmar: 0.01
        trades_per_month: 180
        
  # Entry Logic
  entry:
    # Fee-aware filter: Expected PnL must be > 1.5x cost basis
    min_expected_return_multiplier: 1.5
    
    # LONG conditions:
    # - price < bb_lower
    # - regime in allowed_regimes
    # - bb_width >= min_vol_atr
    # - (bb_mid - price) / price > cost_basis * 1.5
    
    # SHORT conditions:
    # - price > bb_upper
    # - regime in allowed_regimes
    # - bb_width >= min_vol_atr
    # - (price - bb_mid) / price > cost_basis * 1.5
    
  # Exit Logic
  exit:
    # Primary: Mean Reversion (price touches BB mid)
    mean_reversion_exit: true
    
    # Secondary: Stop Loss (asset-specific sl_pct)
    stop_loss_enabled: true
    
    # Tertiary: Time-based (optional, disabled by default)
    max_hold_time_minutes: null
    
  # Execution
  execution:
    order_type: "MARKET"         # Taker orders (immediate fill)
    entry_fee_type: "MAKER"      # Assume maker fill on entry (0.02%)
    exit_fee_type: "TAKER"       # Market exit (0.05%)
    
  # Performance Summary (Jan 2024)
  performance:
    total_portfolio_pnl: 203.72
    assets_profitable: 5
    avg_win_rate: 0.648
    avg_calmar: 0.65
    total_trades: 558
    
  # Recommended Deployment
  deployment:
    recommended_assets: ["BTCUSDT", "DOGEUSDT", "XRPUSDT", "ETHUSDT"]
    excluded_assets: ["SOLUSDT"]  # Low profit margin
    expected_monthly_pnl: 202.00  # Without SOL
    min_capital_usd: 50000        # For 2% risk per trade
