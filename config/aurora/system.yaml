# System-wide configurations
# This file defines global settings, domain-specific modes, and API configurations.

# Trading mode determines the overall behavior of the system.
# It is now primarily controlled by the TRADING_MODE variable in the .env file.
# Supported modes:
# - "live": Live data, live execution on mainnet.
# - "testnet": Testnet data, testnet execution on Binance Futures Testnet.
# - "hybrid_live_data_testnet_exec": Live data from mainnet, execution on testnet.
trading_mode: ${TRADING_MODE}

# Domain-specific configurations allow overriding the global trading_mode for
# individual components. This is useful for fine-grained control in hybrid setups.
domain_configuration:
  market_data:
    trading_mode: "live"  # Always use live data for market analysis
  execution_position:
    trading_mode: "testnet" # Always use testnet for placing orders
  account_balance:
    trading_mode: "testnet" # Use testnet for balance checks
  account_observer:
    trading_mode: "testnet" # Observe testnet account for updates

# Binance API configuration is now loaded directly from .env variables
# by the ConfigLoader. The structure is maintained here for clarity but
# the values are populated from:
# - LIVE_BINANCE_API_KEY, LIVE_BINANCE_API_SECRET, LIVE_BINANCE_REST_URL
# - TESTNET_BINANCE_API_KEY, TESTNET_BINANCE_API_SECRET, TESTNET_BINANCE_REST_URL
binance_api:
  live:
    api_key: ""
    api_secret: ""
    rest_url: ""
  testnet:
    api_key: ""
    api_secret: ""
    rest_url: ""

# Other system settings
system:
  trade_intent_validity_ms: 30000