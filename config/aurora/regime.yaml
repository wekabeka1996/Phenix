basis_tf_sec: 300       # Bar-Only updates (5 min)
uncertain_cutoff: 0.35  # Min confidence to be valid regime

# DM-CRITICAL-PATCHES-02: Liveness guard factor
# If no heartbeat received within (basis_tf_sec * liveness_factor) ms, block trading.
# Default: 3 (i.e., 15 minutes for 5m basis)
liveness_factor: 3

hmm:
  enabled: true
  K: 3               # number of hidden states (>=2)
  emission:
    cov_kind: diag    # diag | full
  sticky_kappa: 0.15  # self-transition bias (0=no bias)
  update_interval: 250  # semi-online EM update cadence (observations)
  history_hours: 48    # offline training lookback window
  confidence_threshold: 0.75
features:
  rv_window: 120      # samples for realized volatility
  trend_window: 180   # samples for trend slope regression
  obi_window: 60      # samples for order book imbalance smoothing
  spread_min_ticks: 1 # used for normalization safeguards
  micro_return_window: 1

# PURGE-DIRTY-DOZEN: Removed hotreload_whitelist (dead stub, hot-reload never implemented) - 2026-01-25
models:
  sma_trend:
    # TESTNET SMOKE: minimize warmup (min allowed: 2)
    # LIVE (was): sma_short_period: 10
    sma_short_period: 2
    # LIVE (was): sma_long_period: 50 (min allowed: 5)
    sma_long_period: 5
    confidence_multiplier: 20.0
    confidence_min: 0.5
    confidence_max: 0.95
  volatility:
    enabled: true
    # TESTNET SMOKE: minimize warmup
    # LIVE (was): atr_period: 14
    atr_period: 1
    # LIVE (was): atr_sma_length: 100 (min allowed: 10)
    atr_sma_length: 10
    allow_close_to_close_atr: true
    threshold_multiplier: 2.0
    low_vol_multiplier: 0.5
    high_vol_confidence_multiplier: 2.0
    low_vol_confidence_multiplier: 3.0
  mean_reversion:
    threshold: 0.005
    confidence_multiplier: 100.0
