    # TESTNET SMOKE: minimize warmup (min allowed: 2)
    sma_short_period: 8
    sma_long_period: 24
    confidence_multiplier: 28.0  # Підвищено для балансу (uncertain_cutoff знижено 0.60→0.52)
    confidence_min: 0.42
    confidence_max: 0.95
  volatility:
