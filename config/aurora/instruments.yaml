# TASK50: Added min_qty and min_notional for fail-closed qty normalization

instruments:
  SOLUSDT:
    symbol: "SOLUSDT"
    step_size: "1"        # Binance testnet: stepSize=1
    tick_size: "0.01"
    min_qty: "1"          # Binance testnet: minQty=1
    min_notional: "5"     # Binance testnet: notional=5
