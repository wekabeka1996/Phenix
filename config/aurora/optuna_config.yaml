# ==============================================================================
# Optuna Configuration — BTCUSDT Aurora Strategy (FIXED PATHS)
# ==============================================================================
# Gates знаходяться в decision.gates, не aurora.gates!
# ==============================================================================

optuna:
  enabled: true
  
  study:
    name: "aurora_btc_full_optimization"
    n_trials: 100
    n_jobs: 1
    sampler: "TPESampler"
    seed: 42
    storage: "sqlite:///runs/optuna/aurora_btc_full.db"
    
  objective:
    metric: "calmar_ratio"
    direction: "maximize"
    
    gates:
      min_filled_orders: 10
      max_dd_pct: 30.0
      min_intents: 3
      
  search_space:
    strategies:
      aurora:
        # === DECISION LEVEL PARAMS (correct path!) ===
        decision:
          signal_threshold:
            type: float
            low: 0.03
            high: 0.25
            step: 0.01
          reentry_cooldown_sec:
            type: int
            low: 30
            high: 600
            step: 30
          # Gates are INSIDE decision!
          gates:
            anti_flat_sigma:
              type: float
              low: 0.1
              high: 1.0
              step: 0.1
            anti_fomo_sigma:
              type: float
              low: 2.0
              high: 8.0
              step: 0.5
        
        # === BTCUSDT SPECIFIC ===
        assets:
          BTCUSDT:
            # Re-entry cooldown (asset-level override)
            reentry_cooldown_sec:
              type: int
              low: 30
              high: 300
              step: 30
            
            # Volatility Entry Logic — regime_multipliers
            volatility_entry_logic:
              regime_multipliers:
                HIGH_VOLATILITY:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                LOW_VOLATILITY:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                TREND_UP:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                TREND_DOWN:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                MEAN_REVERSION:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                UNCERTAIN:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
                DEFAULT:
                  type: float
                  low: 0.1
                  high: 1.0
                  step: 0.1
            
            # Regime Thresholds
            regime_thresholds:
              HIGH_VOLATILITY:
                type: float
                low: 0.05
                high: 0.5
                step: 0.05
              LOW_VOLATILITY:
                type: float
                low: 0.05
                high: 0.5
                step: 0.05
              TREND_UP:
                type: float
                low: 0.05
                high: 0.5
                step: 0.05
              TREND_DOWN:
                type: float
                low: 0.05
                high: 0.5
                step: 0.05
              MEAN_REVERSION:
                type: float
                low: 0.05
                high: 1.0
                step: 0.1
              UNCERTAIN:
                type: float
                low: 0.05
                high: 1.0
                step: 0.1
              DEFAULT:
                type: float
                low: 0.05
                high: 1.0
                step: 0.1
            
            # Position Sizing per Regime
            regime_sizing:
              HIGH_VOLATILITY:
                type: float
                low: 0.5
                high: 10.0
                step: 0.5
              LOW_VOLATILITY:
                type: float
                low: 0.5
                high: 10.0
                step: 0.5
              TREND_UP:
                type: float
                low: 0.5
                high: 10.0
                step: 0.5
              TREND_DOWN:
                type: float
                low: 0.5
                high: 10.0
                step: 0.5
              MEAN_REVERSION:
                type: float
                low: 0.0
                high: 5.0
                step: 0.5
