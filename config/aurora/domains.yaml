# Domain-specific configurations

debug:
  # DEV/SHADOW ONLY: disables position stale gate. Never enable in live.
  disable_positions_stale_gate: false

  # DEV/SHADOW ONLY: disables daily drawdown/loss limit gate. Never enable in live.
  disable_daily_loss_limit: false

decision_making:
  # TASK-ZOMBIE-FIX: Removed dead fields (kappa_mode, liquidity_kappa, risk_fraction_q, liquidity_kappa_mode)
  position_sizing:
    min_position_size_usd: 10
    liquidity_based_cap_usd: 10000
  
  # EP-01.2-INT: EntryPlan for ATR-based entry/SL/TP computation
  entry_plan:
    enabled: true
    atr_period: 14  # Must match FE bar volatility ATR window
    entry_k_atr: 0.3  # Entry offset = 0.3 * ATR from ref price
    sl_k_atr: 1.5  # Stop-loss = 1.5 * ATR distance
    tp_k_atr: 2.0  # Take-profit = 2.0 * ATR distance
    obi_weight: 0.3  # OBI modulation weight (0 = off, 1 = full)
    obi_mod_clamp_min: 0.8  # Anti-taker drift: min multiplier
    obi_mod_clamp_max: 1.2  # Anti-taker drift: max multiplier
    require_atr: true  # Fail-closed: reject if ATR not ready
    obi_missing_policy: neutral  # EXPLICIT: use multiplier=1.0 when OBI missing
  
  qos:
    # LIVE SAFETY: stop intent spam and "shadow pass-through".
    # NOTE: `defer` requires a running asyncio loop (not available in this runtime),
    # so we use `enforce` to hard-block intents when QoS rules are violated.
    exposure_block_cooldown_sec: 60
    # TUNED FOR LIVE (3m/5m bars): keep anti-spam dedup, avoid starving entries.
    # Math: 10s cooldown => max ~6 entry intents/min/symbol (aligns with rate cap).
    symbol_cooldown_sec: 3
    max_intents_per_minute_per_symbol: 20
    mode: enforce
    enforce: true
    # Apply QoS only for Aurora strategy; MeanReversion uses its own cadence and should not be blocked here.
    apply_to_strategies: ["aurora"]

  # Flip-orchestration smoothing (reduce churn on marginal reversals)
  flip:
    enabled: true  # GLOBAL KILLSWITCH: must be true for ANY flip to work. Per-symbol config controls specifics.

  features:
    ttl_sec: 30  # Increased from 5 to 30 seconds to avoid features_stale blocks
  
  bar_gating:
    enable: false
    bar_ms: 900000  # 15 minutes
  
  behavior_fsm:
    enable: false
    high_vol_multiplier: 2.0
    low_vol_multiplier: 0.5
  
  # Commit 5: Risk Skew Guard
  risk_skew:
    # LIVE SAFETY: Max age difference between features.ts and risk.ts
    max_skew_sec: 5             # LIVE: 5 seconds max staleness
    max_defer_count: 3        # Max DEFERs per symbol before NO_TRADE_UNTIL_REFRESH
    defer_cooldown_sec: 2     # Cooldown between deferred retries
    defer_window_sec: 60      # Window duration (seconds) - resets defer_count after this period
    until_refresh_retry_sec: 30  # Retry delay when in NO_TRADE_UNTIL_REFRESH state

  # Risk Gate Alert Thresholds (monitoring blocked intents)
  risk_gate:
    threshold_pct_testnet: 20.0     # Alert if >20% intents blocked (testnet)
    threshold_pct_production: 50.0  # Alert if >50% intents blocked (production)
    min_intents_for_check: 10       # Minimum intents before checking threshold

  arming:
    require_regime_warmup: true
    retry_backoff_ms: 250
    max_attempts: 3

  # DM-DIR-SSOT-STRICT-01: Directional sanity gate (SSOT-required).
  # Note: enabled can be overridden per profile; block must exist for LIVE.
  directional_sanity:
    # LIVE SAFETY: Blocks entries against established trend direction.
    enabled: true
    min_abs_delta_price: 0.0
    min_confidence: 0.0
    # FIX-NRR026-BACKTEST: Reduced from 2 to 1 for bar-based backtest.
    # With 5m bars, requiring 2 consecutive bars (10 min) for trend confirmation
    # is too restrictive. Single bar direction is sufficient for bar-based trading.
    # LIVE: Consider setting back to 2 for more conservative trend detection.
    consecutive_bars: 1

  # PRICE-MOTION-SSOT-STRICT-01: Multi-window safety layer (SSOT-required).
  # Blocks opening positions against persistent negative/positive price motion.
  price_motion_sanity:
    # LIVE SAFETY: Anti-FOMO protection using tick-level price motion.
    enabled: true
    k_vol: 2.0
    flash_window_sec: 60
    bleed_window_sec: 300
    flash_threshold_norm: 1.0
    bleed_threshold_norm: 0.5
    require_bleed_ready: true
    # VOL-ADJ-GATES-CLIP-CONFIG-01: pm_norm clipping bound for Anti-FOMO detection
    pm_norm_clip_abs: 10.0

  # P1: Degraded DecisionContext gate (fail-closed) — OFF by default.
  # If enabled, DecisionMaking may DEFER when critical features are missing/invalid.
  fail_closed_on_degraded_context: false

  # Optional global critical keys; if empty, a safe default set is used in code.
  degraded_context_critical_keys: []

  # Optional per-strategy overrides (strategy_id -> list of critical keys).
  degraded_context_critical_keys_by_strategy: {}

feature_engineering:
  enable_new_metrics: true
  volume_input_mode: integrate
  enabled_timeframes_sec: [180, 300, 900]

  ema:
    period_short: 1 # was 3
    period_long: 2 # was 7 (min allowed: 2)

  volume:
    sma_length: 2 # was 5 (min allowed: 2)
    window_sec: 5 # was 60
    min_window_volume_usd: 0.0 # was 1000.0

  volatility:
    sma_length: 2 # was 10 (min allowed: 2)
    window_sec: 5 # was 60

  liquidity:
    depth_half: 1000.0
    kappa_min: 0.3
    kappa_max: 1.0

  ema_bias:
    clamp_min: -0.02
    clamp_max: 0.02

  volume_spike:
    cap_max: 3.0
    sma_len: 5
    eps: 0.000000001

  volume_zscore:
    clip_sigma: 5.0

  large_trade_imbalance:
    enabled: true
    window_ms: 1000 # was 60000
    min_trades: 1 # was 10
    eps: 0.000000000001
    use_notional: false

  depth_imbalance:
    use_laplace_smoothing: true

  delta_price:
    spike_filter_ms: 600000  # 10 minutes (600000ms) - supports 5m bar backtest (300000ms gaps)

  macro_sync:
    enabled: true
    time_diff_threshold_ms: 60000
    ttl_ms: 60000
    min_buffer_size: 2 # was 3 (min allowed: 2)
    window: 12
    bin_ms: 5000
    max_gap_bins: 2
    max_late_ms: 5000
    eps: 0.000000000001
    anchors: ["BTCUSDT", "ETHUSDT"]
    align_mode: tail_min_len
    anchor_update_from_ticks: true

  defaults:
    neutral_value: 0.5
    zero_value: 0.0
    correlation_default: 0.0
    ms_per_sec: 1000

  # ═══════════════════════════════════════════════════════════════════════════════
  # P0-0: READINESS CONTRACT REGISTRY (SSOT)
  # ═══════════════════════════════════════════════════════════════════════════════
  # All keys that FE can emit in warmup.ready. essential_features MUST be subset.
  readiness_registry:
    declared_keys:
      - obi
      - tfi
      - delta_price
      - depth_imbalance
      - liquidity_kappa
      - absorption
      - ema_bias
      - volume_spike
      - volatility_state
      - macro_sync        # Legacy, kept for telemetry
      - macro_resid       # R1: Beta-adjusted residual (replaces macro_sync for direction)
      - spread_bps
      - large_trade_imbalance
      - volume_zscore

  # ═══════════════════════════════════════════════════════════════════════════════
  # WARMUP ENFORCEMENT: MANDATORY MODE (NOT A SWITCH!)
  # ═══════════════════════════════════════════════════════════════════════════════
  warmup:
    # LIVE SAFETY: fail_fast — system does not trade until all features ready
    enforcement_mode: fail_fast  # Options: disabled | fail_fast
    # TASK-ZOMBIE-FIX: Removed validate_essential_subset (dead, never read in runtime)
    # Invariant: full_ready=True ⇒ all declared_keys present
    check_full_ready_invariant: true

  # ═══════════════════════════════════════════════════════════════════════════════
  # P0-1: VOLATILITY STATE HARD FLOOR + CAP + FIREWALL
  # TASK-ZOMBIE-FIX: Removed dead fields (hard_floor_enabled, hist_floor_enabled, hist_floor_k_small)
  # ═══════════════════════════════════════════════════════════════════════════════
  volatility_state:
    cap_max: 3.0
    tick_floor: 0.0001
    division_eps: 0.000000001

  # ═══════════════════════════════════════════════════════════════════════════════
  # P0-2: SPREAD BPS HEALTH GATE (Book Truth Validation)
  # ═══════════════════════════════════════════════════════════════════════════════
  spread_bps:
    health_gate:
      enabled: true
      max_age_sec: 5.0              # STEP 1: Hard fail if book older than this
      min_update_events: 1          # STEP 2: Min book update events (any: qty/levels/price)
      min_trades_count: 1           # STEP 2: Min trades in window (OR with update_events)
      window_sec: 10.0              # Lookback window for counting

  # ═══════════════════════════════════════════════════════════════════════════════
  # P0-3: FEATURE SANITY FIREWALL (Central NaN/Inf/Out-of-Range Protection)
  # ═══════════════════════════════════════════════════════════════════════════════
  feature_sanity:
    enabled: true
    # Behavior on NaN/Inf: neutral_and_not_ready = return neutral + mark not_ready
    nan_inf_behavior: neutral_and_not_ready
    # Feature bounds (per-semantic-type)
    feature_bounds:
      # Signed features (directional) [-1, 1]
      obi: { min: -1.0, max: 1.0 }
      tfi: { min: -1.0, max: 1.0 }
      absorption: { min: -1.0, max: 1.0 }  # R2: SIGNED feature
      # R1: macro_resid is SIGNED with wider range
      macro_resid: { min: -3.0, max: 3.0 }
      # Normalized features [0, 1]
      ema_bias: { min: 0.0, max: 1.0 }
      volatility_state: { min: 0.0, max: 1.0 }
      liquidity_kappa: { min: 0.0, max: 1.0 }
      depth_imbalance: { min: 0.0, max: 1.0 }
      volume_spike: { min: 0.0, max: 10.0 }
      volume_zscore: { min: 0.0, max: 1.0 }
      macro_sync: { min: 0.0, max: 1.0 }  # Legacy, kept for telemetry
      large_trade_imbalance: { min: 0.0, max: 1.0 }
      # Raw physical features (non-negative)
      spread_bps: { min: 0.0, max: 10000.0 }

  # ═══════════════════════════════════════════════════════════════════════════════
  # R1 (P1): MACRO RESID — Beta-Adjusted Residual (replaces macro_sync for direction)
  # ═══════════════════════════════════════════════════════════════════════════════
  # Why: macro_sync (correlation-based) is UNSIGNED [0,1] → can't see SELL.
  # macro_resid = r_asset - beta * r_btc → SIGNED, neutral=0, sees both directions.
  # Formula: resid = r_asset - beta * r_btc; macro_resid = clip(resid/scale, -clip, +clip)
  macro_resid:
    enabled: true
    # Rolling beta estimation: beta = cov(r_asset, r_btc) / var(r_btc)
    beta_window: 60             # Window for beta calculation (samples)
    # Robust scaling via MAD (Median Absolute Deviation)
    mad_window: 30              # Window for MAD calculation (samples)
    # Winsorizing extremes before beta calculation
    winsor_percentile: 0.05     # Winsorize top/bottom 5%
    # Floor for var(r_btc) to prevent div-by-near-zero
    var_floor: 0.000000001      # 1e-9
    # Floor for MAD scale to prevent explosion
    scale_floor: 0.0001         # 1e-4
    # Output clip bounds
    clip: 3.0                   # |macro_resid| <= 3.0
    # Semantic definition
    neutral: 0.0                # SIGNED feature: neutral is 0.0
    # TASK-ZOMBIE-FIX: Removed bounds (dead, feature_sanity.feature_bounds is SSOT)

  # ═══════════════════════════════════════════════════════════════════════════════
  # R2 (P2): ABSORPTION — Experimental (Default OFF, no live impact)
  # ═══════════════════════════════════════════════════════════════════════════════
  # When enabled, uses aggressive_trade_imbalance as proxy.
  # Has dedup guard: mutes if correlated with TFI (would be redundant signal).
  absorption:
    mode: disabled              # disabled | proxy | full
    # Proxy source: must NOT be 'tfi' (would be absurd)
    proxy:
      source: aggressive_trade_imbalance
      window: 30                # Rolling window for proxy calculation
      eps: 0.0001               # Epsilon for division safety
    # Dedup guard: mute absorption if too correlated with TFI
    dedup:
      enabled: true
      window: 60                # Rolling correlation window
      threshold: 0.8            # If |corr(absorption, TFI)| > threshold → mute
    # Output clipping
    clip: 1.0                   # |absorption| <= 1.0
    # Semantic definition
    neutral: 0.0                # SIGNED feature: neutral is 0.0
    # TASK-ZOMBIE-FIX: Removed bounds (dead, feature_sanity.feature_bounds is SSOT)

risk_management:
  # Commit 6: Disable placeholder absorption penalty by default
  use_absorption_penalty: false
  risk_score_weights:
    delta_price_pct: 0.1
    obi: 0.3
    tfi: 0.3
    absorption_inverse: 0.3
  
  trading_allowed_thresholds:
    max_risk_score: 0.96  # Increased by 20% to allow more trading
  
  validation:
    total_weight_min: 0.5
    total_weight_max: 2.0

position_tracking:
  precision:
    quantity_min_threshold: 1e-9
    flat_position_threshold: 1e-12
    decimal_places: 2
  # Portfolio freshness TTL for AuroraBridge gate
  # Must be > account_observer.poll_interval_sec to avoid race conditions
  positions_stale_ttl_sec: 15
  
  # TASK-ZOMBIE-FIX: Removed thread_timeouts section (dead, join_timeout_sec never read in runtime)
  enable_market_tick_subscription: false

# NOTE: account_observer section removed (TASK-ACCOUNT-OBSERVER-REACHABILITY-DELETE-01)
# AccountObserver was Legacy Spot code, system now uses Futures-only via ExecPosFSM.

execution_position:
  # P1-CONFIG-EXTRACTION: Fallback mode configuration (fail-closed SSOT)
  # Consumed by: exposure_guard.py:_load_fallback_config()
  fallback:
    policy: fail_closed           # fail_closed = block all, reduce_exposure = scale down
    risk_reduction_pct: 0.5       # Exposure reduction when policy=reduce_exposure
    backoff_ms: [200, 500, 1000]  # Retry backoff intervals (ms)

  # TASK-ZOMBIE-FIX: Removed duplicate watchdog section (FSM reads from trading.execution.watchdog)
  
  exposure_guard:
    pending_ttl_sec: 90
    post_fill_ttl_sec: 5
    stale_ttl_sec: 60  # Increased from 15 to allow for slower portfolio updates
    # PURGE-DEAD-CONFIG-03: pending_timeout_sec removed (never read in runtime)
    # FIX: Values should be percentages (0-100), not fractions (0-1)!
    # 0.95 meant "0.95% of equity" which blocked almost all trades.
    # Correct values: 95 means "95% of equity".
    # UPDATED: 150% to allow BTC with leverage=20 and margin_pct=0.06 (120% equity)
    max_equity_utilization_pct: 150.0
    max_portfolio_fraction: 150.0
    max_long_utilization_pct: 150.0
    max_short_utilization_pct: 150.0
    max_directional_ratio: 20.0
    # FIX-BACKTEST-CONCENTRATION: Increased from 19% to 500% for backtest.
    # MockBroker uses leverage=1, so $10k notional = $10k margin (should be ~$200 at 50x).
    # With 19% limit ($1,900), any BTC order exceeds this. Set to 500% to disable for backtest.
    # LIVE: Set back to 19% or appropriate value for per-symbol risk limits!
    max_concentration_pct: 500.0
  
  fsm_open:
    idempotency_window_sec: 60
  
  order_index:
    ttl_sec: 3600
  
  # TASK51-C: In-flight order reconciliation config
  inflight_reconcile:
    inflight_ttl_sec: 60      # TTL before reconciliation check (seconds)
    max_ttl_sec: 120          # Force-clear after this TTL (seconds)
    reconcile_interval_sec: 10  # Interval between reconcile attempts
    # PURGE-DEAD-CONFIG-03: reconcile_retries/backoff_ms removed (retry logic not implemented)
    verbose_logging: true     # Log reconciliation details
  
  metrics_collector:
    window_size_minutes: 60
    recent_rejections_minutes: 5
  
  idempotent_cancel:
    max_retries: 2
  
  utils:
    client_order_id_max_length: 32
    basis_points_base: 10000.0

  # FSM event deduplication (bounded memory)
  event_dedup:
    max_size: 100000
    ttl_ms: 86400000  # 24 hours

  # EP-01.3-INT: Per-timeframe pending entry TTL
  # When LIMIT entry order is placed, valid_for_ms = ttl_by_tf_sec[tf_sec] * 1000
  # Cancel triggers: TTL expired, regime change, supersede, panic
  pending_entry_ttl:
    enabled: true
    # Map: timeframe_seconds -> entry_ttl_seconds
    # 3m bar = 45s TTL, 5m = 60s, 15m = 180s
    ttl_by_tf_sec:
      180: 45     # 3m bars: 45 sec TTL
      300: 60     # 5m bars: 60 sec TTL
      900: 180    # 15m bars: 180 sec (3 min) TTL
    reject_unknown_tf: true   # fail-closed: reject if tf not in map
    cancel_on_regime_change: true
    cancel_on_supersede: true
    cancel_on_panic: true
    # DET-BT-13: Timeout (seconds) to wait for supersede cancel confirmation (STRICT SSOT)
    supersede_cancel_timeout_sec: 5.0

  # EP-01.4-INT-B: Maker-only (post-only) entry orders
  # When enabled, LIMIT entry orders use tif="GTX" (post-only)
  # If order would cross the book, it's rejected (MAKER_ONLY_REJECT)
  # NO FALLBACK to market. Entry aborted on reject.
  maker_only_entry:
    enabled: false          # Set to true to enforce maker-only entries
    # PURGE-DEAD-CONFIG-03: tif_value/reject_on_fail removed (hardcoded GTX, always reject)

  # ORDER-POLICY-01: Global order capabilities (SSOT)
  # This is what the execution layer supports. Strategy policies must be a subset.
  order_capabilities:
    supported_order_types: ["LIMIT", "MARKET"]
    supported_tif: ["GTC", "GTX", "IOC", "FOK"]
  # ═══════════════════════════════════════════════════════════════════════════════
  # MAGIC-NUM-EXTRACTION: Bracket Placement Configuration
  # ═══════════════════════════════════════════════════════════════════════════════
  # Handles Binance -2021 error: "The stop price is too close to the mark price"
  # Strategy: Progressive TP widening with exponential backoff
  bracket_placement:
    # First retry: widen TP by 20 bps (0.2%) - handles most transient cases
    tp_widen_first_bps: 20
    # Second retry: widen TP by 50 bps (0.5%) - handles volatile markets
    tp_widen_second_bps: 50
    # Backoff delays between retries (ms) - exponential: 200, 400
    retry_backoff_ms: [200, 400]

  # ═══════════════════════════════════════════════════════════════════════════════
  # MAGIC-NUM-EXTRACTION: Order Lifecycle Timing Configuration
  # ═══════════════════════════════════════════════════════════════════════════════
  # Timing parameters for order lifecycle stages
  order_lifecycle:
    # Delay after MARKET fill before bracket placement (REST API propagation lag)
    # Binance Futures typical: 300-500ms for position update after fill
    fill_settlement_delay_ms: 500
    # Delay after CLOSE before orphan bracket cleanup (exchange-side settlement)
    # Conservative: 2000ms to ensure all exchange state is finalized
    position_close_cleanup_delay_ms: 2000

  # ═══════════════════════════════════════════════════════════════════════════════
  # MAGIC-NUM-EXTRACTION: Shadow Exposure Check Configuration
  # ═══════════════════════════════════════════════════════════════════════════════
  # Periodic validation: FSM-tracked exposure vs exchange-reported positions
  # Detects state drift between internal tracking and exchange reality
  shadow_check:
    enabled: true
    # Run shadow check every N exposure requests (sampling rate)
    # 10 = ~10% sampling on average, balances cost vs detection speed
    check_every_n_requests: 10
    # Allowed mismatch percentage before warning (1.0 = 1%)
    # For most portfolios, 1% is acceptable noise from rounding/timing
    tolerance_pct: 1.0
    # Absolute mismatch threshold in USD (for large portfolios)
    # $5k absolute is more meaningful than 1% for $1M+ portfolios
    absolute_threshold_usd: 5000.0
    # Use absolute threshold for large portfolios
    use_absolute_for_large_portfolios: true
    # Portfolio size threshold for switching to absolute tolerance
    large_portfolio_threshold_usd: 1000000.0

  # ═══════════════════════════════════════════════════════════════════════════════
  # MAGIC-NUM-EXTRACTION: OrderGuardian Configuration
  # ═══════════════════════════════════════════════════════════════════════════════
  # Centralized orphan bracket detection and cleanup
  guardian:
    # Polling interval for reconciliation loop (ms)
    # 500ms balances responsiveness vs exchange rate limits
    poll_interval_ms: 500
    # Unified mode: single reconcile loop for all symbols
    unified: true
    # Emit EVT:SYMBOL_TIDY after successful orphan cleanup
    emit_tidy_event: true
    # TTL before considering bracket as orphaned (ms)
    cleanup_ttl_ms: 6000
    # Cooldown after symbol tidy before next cleanup attempt (ms)
    symbol_cooldown_ms: 4000