# Domain-specific configurations

debug:
  # DEV/SHADOW ONLY: disables position stale gate. Never enable in live.
  disable_positions_stale_gate: false

  # DEV/SHADOW ONLY: disables daily drawdown/loss limit gate. Never enable in live.
  disable_daily_loss_limit: false

decision_making:
  position_sizing:
    min_position_size_usd: 10
    liquidity_based_cap_usd: 10000
    risk_fraction_q: null
    liquidity_kappa: 1.0
    kappa_mode: dynamic
    liquidity_kappa_mode: dynamic
    risk_contract_v1: null
    sizing:
      # TASK42: 5% equity, no fixed_qty, no fixed_notional
      mode: percent_equity
      percent_equity: 0.05
  
  qos:
    exposure_block_cooldown_sec: 10
    symbol_cooldown_sec: 3
    max_intents_per_minute_per_symbol: 6
    mode: shadow  # defer broken (no event loop), shadow = only log, allow trading
    enforce: false
  
  features:
    ttl_sec: 30  # Increased from 5 to 30 seconds to avoid features_stale blocks
  
  bar_gating:
    enable: false
    bar_ms: 900000  # 15 minutes
  
  behavior_fsm:
    enable: false
    high_vol_multiplier: 2.0
    low_vol_multiplier: 0.5
  
  signals:
    normalize: false
    enable_new_metrics: true
  
  # Commit 5: Risk Skew Guard
  risk_skew:
    max_skew_sec: 5           # Max age difference between features.ts and risk.ts
    max_defer_count: 3        # Max DEFERs per symbol before NO_TRADE_UNTIL_REFRESH
    defer_cooldown_sec: 2     # Cooldown between deferred retries

  arming:
    require_regime_warmup: true
    retry_backoff_ms: 250
    max_attempts: 3

feature_engineering:
  enable_new_metrics: true
  volume_input_mode: integrate

  ema:
    period_short: 3
    period_long: 7

  volume:
    sma_length: 5
    window_sec: 60
    min_window_volume_usd: 1000.0

  volatility:
    sma_length: 10
    window_sec: 60

  liquidity:
    depth_half: 1000.0
    kappa_min: 0.3
    kappa_max: 1.0

  ema_bias:
    clamp_min: -0.02
    clamp_max: 0.02

  volume_spike:
    cap_max: 3.0
    sma_len: 5
    eps: 0.000000001

  large_trade_imbalance:
    window_ms: 60000
    min_trades: 10
    eps: 0.000000000001
    use_notional: false

  volatility_state:
    cap_max: 3.0

  depth_imbalance:
    use_laplace_smoothing: true

  delta_price:
    spike_filter_ms: 60000

  macro_sync:
    enabled: true
    time_diff_threshold_ms: 60000
    ttl_ms: 60000
    min_buffer_size: 3
    window: 12
    bin_ms: 5000
    max_gap_bins: 2
    eps: 0.000000000001
    anchors: ["BTCUSDT", "ETHUSDT"]
    align_mode: tail_min_len
    anchor_update_from_ticks: false

  defaults:
    neutral_value: 0.5
    zero_value: 0.0
    correlation_default: 0.0
    ms_per_sec: 1000

risk_management:
  # Commit 6: Disable placeholder absorption penalty by default
  use_absorption_penalty: false
  risk_score_weights:
    delta_price_pct: 0.1
    obi: 0.3
    tfi: 0.3
    absorption_inverse: 0.3
  
  trading_allowed_thresholds:
    max_risk_score: 0.96  # Increased by 20% to allow more trading
  
  validation:
    total_weight_min: 0.5
    total_weight_max: 2.0

position_tracking:
  precision:
    quantity_min_threshold: 1e-9
    flat_position_threshold: 1e-12
    decimal_places: 2
  # Portfolio freshness TTL for AuroraBridge gate
  # Must be > account_observer.poll_interval_sec to avoid race conditions
  positions_stale_ttl_sec: 15
  
  thread_timeouts:
    join_timeout_sec: 10
  enable_market_tick_subscription: false

account_observer:
  poll_interval_sec: 5
  trade_limit: 10
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - DOGEUSDT
    - XRPUSDT
  thread_timeouts:
    join_timeout_sec: 10

execution_position:
  watchdog:
    ack_ttl_ms: 8000
    fill_ttl_ms: 30000
    check_interval_ms: 1000
    rps_limit: 10
  
  exposure_guard:
    pending_ttl_sec: 90
    post_fill_ttl_sec: 5
    stale_ttl_sec: 60  # Increased from 15 to allow for slower portfolio updates
    pending_timeout_sec: 5
    max_equity_utilization_pct: 0.95
    max_portfolio_fraction: 0.95
    max_long_utilization_pct: 0.95
    max_short_utilization_pct: 0.95
    max_directional_ratio: 20.0
    max_concentration_pct: 0.10
  
  fsm_open:
    idempotency_window_sec: 60
  
  order_index:
    ttl_sec: 3600
  
  # TASK51-C: In-flight order reconciliation config
  inflight_reconcile:
    inflight_ttl_sec: 60      # TTL before reconciliation check (seconds)
    max_ttl_sec: 120          # Force-clear after this TTL (seconds)
    reconcile_interval_sec: 10  # Interval between reconcile attempts
    reconcile_retries: 3      # Number of REST retries
    reconcile_backoff_ms: 500 # Backoff between retries
    verbose_logging: true     # Log reconciliation details
  
  metrics_collector:
    window_size_minutes: 60
    recent_rejections_minutes: 5
  
  idempotent_cancel:
    max_retries: 2
  
  utils:
    client_order_id_max_length: 32
    basis_points_base: 10000.0
