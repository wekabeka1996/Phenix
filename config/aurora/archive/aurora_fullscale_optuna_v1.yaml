      tp_high_ratio: 1.57     # TP2 = 1.57 × SL (~3.8%)
      partial_exit_pct: 0.41  # Exit 41% at TP1, keep 59% runner
      
    # Trailing Stop (Phase 3+)
    trailing_stop:
      enabled: true
      activation_pct: 0.015   # Early activation +1.5%
      distance_pct: 0.018     # Wide trailing 1.8%
      
    # Cooldown
    execution:
      cooldown_sec: 165       # 2.75 min between trades
      
    # Commentary
    notes: |
      XRP benefits from wide trailing stop distance.
      - Early trailing activation captures moves
      - Wide trailing distance prevents premature exits
      - Longer holds give reversals time to complete

  # ==============================================================================
  # BTCUSDT - 🥉 SOLID PERFORMER (Calmar 2.87)
