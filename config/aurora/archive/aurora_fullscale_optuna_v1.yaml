# ===================================================================================
# Aurora Mean Reversion Full-Scale Optimization Results
# ===================================================================================
# Generated from Optuna 15,000-trial optimization (3000 per asset)
# Date: 2025-12-05
# Data: January 2024 (1-minute bars)
# Strategy: Bollinger Bands Mean Reversion with Phase 3+ Execution
# Total Portfolio PnL: +$694.07
# ===================================================================================

aurora_fullscale_optimization_v1:
  # ==============================================================================
  # Global Configuration
  # ==============================================================================
  global:
    strategy_mode: "mean_reversion"
    timeframe_sec: 60  # 1-minute bars
    cost_basis: 0.0006  # 0.06% taker fee
    
    # Allowed regimes for mean reversion (from data analysis)
    allowed_regimes:
      - MEAN_REVERSION
      - LOW_VOLATILITY
      - UNCERTAIN
  
  # ==============================================================================
  # DOGEUSDT - 🥇 CHAMPION (Calmar 6.91)
  # ==============================================================================
  # Best performer: highest PnL, best risk-adjusted returns
  # Strategy: Fast BB window (20), long holds (108 min), aggressive TP
  # ==============================================================================
  DOGEUSDT:
    enabled: true
    
    # Performance Metrics
    training_metrics:
      pnl_usd: 387.24
      trades: 230
      win_rate: 0.587
      max_dd_usd: -56.08
      calmar_ratio: 6.91
      trials: 3000
      
    # Bollinger Bands
    bollinger_bands:
      bb_window: 20           # Fastest reaction (20 min)
      bb_std_dev: 2.1         # Standard width
      
    # Entry Filters
    entry:
      min_vol_atr: 0.005      # Low threshold 0.5% (more signals)
      
    # Stop Loss
    stop_loss:
      sl_pct: 0.019           # 1.9% stop loss
      
    # Time Exit
    time_exit:
      max_hold_sec: 6480      # 108 minutes (longest! allows DOGE pumps)
      
    # Take Profit (Phase 3+)
    take_profit:
      tp_low_ratio: 0.63      # TP1 = 0.63 × SL (~1.2%)
      tp_high_ratio: 2.45     # TP2 = 2.45 × SL (~4.7%) - MOST AGGRESSIVE
      partial_exit_pct: 0.38  # Exit 38% at TP1, keep 62% for runner
      
    # Trailing Stop (Phase 3+)
    trailing_stop:
      enabled: true
      activation_pct: 0.012   # Early activation at +1.2%
      distance_pct: 0.004     # Tight trailing 0.4%
      
    # Cooldown
    execution:
      cooldown_sec: 210       # 3.5 min between trades
      
    # Commentary
    notes: |
      DOGE has the most "pump and dump" patterns, ideal for mean reversion.
      - Shortest BB window captures quick reversals
      - Longest hold time allows pumps to mature
      - Most aggressive TP2 captures large moves
      - Early trailing activation locks profits

  # ==============================================================================
  # XRPUSDT - 🥈 RUNNER-UP (Calmar 3.02)
  # ==============================================================================
  # Second best: excellent risk-adjusted returns
  # Strategy: Mid BB window (40), long holds (49 min), wide trailing
  # ==============================================================================
