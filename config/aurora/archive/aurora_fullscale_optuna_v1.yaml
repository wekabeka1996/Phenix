    bollinger_bands:
      bb_window: 40           # 40 min window
      bb_std_dev: 2.5         # Wider bands (2.5σ)
      
    # Entry Filters
    entry:
      min_vol_atr: 0.007      # Low threshold 0.7%
      
    # Stop Loss
    stop_loss:
      sl_pct: 0.024           # 2.4% stop loss
      
    # Time Exit
    time_exit:
      max_hold_sec: 2940      # 49 minutes
      
    # Take Profit (Phase 3+)
    take_profit:
