# Aurora Phase 3 Production Configuration
# ==========================================
#    Phase 3 ("Full Spectrum Optimization")
# : Side-Bias Penalty, Regime-Adaptive Thresholds/Sizing, 
#          EMA Clamping, Risk Score Weights

aurora_phase3:
  # ==========================================================================
  # SOLUSDT - 3m Timeframe
  # ==========================================================================
  # Performance: $318.94/month (+58% vs Phase 2)
  # Key insight: Disable side-bias, maximize low-vol sizing
  # ==========================================================================
  SOLUSDT:
    enabled: true
    timeframe: "3m"
    bar_seconds: 180
    capital_usd: 1000
    
    # Training Metrics (Phase 3)
    training_metrics:
      pnl_usd: 318.94
      improvement_vs_phase2: 58.2%
      source: "Phase 3 Full Spectrum (3000 trials)"
    
    # ====================
    # CORE SIGNAL FEATURES
    # ====================
    features:
      ema:
        period_short: 7
        period_long: 25
        # Phase 3: EMA Clamping Range (trend sensitivity)
        # Wider range = better trend capture
        clamp_min: -0.045  # -4.5% = full bearish
        clamp_max: 0.045   # +4.5% = full bullish
      
      volume:
        window_sec: 280
        sma_length: 16
        cap_max: 3.439
      
      liquidity:
        depth_half: 3000.0
        kappa_min: 0.345
      
      obi:
        window_sec: 70
      
      tfi:
        window_sec: 160
      
      volatility:
        window_sec: 150
        sma_length: 4
        cap_max: 4.777
      
      depth_imbalance:
        use_smoothing: false
      
      delta_price:
        spike_filter_ms: 10000
      
      macro_sync:
        window: 90
    
    # ====================
    # SIGNAL WEIGHTS
    # ====================
    weights:
      ema: 0.467
      volume: 0.242
      macro: 0.227
      liquidity: 0.138
      obi: 0.344
      tfi: 0.363
      volatility: 0.393
      depth_imbalance: 0.241
      delta_price: 0.176
    
    # ====================
    # PHASE 3: RISK SCORE COMPOSITION
    # ====================
    # Controls what constitutes "high risk" for filtering trades
    risk_weights:
      delta_price: 0.4    # Price movement risk (primary)
      volume: 0.4         # Volume surge risk (primary)
      volatility: 0.2     # Range expansion risk (secondary)
    
    # ====================
    # PHASE 3: SIDE-BIAS PENALTY (Anti-Persistency)
    # ====================
    # Prevents "catching falling knives" by penalizing repeated same-side trades
    # SOLUSDT: DISABLED (0.0) - strong directional trends don't need protection
    side_bias:
      penalty_factor: 0.0      # 0.0 = disabled, 1.0 = maximum penalty
      window_sec: 180          # Lookback window for trade history
      target_ratio: 0.6        # Max 60% same-side trades allowed
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE THRESHOLDS
    # ====================
    # Dynamically adjust signal_threshold based on market regime
    # "Be stricter in chaos, looser in calm"
    regime_thresholds:
      high_volatility_multiplier: 1.8   # 80% STRICTER in HIGH_VOL
      low_volatility_multiplier: 0.65   # 35% LOOSER in LOW_VOL
      trend_multiplier: 1.0             # No change for TREND regimes
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE SIZING
    # ====================
    # Dynamically adjust position size based on market regime
    # "Bet small in chaos, bet big in calm"
    regime_sizing:
      high_volatility_multiplier: 0.6   # 40% SMALLER in HIGH_VOL
      low_volatility_multiplier: 2.0    # 2x LARGER in LOW_VOL (MAXIMUM)
      mean_reversion_multiplier: 0.7    # 30% smaller in MEAN_REV
      base_size_usd: 1000.0
    
    # ====================
    # DECISION & RISK
    # ====================
    decision:
      signal_threshold: 0.11
      max_risk_score: 0.784
      allowed_regimes:
        - TREND_DOWN
    
    # ====================
    # EXIT PARAMETERS
    # ====================
    exit:
      sl_pct: 0.526            # 52.6% stop loss
      max_hold_sec: 660        # 11 minutes max hold

  # ==========================================================================
  # ETHUSDT - 5m Timeframe
  # ==========================================================================
  # Performance: $130.50/month (+23% vs DEEP)
  # Key insight: Maximum side-bias penalty (mean-reversion heavy)
  # ==========================================================================
  ETHUSDT:
    enabled: true
    timeframe: "5m"
    bar_seconds: 300
    capital_usd: 1000
    
    # Training Metrics (Phase 3)
    training_metrics:
      pnl_usd: 130.50
      improvement_vs_deep: 23.2%
      source: "Phase 3 Full Spectrum (3000 trials)"
    
    # ====================
    # CORE SIGNAL FEATURES
    # ====================
    features:
      ema:
        period_short: 4
        period_long: 19
        # Phase 3: Moderate EMA clamping
        clamp_min: -0.03   # -3% = full bearish
        clamp_max: 0.03    # +3% = full bullish
      
      volume:
        window_sec: 60
        sma_length: 12
        cap_max: 4.814
      
      liquidity:
        depth_half: 1250.0
        kappa_min: 0.463
      
      obi:
        window_sec: 145
      
      tfi:
        window_sec: 290
      
      volatility:
        window_sec: 290
        sma_length: 3
        cap_max: 4.373
      
      depth_imbalance:
        use_smoothing: false
      
      delta_price:
        spike_filter_ms: 5000
      
      macro_sync:
        window: 40
    
    # ====================
    # SIGNAL WEIGHTS
    # ====================
    weights:
      ema: 0.058
      volume: 0.241
      macro: 0.131
      liquidity: 0.341
      obi: 0.155
      tfi: 0.093
      volatility: 0.036
      depth_imbalance: 0.256
      delta_price: 0.253
    
    # ====================
    # PHASE 3: RISK SCORE COMPOSITION
    # ====================
    risk_weights:
      delta_price: 0.4    # Balanced composition
      volume: 0.5
      volatility: 0.1
    
    # ====================
    # PHASE 3: SIDE-BIAS PENALTY
    # ====================
    # ETHUSDT: MAXIMUM (0.9) - strong mean-reversion needs protection
    side_bias:
      penalty_factor: 0.9      # MAXIMUM penalty (ETH reverses frequently)
      window_sec: 600          # 10-minute lookback
      target_ratio: 0.6
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE THRESHOLDS
    # ====================
    regime_thresholds:
      high_volatility_multiplier: 1.3   # 30% STRICTER
      low_volatility_multiplier: 0.85   # 15% LOOSER
      trend_multiplier: 1.05            # Slightly stricter in trends
    
    # ====================
    # PHASE 3: REGIME-ADAPTIVE SIZING
    # ====================
    regime_sizing:
      high_volatility_multiplier: 0.3   # 70% SMALLER (minimize risk)
      low_volatility_multiplier: 1.9    # 90% LARGER
      mean_reversion_multiplier: 0.8    # 20% smaller in MEAN_REV
      base_size_usd: 1000.0
    
    # ====================
    # DECISION & RISK
    # ====================
    decision:
      signal_threshold: 0.271
      max_risk_score: 0.756
      allowed_regimes:
        - TREND_DOWN
        - LOW_VOLATILITY
    
    # ====================
    # EXIT PARAMETERS
    # ====================
    exit:
      sl_pct: 0.019            # 1.9% stop loss (tight)
      max_hold_sec: 900        # 15 minutes

