trading:
  # ==============================================================================
  # TRADING SYMBOLS CONFIGURATION
  # ==============================================================================
  symbols_to_track: ["BTCUSDT", "ETHUSDT"]  # Symbols to monitor and trade
  decision:
    signal_weights:
      obi: 0.6
      tfi: 0.35
      delta_price: 0.05
    signal_threshold: 0.15  # Increased from 0.05 to 0.15 to reduce signal frequency
    cooldown_sec: 30        # Minimum 30 seconds between signals per symbol
    position_sizing:
      min_position_size_usd: 10
      liquidity_based_cap_usd: 40000  # Increased from 10000 to 40000 (4x) to match position size increase
      risk_per_trade_pct: 0.04  # Risk 4% of equity per trade (increased from 1% to 4x position size)
      sl_bps: 50                # Stop Loss 50 bps (0.5%) for sizing calculation

  # ==============================================================================
  # INSTRUMENT SPECIFICATIONS (BINANCE FUTURES)
  # ==============================================================================
  instruments:
    BTCUSDT:
      step_size: "0.00001"  # Binance BTCUSDT step_size
      min_notional: "10"     # Minimum notional value
      leverage: 10           # Changed from 100 to align with liquidation guard (10x gives ~9.6% distance > 1.0%)
      margin_type: cross
    ETHUSDT:
      step_size: "0.001"     # Binance ETHUSDT step_size
      min_notional: "10"
      leverage: 10           # Remains 10
      margin_type: cross

  # TCA (Transaction Cost Analysis) Preferences
  tca_prefs:
    max_slippage_pct: 0.5
    preferred_venue: "binance"
    execution_priority: "speed"

  # Risk Budgets
  risk_budgets:
    max_portfolio_risk_pct: 5.0
    max_single_position_risk_pct: 4.0  # Increased from 1.0 to 4.0 to match position size increase
    max_daily_loss_pct: 2.0

  # Risk Management Settings
  risk:
    max_daily_drawdown_limit: 0.05  # 5%
    min_liquidation_distance_pct: 1.0  # 1.0% > 0.5% (sl_bps), but < 1.6% (liquidation 50x)
    score_weights:
      delta_price: 0.05
      obi: 0.35
      tfi: 0.35
      absorption_inverse: 0.25
    trading_allowed_thresholds:
      max_risk_score: 0.95  # Changed from 0.8 to allow valid risk scores (0.81-0.87) to pass

  # ==============================================================================
  # EXECUTION SETTINGS
  # ==============================================================================
  execution:
    # Default order type for opening positions.
    # Valid types: LIMIT, MARKET, STOP, STOP_MARKET, TAKE_PROFIT, TAKE_PROFIT_MARKET
    open_order_type: "MARKET"

    # Parameters for each order type
    order_params:
      LIMIT:
        timeInForce: "GTC" # Good-Till-Cancel
      STOP_MARKET:
        workingType: "MARK_PRICE"
      TAKE_PROFIT_MARKET:
        workingType: "MARK_PRICE"
      TRAILING_STOP_MARKET:
        callbackRate: "0.5" # 0.5%

  execution_position:
    max_active_orders: 5
    idempotency_window_sec: 60
    rules:                    # Rules for position management (TP/SL)
      sl_bps: 50            # Stop Loss 50 bps (0.5%)
      tp_bps: 100           # Take Profit 100 bps (1.0%)
      breakeven_bps: 20     # Breakeven point
      trail_start_bps: 30   # Trailing stop start point

  # ==============================================================================
  # DOMAIN-LEVEL CONFIGURATION
  # ==============================================================================
  # IMPORTANT: These override global trading_mode for each domain
  # Global mode: "hybrid_live_data_testnet_exec" = live data for features + testnet for execution
  domain_configuration:
    # Data sources: READ from live market
    market_data:
      trading_mode: "live"  # Read LIVE Binance data
      
    feature_engineering:
      trading_mode: "live"  # Process live features (OBI, TFI, delta_price)
      
    decision_making:
      trading_mode: "live"  # Make decisions based on live signals
      
    risk_management:
      trading_mode: "live"  # Risk scoring on live data
      
    # Execution: WRITE to testnet (safety!)
    execution_position:
      trading_mode: "testnet"  # Place orders on TESTNET only
      max_active_orders: 25    # Allow up to 25 active orders (including brackets)
      
    audit_trail:
      trading_mode: "live"  # Log from live data

  # ==============================================================================
  # ACCOUNT OBSERVER CONFIGURATION
  # ==============================================================================
  account_observer:
    poll_interval: 2  # Poll every 2 seconds for faster updates
    symbols: ["BTCUSDT", "ETHUSDT"]  # Match market_data symbols
    trade_limit: 50  # Recent trades to check per symbol
# All credentials come from .env file via ${VAR_NAME} template substitution
# ConfigLoader._resolve_env_vars() automatically converts these at load time
binance_api:
  live:
    api_key: "${BINANCE_FUTURES_API_KEY_LIVE}"
    api_secret: "${BINANCE_FUTURES_API_SECRET_LIVE}"
    rest_url: "${BINANCE_FUTURES_BASE_URL_LIVE}"
    ws_url: "wss://fstream.binance.com"
    
  testnet:
    api_key: "${BINANCE_TESTNET_API_KEY}"
    api_secret: "${BINANCE_TESTNET_API_SECRET}"
    rest_url: "https://testnet.binancefuture.com"
    ws_url: "wss://stream.testnet.binancefuture.com"
