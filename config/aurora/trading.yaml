binance_api:
  live:
    api_key: ${BINANCE_FUTURES_API_KEY_LIVE}
    api_secret: ${BINANCE_FUTURES_API_SECRET_LIVE}
    rest_url: ${BINANCE_FUTURES_BASE_URL_LIVE}
    ws_url: wss://fstream.binance.com
  testnet:
    api_key: ${BINANCE_TESTNET_API_KEY}
    api_secret: ${BINANCE_TESTNET_API_SECRET}
    rest_url: https://testnet.binancefuture.com
    ws_url: wss://stream.testnet.binancefuture.com
trading:
  # HYBRID MODE: testnet execution with live data (domain_configuration controls granular modes)
  mode: backtest
  backtest:
    start_date: "2023-05-01"
    end_date: "2023-05-31"
    initial_balance: 10000.0
  tca_prefs:
    max_slippage_pct: 0.5
    max_slippage_bps: 10
    max_latency_ms: 500
    maker_preference: neutral
    preferred_venue: binance
    execution_priority: speed
  risk_budgets:
    trade_cvar95_max_bps: 100
    session_cvar95_max_bps: 200
    max_portfolio_risk_pct: 5.0
    max_single_position_risk_pct: 1.0
    max_daily_loss_pct: 2.0
  risk:
    max_daily_drawdown_limit: 0.05
    score_weights:
      delta_price: 0.05
      obi: 0.35
      tfi: 0.35
      absorption_inverse: 0.25
    testnet:
      max_risk_score: 0.9
    production:
      max_risk_score: 0.8
    trading_allowed_thresholds:
      max_risk_score: 0.9
    daily:
      enabled: false
      max_realized_loss_usd: 250.0
      max_drawdown_pct: 8.0
      reset_time_utc: 00:00
    profile: balanced
    soft_limits:
      # LIVE SAFETY: Soft clipping for position sizing risk management.
      # Backtest override: see config/aurora/backtest_override.yaml
      mode: clip
      clip_min_notional_usdt: 10
      directional_ratio_max: 20.0
      side_exposure_usdt: 2000
      margin_exposure_usdt: 5000
    regime_adaptation:
      trend_up_delta: 0.3
      trend_down_delta: 0.3
      flat_delta: -0.3
      bounds:
      - 2.0
      - 4.0
    feature_flags:
      dynamic_ratio: true
      clipping_enabled: true
  market_data:
    poll_interval_sec: 5.0
    websocket_streams:
    - bookTicker
    - trade
    use_multiprocessing: true
    api_call_limits:
      get_recent_trades: 50
      get_klines:
        interval: 1m
        limit: 2
    macro_sync:
      enabled: true
      anchors:
      - BTCUSDT
      - ETHUSDT
      window: 60
      emit_abs: false
      align_mode: tail_min_len
      min_buffer_size: 3
      time_diff_threshold_ms: 60000
      anchor_update_from_ticks: false
    bar_aggregator:
      enabled: true
      timeframes_sec:
      - 180
      - 300
      - 900  # REGIME-BAR-FORENSICS-01: Enable 15m bars
  ops:
    panic_killswitch: false
    panic_ttl_sec: null
    quiet_hours_utc:
    - 22:00-06:00
    allowlist_symbols: []
    metrics_url: http://localhost:8000/metrics
    reports_dir: reports
  execution:
    manage:
      auto: true
      brackets:
        oco_emulation: true
        stop_loss_bps: 40
        offset_bps: 5
        sl:
          fixed_bps: 40
        tp:
          fixed_bps: 80
      orphan_monitor:
        enabled: true
      # Emergency mode config (optional - set enabled: false to disable)
      emergency:
        enabled: false
        wait_mode_bars: 2
        emergency_sl_bps: 100
      failsafe: null
    fsm_periodic_cleanup_enabled: false
    cooldown_after_close_ms: 60000
    anti_race_close_ms: 800
    fallback: null
    limit_orders: null
    exposure:
      max_equity_utilization_pct: 2.0
      max_portfolio_fraction: 2.0
      max_side_utilization_pct:
        long: 1.5
        short: 1.5
      max_directional_ratio: 50.0
      per_symbol_cap_pct: 0.08
      count_pending_orders: true
      exclude_reduce_only: true
      pending_ttl_sec: 90
      pending_reservation_ttl_sec: 45
      post_fill_hold_ttl_sec: 5
      positions_stale_ttl_sec: 15
      leverage_defaults:
        BTCUSDT: 20
        ETHUSDT: 20
        SOLUSDT: 20
        XRPUSDT: 20
        DOGEUSDT: 20
        __default__: 20
    open_order_type: MARKET
    order_params:
      LIMIT:
        timeInForce: GTC
      STOP_MARKET:
        workingType: MARK_PRICE
      TAKE_PROFIT_MARKET:
        workingType: MARK_PRICE
      TRAILING_STOP_MARKET:
        callbackRate: '0.5'
    watchdog:
      ack_ttl_ms: 8000
      fill_ttl_ms: 60000
      check_interval_ms: 1000
      rps_limit: 10
    orders:
      default_ttl_seconds: 15
    preflight_backoff_ms:
    - 120
    - 250
    - 400
    - 800
    - 1200
    - 1800
    min_post_interval_per_symbol_ms: 300
    allow_trade_with_guardian_tidy_only: false
    order_guardian:
      unified: true
      emit_tidy_event: true
      cleanup_ttl_ms: 6000
      symbol_cooldown_ms: 4000
      poll_interval_ms: 5000
      ledger_db_path: data/order_ledger.db
  # ═══════════════════════════════════════════════════════════════════════
  # HYBRID MODE CONFIGURATION (Live Data → Testnet Execution)
  # ═══════════════════════════════════════════════════════════════════════
  # Data domains: LIVE (read real market data)
  # Execution domains: TESTNET (write orders to testnet)
  # This allows safe testing with real market conditions without risking capital
  domain_configuration:
    market_data:
      trading_mode: live      # Read LIVE Binance market data (WebSocket + REST)
    feature_engineering:
      trading_mode: live      # Process features from live data
    decision_making:
      trading_mode: live      # Generate signals from live features
    risk_management:
      trading_mode: testnet   # Risk scoring with testnet portfolio state
    execution_position:
      trading_mode: testnet   # Execute orders on TESTNET (SAFETY CRITICAL)
    audit_trail:
      trading_mode: live      # Log all events with live timestamps
  # ═══════════════════════════════════════════════════════════════════════
  # RISK MANAGEMENT DATA SOURCES (Hybrid Mode)
  # ═══════════════════════════════════════════════════════════════════════
  # portfolio_state: testnet → use testnet account balances/positions
  # market_data: live → use live prices for risk calculations
  risk_management:
    data_sources:
      portfolio_state: testnet  # Read positions/balance from TESTNET account
      market_data: live         # Use LIVE prices for mark-to-market valuations
