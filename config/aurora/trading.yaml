binance_api:
  live:
    api_key: ${BINANCE_FUTURES_API_KEY_LIVE}
    api_secret: ${BINANCE_FUTURES_API_SECRET_LIVE}
    rest_url: ${BINANCE_FUTURES_BASE_URL_LIVE}
  testnet:
    api_key: ${BINANCE_TESTNET_API_KEY}
    api_secret: ${BINANCE_TESTNET_API_SECRET}
    rest_url: https://testnet.binancefuture.com
trading:
  mode: hybrid_live_data_testnet_exec
  tca_prefs:
    max_slippage_pct: 0.5
    max_slippage_bps: 25
    max_latency_ms: 3000
    maker_preference: neutral
    preferred_venue: binance
    execution_priority: speed
  risk_budgets:
    trade_cvar95_max_bps: 100
    session_cvar95_max_bps: 200
    max_portfolio_risk_pct: 5.0
    max_single_position_risk_pct: 1.0
    max_daily_loss_pct: 2.0
  risk:
    max_daily_drawdown_limit: 0.05
    score_weights:
      delta_price: 0.05
      obi: 0.35
      tfi: 0.35
      absorption_inverse: 0.25
    testnet:
      max_risk_score: 0.9
    production:
      max_risk_score: 0.8
    trading_allowed_thresholds:
      max_risk_score: 0.9
    daily:
      enabled: false
      max_realized_loss_usd: 250.0
      max_drawdown_pct: 8.0
      reset_time_utc: 00:00
    profile: balanced
    soft_limits:
      mode: clip
      clip_min_notional_usdt: 10
      directional_ratio_max: 20.0
      side_exposure_usdt: 2000
      margin_exposure_usdt: 5000
    regime_adaptation:
      trend_up_delta: 0.3
      trend_down_delta: 0.3
      flat_delta: -0.3
      bounds:
      - 2.0
      - 4.0
    feature_flags:
      dynamic_ratio: true
      clipping_enabled: true
  market_data:
    poll_interval_sec: 5.0
    websocket_streams:
    - bookTicker
    - trade
    use_multiprocessing: true
    macro_sync:
      enabled: true
      anchors:
      - BTCUSDT
      - ETHUSDT
      window: 60
      emit_abs: false
      align_mode: tail_min_len
      min_buffer_size: 3
      time_diff_threshold_ms: 60000
      anchor_update_from_ticks: false
    bar_aggregator:
      enabled: true
      timeframes_sec:
      - 180
      - 300
      - 900
      - 14400
      - 86400
  ops:
    panic_killswitch: false
    metrics_url: http://127.0.0.1:8000/metrics
    reports_dir: reports
  execution:
    manage:
      auto: true
      brackets:
        oco_emulation: true
        offset_bps: 5
        sl:
          fixed_bps: 40
        tp:
          fixed_bps: 80
      orphan_monitor:
        enabled: true
        run_on_startup: true
        periodic_interval_sec: 300
        min_order_age_sec: 0
        batch_cancel_limit: 50
        rate_limit_per_min: 120
      emergency:
        enabled: false
        wait_mode_bars: 2
        emergency_sl_bps: 100
    fsm_periodic_cleanup_enabled: false
    cooldown_after_close_ms: 60000
    anti_race_close_ms: 800
    fallback: null
    limit_orders: null
    exposure:
      max_equity_utilization_pct: 150.0
      max_portfolio_fraction: 150.0
      max_directional_ratio: 50.0
      count_pending_orders: true
      exclude_reduce_only: true
      pending_ttl_sec: 90
      post_fill_hold_ttl_sec: 5
      leverage_defaults:
        BTCUSDT: 20
        ETHUSDT: 20
        SOLUSDT: 20
        XRPUSDT: 20
        DOGEUSDT: 20
        __default__: 20
    order_params:
      LIMIT:
        timeInForce: GTC
      STOP_MARKET:
        workingType: MARK_PRICE
      TAKE_PROFIT_MARKET:
        workingType: MARK_PRICE
      TRAILING_STOP_MARKET:
        callbackRate: '0.5'
    watchdog:
      ack_ttl_ms: 8000
      fill_ttl_ms: 3600000
      check_interval_ms: 1000
      rps_limit: 10
    orders: null
    preflight_backoff_ms:
    - 120
    - 250
    - 400
    - 800
    - 1200
    - 1800
    allow_trade_with_guardian_tidy_only: false
    order_guardian:
      unified: true
      ledger_db_path: data/order_ledger.db
  domain_configuration:
    market_data:
      trading_mode: live
    feature_engineering:
      trading_mode: live
    decision_making:
      trading_mode: live
    risk_management: null
    execution_position: null
    audit_trail: null
  risk_management:
    data_sources:
      portfolio_state: testnet
      market_data: live
  llm_orchestration:
    mode: hybrid_advisory
    llm_role: advisory
    require_telemetry: true
    symbols_llm:
    - 1000PEPEUSDT
    allowlist_symbols:
    - 1000PEPEUSDT
    intent_policy:
      max_open_intents: 3
      cooldown_sec: 30
      allow_limit_only: true
      require_tp_sl: true
      max_notional_usd: 100.0
      max_qty: 5000.0
      max_price_deviation_bps: 20.0
      allowed_tif:
      - GTC
  regime_tpsl: null
