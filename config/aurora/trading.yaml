binance_api:
  live:
    api_key: ${BINANCE_FUTURES_API_KEY_LIVE}
    api_secret: ${BINANCE_FUTURES_API_SECRET_LIVE}
    rest_url: ${BINANCE_FUTURES_BASE_URL_LIVE}
    ws_url: wss://fstream.binance.com
  testnet:
    api_key: ${BINANCE_TESTNET_API_KEY}
    api_secret: ${BINANCE_TESTNET_API_SECRET}
    rest_url: https://testnet.binancefuture.com
    ws_url: wss://stream.testnet.binancefuture.com
trading:
  mode: testnet
  decision:
    testnet:
      signal_threshold: null
    production:
      signal_threshold: null
    signal_threshold: 0.1
    neutral_threshold: 0.18
    symbols_to_track:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - DOGEUSDT
    - XRPUSDT
    behavior_fsm:
      enable: false
      high_vol_multiplier: 2.0
      low_vol_multiplier: 0.5
    regime_threshold_multipliers:
      HIGH_VOLATILITY: 1.2
      LOW_VOLATILITY: 0.9
      MEAN_REVERSION: 1.05
      TREND_UP: 1.0
      TREND_DOWN: 1.0
      UNCERTAIN: 1.15
      DEFAULT: 1.0
    side_bias_min_score: null
    side_bias_window_sec: 60
    side_bias_target_ratio: 0.6
    side_bias_penalty_factor: 0.5
    cooldown_sec: 10
    retry_ttl_ms: 5000
    retry_max_count: 3
    retry_backoff_factor: 1.5
    position_sizing:
      min_position_size_usd: 10
      liquidity_based_cap_usd: 10000
      risk_fraction_q: 0.05
      liquidity_kappa: 1.0
      kappa_mode: dynamic
      liquidity_kappa_mode: dynamic
      risk_contract_v1: null
    sizing_modifiers:
      HIGH_VOLATILITY: 0.6
      LOW_VOLATILITY: 1.2
      MEAN_REVERSION: 0.5
      UNCERTAIN: 0.5
    regime_thresholds:
      HIGH_VOLATILITY: 0.12
      LOW_VOLATILITY: 0.09
      MEAN_REVERSION: 0.105
      TREND_UP: 0.1
      TREND_DOWN: 0.1
      UNCERTAIN: 0.115
      DEFAULT: 0.1
    kelly:
      base_probability: 0.5
      kelly_cap: 0.25
      kelly_alpha: 0.8
      payoff_ratio_r: 1.5
    qos:
      mode: defer
      enforce: false
      exposure_block_cooldown_sec: 30
      symbol_cooldown_sec: 1
      max_intents_per_minute_per_symbol: 60
    signals:
      normalize: false
      enable_new_metrics: true
    bar_gating: null
    roi_exit: null
    mean_reversion: null
    signal_weights:
      obi: 0.15
      tfi: 0.15
      delta_price: 0.1
      ema_bias: 0.15
      volume_spike: 0.1
      volatility_state: 0.1
      depth_imbalance: 0.15
      macro_sync: 0.1
  tca_prefs:
    max_slippage_pct: 0.5
    max_slippage_bps: 10
    max_latency_ms: 500
    maker_preference: neutral
    preferred_venue: binance
    execution_priority: speed
  risk_budgets:
    trade_cvar95_max_bps: 100
    session_cvar95_max_bps: 200
    max_portfolio_risk_pct: 5.0
    max_single_position_risk_pct: 1.0
    max_daily_loss_pct: 2.0
  risk:
    max_daily_drawdown_limit: 0.05
    score_weights:
      delta_price: 0.05
      obi: 0.35
      tfi: 0.35
      absorption_inverse: 0.25
    testnet:
      max_risk_score: 0.9
    production:
      max_risk_score: 0.8
    trading_allowed_thresholds:
      max_risk_score: 0.9
    daily:
      max_realized_loss_usd: 250.0
      max_drawdown_pct: 8.0
      reset_time_utc: 00:00
    profile: balanced
    soft_limits:
      mode: clip
      clip_min_notional_usdt: 10
      directional_ratio_max: 20.0
      side_exposure_usdt: 600
      margin_exposure_usdt: 1100
    regime_adaptation:
      trend_up_delta: 0.3
      trend_down_delta: 0.3
      flat_delta: -0.3
      bounds:
      - 2.0
      - 4.0
    feature_flags:
      dynamic_ratio: true
      clipping_enabled: true
  market_data:
    poll_interval_sec: 5.0
    websocket_streams:
    - bookTicker
    - trade
    use_multiprocessing: true
    api_call_limits:
      get_recent_trades: 50
      get_klines:
        interval: 1m
        limit: 2
    macro_sync:
      enabled: true
      anchors:
      - BTCUSDT
      - ETHUSDT
      window: 60
      emit_abs: false
      align_mode: tail_min_len
      min_buffer_size: 3
      time_diff_threshold_ms: 60000
      anchor_update_from_ticks: false
  ops:
    panic_killswitch: true
    panic_ttl_sec: null
    quiet_hours_utc:
    - 22:00-06:00
    allowlist_symbols: []
    metrics_url: http://localhost:8000/metrics
    reports_dir: reports
  execution:
    manage:
      auto: true
      brackets:
        oco_emulation: true
        stop_loss_bps: 40
        offset_bps: 5
        sl:
          fixed_bps: 40
        tp:
          fixed_bps: 80
      orphan_monitor:
        enabled: true
      emergency: null
      failsafe: null
    fsm_periodic_cleanup_enabled: false
    anti_race_close_ms: 800
    fallback: null
    limit_orders: null
    exposure:
      max_equity_utilization_pct: 2.0
      max_portfolio_fraction: 2.0
      max_side_utilization_pct:
        long: 1.5
        short: 1.5
      max_directional_ratio: 50.0
      per_symbol_cap_pct: 0.08
      count_pending_orders: true
      exclude_reduce_only: true
      pending_ttl_sec: 90
      pending_reservation_ttl_sec: 45
      post_fill_hold_ttl_sec: 5
      positions_stale_ttl_sec: 15
      leverage_defaults:
        BTCUSDT: 20
        ETHUSDT: 20
        SOLUSDT: 20
        XRPUSDT: 20
        DOGEUSDT: 20
        __default__: 20
    open_order_type: MARKET
    order_params:
      LIMIT:
        timeInForce: GTC
      STOP_MARKET:
        workingType: MARK_PRICE
      TAKE_PROFIT_MARKET:
        workingType: MARK_PRICE
      TRAILING_STOP_MARKET:
        callbackRate: '0.5'
    watchdog:
      ack_ttl_ms: 8000
      fill_ttl_ms: 60000
      check_interval_ms: 1000
      rps_limit: 10
    orders:
      default_ttl_seconds: 15
    preflight_backoff_ms:
    - 120
    - 250
    - 400
    - 800
    - 1200
    - 1800
    min_post_interval_per_symbol_ms: 300
    allow_trade_with_guardian_tidy_only: false
    order_guardian:
      unified: true
      emit_tidy_event: true
      cleanup_ttl_ms: 6000
      symbol_cooldown_ms: 4000
      poll_interval_ms: 5000
      ledger_db_path: data/order_ledger.db
  domain_configuration:
    market_data:
      trading_mode: live
    feature_engineering:
      trading_mode: live
    decision_making:
      trading_mode: live
    risk_management:
      trading_mode: testnet
    execution_position:
      trading_mode: testnet
    audit_trail:
      trading_mode: live
  risk_management:
    data_sources:
      portfolio_state: testnet
      market_data: live
