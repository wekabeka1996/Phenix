md_amr:
  enabled: true
  type: "md_amr_v1_2"
  description: "Multi-Dimensional Asymmetric Mean Reversion V1.2 (15m SSOT)"
  timeframe_sec: 900
  defer_ttl_sec: 60

  channel_window_bars: 12
  channel_robust_pct: 0.05
  atr_window: 14
  atr_stats_window: 64

  hysteresis_mult: 1.20
  threshold_z: 2.20
  volatility_dampening_factor: 0.50
  thr_base: 0.55
  thr_floor: 0.10
  alpha: 0.25
  conf_min: 0.22
  max_hold_bars: 16

  # V1.2: Z-Score robustness (Fix 3)
  atr_zscore_clamp: 10.0
  atr_std_floor_pct: 0.05

  fee_bps: 4.0
  slippage_buffer_bps: 2.0
  scaleout_fraction: 0.50
  scaleout_cost_model: "round_trip"

  weights:
    d1: 0.35
    h1: 0.30
    m30: 0.20
    m15: 0.15

  objective:
    enabled: true
    regimes:
      HIGH_VOLATILITY:
        weights:
          cost: 1.0
          risk: 1.5
          edge: 1.0
          execution: 0.5
          information: 1.0
          behavior: 1.2
        multiplier:
          m_min: 0.1
          m_max: 1.5
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      LOW_VOLATILITY:
        weights:
          cost: 1.0
          risk: 0.5
          edge: 1.2
          execution: 1.0
          information: 1.0
          behavior: 0.6
        multiplier:
          m_min: 0.1
          m_max: 1.5
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.05
          enforcement_mode: "GATE"
      TREND_UP:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.5
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.1
          m_max: 2.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      TREND_DOWN:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.5
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.1
          m_max: 2.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      MEAN_REVERSION:
        weights:
          cost: 1.5
          risk: 1.0
          edge: 1.0
          execution: 1.5
          information: 1.0
          behavior: 1.0
        multiplier:
          m_min: 0.1
          m_max: 1.2
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.08
          enforcement_mode: "GATE"
      UNCERTAIN:
        weights:
          cost: 2.0
          risk: 2.0
          edge: 1.0
          execution: 1.0
          information: 2.0
          behavior: 1.5
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.15
          enforcement_mode: "GATE"
      FLAT_LOW:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.7
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"
      FLAT_NORMAL:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.7
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"
      FLAT_HIGH:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.7
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"

  execution:
    entry_order_type: "LIMIT"
    entry_tif: "GTX"
    exit_order_type: "MARKET"
    exit_tif: null
    exit_limit_ttl_ms: null
    gtx_retry_max: 2
    gtx_retry_offset_bps: 2.0
    gtx_fallback_to_market: true

  safety_gates:
    enabled: true

  llm_gate:
    enabled: false
    sentiment_block_threshold: -0.8
    block_ttl_sec: 14400

  # V1.2: Position reconciliation (Fix 5)
  reconciliation:
    enabled: true
    interval_sec: 300
    drift_tolerance: 0.000001

  # V1.2: Multi-symbol concentration guard (Fix 12)
  concentration_guard:
    enabled: true
    max_simultaneous_entries_per_bar: 2

  assets:
    BTCUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY"]
      # MD-AMR-TPSL-01: TP/SL  values from aurora.yaml BTCUSDT (verbatim)
      exit:
        sl_pct: 0.005       # 0.5% base SL
        tp_rr: 1.0          # base TP RR (tp_low_ratio from aurora)
        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          sl_mult:
            DEFAULT: 1.0
            LOW_VOLATILITY: 0.80
            HIGH_VOLATILITY: 1.30
            TREND_UP: 1.00
            TREND_DOWN: 1.00
          tp_mult:
            DEFAULT: 1.5
            LOW_VOLATILITY: 1.50
            HIGH_VOLATILITY: 1.60
            TREND_UP: 3.50
            TREND_DOWN: 3.50
          min_sl_pct: 0.003
          max_sl_pct: 0.060
          min_tp_rr: 0.5
          max_tp_rr: 5.0
          min_dist_bps: 15

    ETHUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY"]
      # MD-AMR-TPSL-01: TP/SL  values from aurora.yaml ETHUSDT (verbatim)
