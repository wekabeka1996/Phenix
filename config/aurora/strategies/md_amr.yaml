md_amr:
  enabled: true
  type: "md_amr_v1_2"
  description: "Multi-Dimensional Asymmetric Mean Reversion V1.2 (15m SSOT)"
  timeframe_sec: 900
  defer_ttl_sec: 60

  channel_window_bars: 12
  channel_robust_pct: 0.05
  atr_window: 14
  atr_stats_window: 64

  hysteresis_mult: 1.20
  threshold_z: 2.20
  volatility_dampening_factor: 0.50
  thr_base: 0.55
  thr_floor: 0.10
  alpha: 0.25
  conf_min: 0.22
  max_hold_bars: 16

  # V1.2: Z-Score robustness (Fix 3)
  atr_zscore_clamp: 10.0
  atr_std_floor_pct: 0.05

  fee_bps: 4.0
  slippage_buffer_bps: 2.0
  scaleout_fraction: 0.50
  scaleout_cost_model: "round_trip"

  weights:
    d1: 0.35
    h1: 0.30
    m30: 0.20
    m15: 0.15

  execution:
    entry_order_type: "LIMIT"
    entry_tif: "GTX"
    exit_order_type: "MARKET"
    exit_tif: null
    exit_limit_ttl_ms: null
    gtx_retry_max: 2
    gtx_retry_offset_bps: 2.0
    gtx_fallback_to_market: true

  safety_gates:
    enabled: true

  llm_gate:
    enabled: false
    sentiment_block_threshold: -0.8
    block_ttl_sec: 14400

  # V1.2: Position reconciliation (Fix 5)
  reconciliation:
    enabled: true
    interval_sec: 300
    drift_tolerance: 0.000001

  # V1.2: Multi-symbol concentration guard (Fix 12)
  concentration_guard:
    enabled: true
    max_simultaneous_entries_per_bar: 2

  # V1.2: Optuna OOS split (Fix 10)
  optuna:
    oos_split_ratio: 0.30
    min_oos_calmar_ratio: 0.3

  assets:
    BTCUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
    ETHUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
    SOLUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
    DOGEUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
    XRPUSDT:
      enabled: true
      cooldown_sec: 60
      position_mode: "STRICT"
