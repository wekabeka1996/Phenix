        mode: "ISOLATED"
      side_bias:
        penalty_factor: 0.5
        window_sec: 600
        target_ratio: 0.60

      # 2. Weights (Standard)
      weights:
        ema_bias: -0.119873
        volume_spike: 0.243661
        macro_resid: -0.0689669
        obi: 0.101274
        tfi: 0.134215
        volatility_state: 0.00633937
        depth_imbalance: -0.0894987
        delta_price: 0.181047
        absorption: 0.0551244 # R2: placeholder, calibrate in Phase 2

      # 3. Safety Gates
      holding_period:
        enabled: true
        min_duration_sec: 20
        emergency_exit_threshold: 0.7
        apply_to_flips: true
      reentry_cooldown_sec: 300
      liquidity_gate:
        enabled: true
        kappa_min: 0.1
        kappa_max: 1.0
        failsafe_qty_check: true

      # 4. Regime Filters (The Logic)
      # Block MR/Uncertain via thresholds. Enable others.
      regime_thresholds:
        HIGH_VOLATILITY: 0.18
        LOW_VOLATILITY: 0.12
        TREND_UP: 0.1
        TREND_DOWN: 0.1
        MEAN_REVERSION: 0.07
        UNCERTAIN: 99.0
        DEFAULT: 99.0

      # 5. Position Sizing per Regime
      regime_sizing:
        HIGH_VOLATILITY: 0.7   # patched4a: attenuate 0.500.20 (R4_CUM: 86% SL rate, n=42, 103 USDT)
        LOW_VOLATILITY: 0.7    # patched4a: attenuate 0.750.25 (R4_CUM: 65% SL rate, n=54, 159 USDT)
        TREND_UP: 1.3
        TREND_DOWN: 1.3
        MEAN_REVERSION: 0.7  # Redundant safety

      # 6. Exits (The Profit Engine)
      exit:
        sl_pct: 0.005  # Base 0.5%
        max_hold_sec: null

        regime_tpsl:
          enabled: true
