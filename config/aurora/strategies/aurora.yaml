# ==============================================================================
# Aurora Strategy Profile — SSOT
# ==============================================================================
# CFG-STRATEGY-SSOT-FREEZE-02:
# - Strategy policy SSOT: this file (no policy in trading.yaml/domains.yaml)
# - Global Aurora policy: aurora.decision (migrated from trading.yaml)
# - Per-symbol Aurora params: aurora.assets (migrated from aurora_instruments.yaml)
# ==============================================================================

aurora:
  enabled: true
  # SCORCHED-EARTH-2026-01-27: legacy_tick_path_enabled DELETED from schema
  type: bar_driven
  description: "Bar-driven multi-signal alpha strategy (5m basis) with regime awareness"
  timeframe_sec: 300
  
  # ORDER-POLICY-01: Entry order execution policy (SSOT for strategy)
  # LIMIT entries require explicit tif. No silent fallbacks.
  execution:
    entry_order_type: "LIMIT"   # MUST be one of: LIMIT, MARKET
    entry_tif: "GTX"            # MUST be set for LIMIT. One of: GTC, GTX, IOC, FOK

  # DM-SAFETY-BYPASSES-P1: Explicit safety gates control (fail-closed if missing)
  # Aurora is trend-following → directional sanity and price motion gates APPLY.
  safety_gates:
    enabled: true


  # Global Aurora policy (DecisionConfig)
  decision:
    testnet:
      signal_threshold: 0.005
    production:
      signal_threshold: 0.005
    signal_threshold: 0.005
    # Phase 9: Sensitivity debug lever (neutral=1.0, production=1.0)
    score_multiplier: 1.0
    neutral_threshold: 0.06
    symbols_to_track:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - DOGEUSDT
      - XRPUSDT
      - BNBUSDT
      - 1000PEPEUSDT
    behavior_fsm:
      enable: false
      high_vol_multiplier: 2.0
      low_vol_multiplier: 0.5
    regime_threshold_multipliers:
      HIGH_VOLATILITY: 1.30
      LOW_VOLATILITY: 1.15
      MEAN_REVERSION: 1.10
      TREND_UP: 0.85
      TREND_DOWN: 0.85
      UNCERTAIN: 1.50
      DEFAULT: 1.00
    side_bias_min_score: null
    side_bias_window_sec: 21600
    side_bias_target_ratio: 0.60
    side_bias_penalty_factor: 0.35
    side_bias_min_intents: 12
    cooldown_sec: 6
    retry_ttl_ms: 5000
    retry_max_count: 3
    retry_backoff_factor: 1.5
    regime_thresholds:
      HIGH_VOLATILITY: 0.10
      LOW_VOLATILITY: 0.09
      MEAN_REVERSION: 0.075
      TREND_UP: 0.1
      TREND_DOWN: 0.1
      UNCERTAIN: 0.115
      DEFAULT: 0.1
    kelly:
      base_probability: 0.5
      kelly_cap: 0.25
      kelly_alpha: 0.8
      payoff_ratio_r: 1.5
      p_min: 0.45
      p_max: 0.65
      uplift_factor: 0.20
    qos:
      mode: defer
      enforce: false
      exposure_block_cooldown_sec: 30
      symbol_cooldown_sec: 1
      max_intents_per_minute_per_symbol: 60
    signals:
      normalize_signals_mode: signed_v2
      enable_new_metrics: true
      delta_price_cap_pct: 0.015
    bar_gating: null
    roi_exit: null
    mean_reversion: null

    # ══════════════ Phase 5: Exit Manager (Global) ══════════════
    # BUG-FIX: handler crashes (fail-closed) if exit: is missing.
    # Per-symbol overrides in assets.<SYM>.exit still apply.
    exit:
      time_exit_enabled: false
      max_hold_time_sec: 86400        # 24h hard stop (safety net)
      signal_exit_enabled: true
      signal_reversal_threshold: -0.10
      danger_zone_action: "TIGHTEN_STOPS"
      danger_zone_tighten_factor: 0.5

    # ══════════════ Phase 9: Quadratic Brain Logic ══════════════
    # Values: "v1" (Legacy), "v2" (Linear), "quadratic" (Phase 9)
    # Default: "v1" (Fail-safe)
    scoring_version: "quadratic"

    # Direction/Strength split scoring (project-wide hardening)
    direction_strength_scoring:
      directional_features:
        - obi
        - tfi
        - delta_price
        - ema_bias
        - depth_imbalance
        # R1: macro_resid replaces macro_sync in directional scoring
        - macro_resid
        # Legacy: kept for telemetry; not weighted in v2 by default
        - macro_sync
      strength_features:
        - volume_spike
        - volatility_state
      strength_alpha: 0.80
      strength_cap: 1.0
    
    liquidity_gate:
      enabled: true
      kappa_min: 0.15
      kappa_max: 1.0
      failsafe_qty_check: false

    essential_features:
      - delta_price
      - ema_bias
      - obi
      - tfi

    # [Phase 3 Fix] Anchor Shock Veto: Block long signals during BTC crash
    anchor_shock_veto:
      enabled: true
      anchor_symbol: "BTCUSDT"
      threshold: -2.0  # Block BUY if macro_resid < -2.0 (strong crash)

    # === Minimum Holding Period (Anti-Churn Gate) ===
    # Prevents HFT-style churn by enforcing minimum time in position before
    # allowing signal-based exits. Does NOT affect safety exits (SL/TP/Risk).
    # RFC: docs/RFC_min_duration_logic.md
    holding_period:
      enabled: true
      min_duration_sec: 300         # Minimum seconds to hold position
      emergency_exit_threshold: 0.75  # |score| threshold for emergency override
      apply_to_flips: true          # Also apply holding period to FLIP signals

    # === VOL-ADJ-GATES-01: Sigma-normalized Motion Gates ===
    # Anti-Flat: Block entry when normalized motion too small (fee churn in dead market)
    # Anti-FOMO: Block entry when normalized motion too extreme (snapback risk)
    # Formula: pm_norm = clip(ret_window / (k_vol * vol_window), -1, 1)
    gates:
      enabled: true
      anti_flat_sigma: 0.50  # Block ENTRY if |pm_norm| < 0.5 (dead market)
      anti_fomo_sigma: 4.00  # Block ENTRY if |pm_norm| > 4.0 (extreme impulse)
      # P0-2: FIXED 900 → 300 (pm_norm_900s doesn't exist in schema, only 10/60/300)
      motion_window_sec: 300 # Use 5-minute window (pm_norm_300s)

    # === Re-entry Cooldown (Anti-Ping-Pong Gate) ===
    # Prevents immediate re-entry after position closes.
    # After exiting a position, wait this many seconds before allowing new entry.
    reentry_cooldown_sec: 600  # Global default: 600 seconds

    feature_neutrals:
      obi: 0.0
      tfi: 0.0
      delta_price: 0.0
      ema_bias: 0.0
      volume_spike: 0.0
      volatility_state: 0.0
      depth_imbalance: 0.0
      macro_sync: 0.5
      macro_resid: 0.0
    
    signal_weights:
      obi: 0.25
      tfi: 0.25
      delta_price: 0.35
      ema_bias: 0.15
      volume_spike: 0.10
      volatility_state: 0.10
      # depth_imbalance: phi in [0,1], higher = ASK dominance (sell pressure) -> negative weight
      depth_imbalance: 0.20
      # R1: macro_resid replaces macro_sync in directional scoring
      macro_resid: 0.10
      # macro_sync: 0.0  # DEPRECATED for scoring (kept as telemetry)

