# ==============================================================================
# Aurora Strategy Profile  SSOT
# ==============================================================================
# CFG-STRATEGY-SSOT-FREEZE-02:
# - Strategy policy SSOT: this file (no policy in trading.yaml/domains.yaml)
# - Global Aurora policy: aurora.decision (migrated from trading.yaml)
# - Per-symbol Aurora params: aurora.assets (migrated from aurora_instruments.yaml)
# ==============================================================================

aurora:
  enabled: true
  # SCORCHED-EARTH-2026-01-27: legacy_tick_path_enabled DELETED from schema
  type: bar_driven
  description: "Bar-driven multi-signal alpha strategy (5m basis) with regime awareness"
  timeframe_sec: 300

  # ORDER-POLICY-01: Entry order execution policy (SSOT for strategy)
  # LIMIT entries require explicit tif. No silent fallbacks.
  execution:
    entry_order_type: "LIMIT"   # MUST be one of: LIMIT, MARKET
    entry_tif: "GTX"            # MUST be set for LIMIT. One of: GTC, GTX, IOC, FOK

  # DM-SAFETY-BYPASSES-P1: Explicit safety gates control (fail-closed if missing)
  # Aurora is trend-following  directional sanity and price motion gates APPLY.
  # Phase 0.6: attenuate  EXTREME denies entry; STRESS halves position size.
  safety_gates:
    enabled: true
    system_stress_policy: attenuate   # "off" | "attenuate" | "block"
    stress_attenuation_factor: 0.50   # margin_pct_mult *= 0.5 when STRESS

  objective:
    enabled: true
    regimes:
      HIGH_VOLATILITY:
        weights:
          cost: 1.0
          risk: 1.5
          edge: 1.0
          execution: 0.5
          information: 1.0
          behavior: 1.4
        multiplier:
          m_min: 0.1
          m_max: 1.5
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      LOW_VOLATILITY:
        weights:
          cost: 1.0
          risk: 0.5
          edge: 1.2
          execution: 1.0
          information: 1.0
          behavior: 0.6
        multiplier:
          m_min: 0.1
          m_max: 1.5
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.05
          enforcement_mode: "GATE"
      TREND_UP:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.5
          execution: 1.0
          information: 1.0
          behavior: 0.7
        multiplier:
          m_min: 0.1
          m_max: 2.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      TREND_DOWN:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.5
          execution: 1.0
          information: 1.0
          behavior: 0.7
        multiplier:
          m_min: 0.1
          m_max: 2.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "GATE"
      MEAN_REVERSION:
        weights:
          cost: 1.5
          risk: 1.0
          edge: 1.0
          execution: 1.5
          information: 1.0
          behavior: 1.0
        multiplier:
          m_min: 0.1
          m_max: 1.2
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.08
          enforcement_mode: "GATE"
      UNCERTAIN:
        weights:
          cost: 2.0
          risk: 2.0
          edge: 1.0
          execution: 1.0
          information: 2.0
          behavior: 1.6
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.15
          enforcement_mode: "GATE"
      FLAT_LOW:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"
      FLAT_NORMAL:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"
      FLAT_HIGH:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.0
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.1
          m_max: 1.0
          lambda_scale: 1.0
          penalty_center: -5.0
          penalty_scale: 2.5
        gate:
          min_objective_score: 0.1
          enforcement_mode: "OBSERVE"

  # Global Aurora policy (DecisionConfig)
  decision:
    regime_smoothing:
      enabled: false
      method: "ema"
      ema_alpha: 0.3
      ramp_bars: 6
    testnet:
      signal_threshold: 0.162
    production:
      signal_threshold: 0.162
    signal_threshold: 0.162
    # Phase 9: Sensitivity debug lever (neutral=1.0, production=1.0)
    score_multiplier: 1.0
    decision_geometry:
      admission_mode: linear
      sizing_mode: quadratic
      admission_shield_floor: 0.75
    neutral_threshold: 0.05
    symbols_to_track:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - DOGEUSDT
      - XRPUSDT
    behavior_fsm:
      enable: false
      high_vol_multiplier: 2.0
      low_vol_multiplier: 0.5
    regime_threshold_multipliers:
      HIGH_VOLATILITY: 0.20
      LOW_VOLATILITY: 0.12
      MEAN_REVERSION: 0.16
      TREND_UP: 0.14    # patched2: raised from 0.85  TREND_UP was -EV, lower barrier wrong
      TREND_DOWN: 0.14
      UNCERTAIN: 0.18
      DEFAULT: 0.16
    side_bias_min_score: null
    side_bias_window_sec: 420
    side_bias_target_ratio: 0.72
    side_bias_penalty_factor: 0.25
    side_bias_min_intents: 18
    cooldown_sec: 6
    retry_ttl_ms: 5000
    retry_max_count: 3
    retry_backoff_factor: 1.5
    regime_thresholds:
      HIGH_VOLATILITY: 0.18
      LOW_VOLATILITY: 0.14
      MEAN_REVERSION: 0.075
      TREND_UP: 0.12
      TREND_DOWN: 0.12
      UNCERTAIN: 99.0
      DEFAULT: 0.12
    kelly:
      base_probability: 0.5
      kelly_cap: 0.25
      kelly_alpha: 0.8
      payoff_ratio_r: 1.5
      p_min: 0.45
      p_max: 0.65
      uplift_factor: 0.20
    qos:
      mode: defer
      enforce: false
      exposure_block_cooldown_sec: 30
      symbol_cooldown_sec: 1
      max_intents_per_minute_per_symbol: 60
    # Phase 9 Migration complete: V2 legacy surfaces removed (direction_strength_scoring, feature_neutrals, signal_weights)
    signals:
      normalize_signals_mode: signed_v2
      enable_new_metrics: true
      delta_price_cap_pct: 0.02
    bar_gating: null
    roi_exit: null
    mean_reversion: null

    #  Phase 5: Exit Manager (Global)
    # BUG-FIX: handler crashes (fail-closed) if exit: is missing.
    # Per-symbol overrides in assets.<SYM>.exit still apply.
    exit:
      time_exit_enabled: false
      max_hold_time_sec: 86400        # 24h hard stop (safety net)
      signal_exit_enabled: true
      signal_reversal_threshold: -0.10
      danger_zone_action: "TIGHTEN_STOPS"
      danger_zone_tighten_factor: 0.5

    #  Phase 9: Quadratic Brain — sole active scoring path.
    scoring_version: "quadratic"

    # === Phase 9: Quadratic Scoring Engine / Shield Cascade ===
    # shield_enabled: true activates the real cascade (DangerZone → Context → Memory).
    # NullShield is used only if this block is absent or shield_enabled: false.
    scoring_engine:
      shield_enabled: true

      danger_zone_shield:
        enabled: true
        vol_threshold: 0.95        # Block when volatility_state > 95th pct
        spread_threshold: 50.0     # Block when spread > 50 bps
        motion_threshold: 3.0      # Block when price motion sigma > 3.0

      context_shield:
        enabled: true
        regime_multipliers:
          TREND_UP: 1.0
          TREND_DOWN: 1.0
          MEAN_REVERSION: 0.75
          LOW_VOLATILITY: 0.85
          HIGH_VOLATILITY: 0.30    # Sharp reduction in high-vol regime
          UNCERTAIN: 0.55
        default_multiplier: 0.80   # Unknown regimes: conservative
        no_regime_multiplier: 0.50 # No regime received yet: very cautious
        ttl_ms: 14400000           # 4h regime TTL before stale policy kicks in
        stale_mult_normal: 0.70    # Stale regime in safe regimes
        stale_mult_danger: 0.35    # Stale regime in HIGH_VOLATILITY
        danger_regimes:
          - HIGH_VOLATILITY

      memory_shield:
        enabled: true
        decay_rate: 0.95           # 5% decay per bar
        max_states: 200            # LRU cap: 200 distinct states
        unknown_threshold: 10.0    # < 10 visits = UNKNOWN state
        exploring_threshold: 50.0  # 10-50 visits = EXPLORING state
        unknown_multiplier: 0.60   # UNKNOWN: 60% of signal
        exploring_multiplier: 0.80 # EXPLORING: 80% of signal
        known_multiplier: 1.00     # KNOWN: full signal
        storage_path: null         # null = in-memory only (no persistence)
        flush_interval_sec: 60.0   # Would flush every 60s if persistence enabled

    # DEPRECATED (Phase 9): direction_strength_scoring was used by v2 linear path (AuroraScoringKernel).
    # Not consumed by QuadraticScoringKernel. Retained for config schema backward-compatibility.
    direction_strength_scoring:
      directional_features:
        - obi
        - tfi
        - delta_price
        - ema_bias
        - depth_imbalance
        # R1: macro_resid replaces macro_sync in directional scoring
        - macro_resid
        # Legacy: kept for telemetry; not weighted in v2 by default
        - macro_sync
        # R2: absorption (SIGNED [-1,1], neutral=0.0)
        - absorption
      strength_features:
        - volume_spike
        - volatility_state
      strength_alpha: 0.5
      strength_cap: 1.0

    liquidity_gate:
      enabled: true
      kappa_min: 0.1
      kappa_max: 1.0
      failsafe_qty_check: true

    essential_features:
      - obi
      - delta_price
      - macro_resid

    # [Phase 3 Fix] Anchor Shock Veto: Block long signals during BTC crash
    anchor_shock_veto:
      enabled: true
      anchor_symbol: "BTCUSDT"
      threshold: -2.0  # Block BUY if macro_resid < -2.0 (strong crash)

    # === Minimum Holding Period (Anti-Churn Gate) ===
    # Prevents HFT-style churn by enforcing minimum time in position before
    # allowing signal-based exits. Does NOT affect safety exits (SL/TP/Risk).
    # RFC: docs/RFC_min_duration_logic.md
    holding_period:
      enabled: true
      min_duration_sec: 900         # Minimum seconds to hold position
      emergency_exit_threshold: 0.90  # |score| threshold for emergency override
      apply_to_flips: true          # Also apply holding period to FLIP signals

    # === VOL-ADJ-GATES-01: Sigma-normalized Motion Gates ===
    # Anti-Flat: Block entry when normalized motion too small (fee churn in dead market)
    # Anti-FOMO: Block entry when normalized motion too extreme (snapback risk)
    # Formula: pm_norm = clip(ret_window / (k_vol * vol_window), -1, 1)
    gates:
      enabled: true
      anti_flat_sigma: 0.48  # Block ENTRY if |pm_norm| < 0.5 (dead market)
      anti_fomo_sigma: 10.0  # Block ENTRY if |pm_norm| > 4.0 (extreme impulse)
      # P0-2: FIXED 900  300 (pm_norm_900s doesn't exist in schema, only 10/60/300)
      motion_window_sec: 300 # Use 5-minute window (pm_norm_300s)

    # === Re-entry Cooldown (Anti-Ping-Pong Gate) ===
    # Prevents immediate re-entry after position closes.
    # After exiting a position, wait this many seconds before allowing new entry.
    reentry_cooldown_sec: 900  # Global default: 600 seconds

    # DEPRECATED (Phase 9): feature_neutrals was used by v2 linear scoring.
    # Not consumed by QuadraticScoringKernel. Retained for config schema backward-compatibility.
    feature_neutrals:
      obi: 0.0
      tfi: 0.0
      delta_price: 0.0
      ema_bias: 0.5
      volume_spike: 0.0
      volatility_state: 0.0
      depth_imbalance: 0.5
      macro_sync: 0.5
      macro_resid: 0.0
      absorption: 0.0    # R2: SIGNED feature, neutral is 0.0

    # DEPRECATED (Phase 9): signal_weights was used by v2 linear scoring.
    # Not consumed by QuadraticScoringKernel. Retained for config schema backward-compatibility.
    signal_weights:
      obi: 0.42
      tfi: 0.15
      delta_price: 0.15
      ema_bias: 0.15
      volume_spike: 0.10
      volatility_state: 0.10
      # depth_imbalance: phi in [0,1], higher = ASK dominance (sell pressure) -> negative weight
      depth_imbalance: -0.15
      # R1: macro_resid replaces macro_sync in directional scoring
      macro_resid: 0.10
      # macro_sync: 0.0  # DEPRECATED for scoring (kept as telemetry)
      # R2: absorption starts at 0.05 (conservative). Calibrate in Phase 2.
      absorption: 0.0

  # Per-symbol overrides (AuroraInstrumentConfig)
  assets:
    # ETHUSDT - Phase 3+ tuned parameters
    # Source: aurora_optimal_full_v1.yaml, aurora_phase3_production.yaml
    ETHUSDT:
      enabled: true
      position_mode: "STRICT"

      # P1: Active Leverage Management
      leverage:
        target: 20
        mode: "ISOLATED"

      # Holding period: ETH trend-following, longer holding
      holding_period:
        min_duration_sec: 360
        emergency_exit_threshold: 0.68

      # Re-entry cooldown: conservative for trend-following
      reentry_cooldown_sec: 120

      # Adjusted weights: Liquidity moved to Gate
      weights:
        ema_bias: 0.20
        volume_spike: 0.20
        # R1: macro_resid replaces macro_sync
        macro_resid: 0.25
        # macro_sync: 0.0  # DEPRECATED (telemetry only)
        # liquidity_kappa: 0.341 (Moved to Gate)
        obi: 0.15
        tfi: 0.093
        volatility_state: 0.036
        depth_imbalance: -0.256
        delta_price: 0.10
        absorption: 0.0    # R2: conservative start weight for ETHUSDT

      liquidity_gate:
        enabled: true
        kappa_min: 0.2
        kappa_max: 1.0
        failsafe_qty_check: true

      side_bias:
        penalty_factor: 0.9
        window_sec: 600
        target_ratio: 0.6

      regime_thresholds:
        HIGH_VOLATILITY: 1.3
        LOW_VOLATILITY: 0.85
        MEAN_REVERSION: 1.05
        DEFAULT: 1.0

      regime_sizing:
        HIGH_VOLATILITY: 0.7   # R3A-2026-03-01: raised from 0.3 (TREND_DOWN|HIGH_VOL ETH n=11,717 sizing_mult=1.100)
        LOW_VOLATILITY: 0.8    # R3A-2026-03-01: lowered from 1.0 (ETH FLAT|LOW_VOL mean=-0.000096 at 24b; LOW_VOL|TREND_UP exactly neutral)
        MEAN_REVERSION: 0.8

      exit:
        sl_pct: 0.019
        max_hold_sec: null
        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          # ETH
          sl_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.65        # Tight for flat low
            LOW_VOLATILITY: 0.06  # LOW_VOL scalp: ~0.114% SL (2148 corridor $2.45)
            FLAT_NORMAL: 0.80
            MEAN_REVERSION: 0.90
            TREND_UP: 1.05        #
            TREND_DOWN: 1.05
            HIGH_VOLATILITY: 1.30 # Wider for high vol
            UNCERTAIN: 1.00
          tp_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.70
            LOW_VOLATILITY: 0.11  # LOW_VOL scalp: ~0.209% TP (net +0.11% after fees)
            FLAT_NORMAL: 0.85
            MEAN_REVERSION: 0.80
            TREND_UP: 1.20        # ETH trend-following  higher TP
            TREND_DOWN: 1.20
            HIGH_VOLATILITY: 1.60
            UNCERTAIN: 1.00
          min_sl_pct: 0.0008      # 0.08% - lowered for LOW_VOL narrow range scalping
          max_sl_pct: 0.015       # 1.5% max (  )
          min_tp_rr: 0.3
          max_tp_rr: 3.5          #
          min_dist_bps: 5         # 5 bps - lowered for ETH narrow range scalping

      take_profit:
        tp_low_ratio: 0.4
        tp_high_ratio: 1.4
        partial_exit_pct: 0.7

      trailing_stop:
        enabled: false
        activation_pct: 0.003
        trail_pct: 0.006
        min_update_interval_sec: 5

      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY"]
      signal_threshold:
        enabled: true
        value: 0.0221
      cooldown_sec: null

      # Smart Limit Entry: Volatility-based pricing (Maker/GTX compliance)
      volatility_entry_logic:
        enabled: true
        regime_multipliers:
          HIGH_VOLATILITY: 0.32   # ETH less volatile than SOL
          LOW_VOLATILITY: 0.17
          MEAN_REVERSION: 0.25
          TREND_UP: 0.22
          TREND_DOWN: 0.22
          UNCERTAIN: 0.25
          DEFAULT: 0.22

      timeframe_sec: null

    # SOLUSDT - Phase 3 tuned parameters
    SOLUSDT:
      # Holding period: SOL
      holding_period:
        min_duration_sec: 900
        emergency_exit_threshold: 0.90

      # P1: Active Leverage Management
      leverage:
        target: 20
        mode: "ISOLATED"

      # Re-entry cooldown: conservative for ALT
      reentry_cooldown_sec: 900

      # Adjusted weights: Liquidity moved to Gate
      weights:
        ema_bias: -0.176429
        volume_spike: 0.238007
        # R1: macro_resid replaces macro_sync
        macro_resid: -0.0492056
        # macro_sync: 0.0  # DEPRECATED (telemetry only)
        # liquidity_kappa: 0.25 (Moved to Gate)
        obi: 0.135947
        tfi: 0.263238
        volatility_state: 0.0119935
        depth_imbalance: 0.0148722
        delta_price: 0.294059
        absorption: 0.0562502 # R2: placeholder, calibrate in Phase 2
      enabled: true
      position_mode: "STRICT"

      liquidity_gate:
        enabled: true
        kappa_min: 0.15
        kappa_max: 1.0
        failsafe_qty_check: true

      side_bias:
        penalty_factor: 0.0
        window_sec: 300
        target_ratio: 0.5

      regime_thresholds:
        HIGH_VOLATILITY: 1.15    # SOL
        LOW_VOLATILITY: 0.75
        MEAN_REVERSION: 1.00
        DEFAULT: 1.0

      regime_sizing:
        HIGH_VOLATILITY: 0.7
        LOW_VOLATILITY: 0.9
        MEAN_REVERSION: 1.0

      exit:
        sl_pct: 0.0135
        max_hold_sec: null
        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          # SOL
          sl_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.60        # Tight SL  flat
            LOW_VOLATILITY: 0.40  # LOW_VOL scalp: ~0.54% SL (tight, 88 USDT corridor)
            FLAT_NORMAL: 0.75
            MEAN_REVERSION: 0.85
            TREND_UP: 1.15        # Wide SL
            TREND_DOWN: 1.15
            HIGH_VOLATILITY: 1.30 #  SL  SOL ( )
            UNCERTAIN: 1.00
          tp_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.65
            LOW_VOLATILITY: 0.90  # LOW_VOL scalp: ~0.45% TP (net +0.36% after fees)
            FLAT_NORMAL: 0.80
            MEAN_REVERSION: 0.75
            TREND_UP: 1.30        # Higher TP for trends
            TREND_DOWN: 1.30
            HIGH_VOLATILITY: 1.60
            UNCERTAIN: 1.00
          min_sl_pct: 0.0025      # 0.25% -   SL
          max_sl_pct: 0.020       # 2.0% max (  )
          min_tp_rr: 0.25         #   RR  SOL ( )
          max_tp_rr: 3.5          #     SOL
          min_dist_bps: 18        # 18 bps (   BTC/ETH)

      take_profit:
        tp_low_ratio: 0.36
        tp_high_ratio: 0.60
        partial_exit_pct: 0.31

      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY"]

      trailing_stop:
        enabled: true
        activation_pct: 0.046
        trail_pct: 0.018
        min_update_interval_sec: 5

      signal_threshold:
        enabled: true
        value: 0.0232
      cooldown_sec: null

      # Smart Limit Entry: Volatility-based pricing (Maker/GTX compliance)
      volatility_entry_logic:
        enabled: true
        regime_multipliers:
          HIGH_VOLATILITY: 0.37   # Deep offset (wider range)
          LOW_VOLATILITY: 0.16    # Tight offset
          MEAN_REVERSION: 0.28
          TREND_UP: 0.24
          TREND_DOWN: 0.24
          UNCERTAIN: 0.27
          DEFAULT: 0.24           # REQUIRED fallback

      timeframe_sec: null

    # =========================================================================
    # P2-2: DOGE/XRP REMOVED - MR-only symbols per strategies.yaml registry
    # =========================================================================
    # DOGEUSDT and XRPUSDT are assigned to mean_reversion ONLY in strategies.yaml.
    # Keeping them in aurora.assets was a source of confusion.
    # Registry SSOT (strategies_registry.assignments) now controls activation.
    # See: dm_strategy_ssot_implement_01.md, P1-1 fix.
