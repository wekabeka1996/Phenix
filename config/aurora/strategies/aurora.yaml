# ==============================================================================
# Aurora Strategy Profile — SSOT
# ==============================================================================
# CFG-STRATEGY-SSOT-FREEZE-02:
# - Strategy policy SSOT: this file (no policy in trading.yaml/domains.yaml)
# - Global Aurora policy: aurora.decision (migrated from trading.yaml)
# - Per-symbol Aurora params: aurora.assets (migrated from aurora_instruments.yaml)
# ==============================================================================

aurora:
  enabled: true
  # SCORCHED-EARTH-2026-01-27: legacy_tick_path_enabled DELETED from schema
  type: bar_driven
  description: "Bar-driven multi-signal alpha strategy (5m basis) with regime awareness"
  timeframe_sec: 300

  # ORDER-POLICY-01: Entry order execution policy (SSOT for strategy)
  # LIMIT entries require explicit tif. No silent fallbacks.
  execution:
    entry_order_type: "LIMIT"   # MUST be one of: LIMIT, MARKET
    entry_tif: "GTX"            # MUST be set for LIMIT. One of: GTC, GTX, IOC, FOK

  # DM-SAFETY-BYPASSES-P1: Explicit safety gates control (fail-closed if missing)
  # Aurora is trend-following → directional sanity and price motion gates APPLY.
  safety_gates:
    enabled: true


  # Global Aurora policy (DecisionConfig)
  decision:
    testnet:
      signal_threshold: 0.162
    production:
      signal_threshold: 0.162
    signal_threshold: 0.162
    neutral_threshold: 0.05
    symbols_to_track:
      - BTCUSDT
      - ETHUSDT
      - SOLUSDT
      - DOGEUSDT
      - XRPUSDT
    behavior_fsm:
      enable: false
      high_vol_multiplier: 2.0
      low_vol_multiplier: 0.5
    regime_threshold_multipliers:
      HIGH_VOLATILITY: 1.0
      LOW_VOLATILITY: 0.9
      MEAN_REVERSION: 0.75
      TREND_UP: 1.0
      TREND_DOWN: 1.0
      UNCERTAIN: 1.15
      DEFAULT: 1.0
    side_bias_min_score: null
    side_bias_window_sec: 420
    side_bias_target_ratio: 0.72
    side_bias_penalty_factor: 0.25
    side_bias_min_intents: 18
    cooldown_sec: 6
    retry_ttl_ms: 5000
    retry_max_count: 3
    retry_backoff_factor: 1.5
    regime_thresholds:
      HIGH_VOLATILITY: 0.18
      LOW_VOLATILITY: 99.0
      MEAN_REVERSION: 0.075
      TREND_UP: 0.12
      TREND_DOWN: 0.12
      UNCERTAIN: 99.0
      DEFAULT: 0.12
    kelly:
      base_probability: 0.5
      kelly_cap: 0.25
      kelly_alpha: 0.8
      payoff_ratio_r: 1.5
      p_min: 0.45
      p_max: 0.65
      uplift_factor: 0.20
    qos:
      mode: defer
      enforce: false
      exposure_block_cooldown_sec: 30
      symbol_cooldown_sec: 1
      max_intents_per_minute_per_symbol: 60
    signals:
      normalize_signals_mode: signed_v2
      enable_new_metrics: true
      delta_price_cap_pct: 0.02
    bar_gating: null
    roi_exit: null
    mean_reversion: null

    # Phase 4: Signal Score V2 Global Configuration
    scoring_version: v2

    # Direction/Strength split scoring (project-wide hardening)
    direction_strength_scoring:
      directional_features:
        - obi
        - tfi
        - delta_price
        - ema_bias
        - depth_imbalance
        # R1: macro_resid replaces macro_sync in directional scoring
        - macro_resid
        # Legacy: kept for telemetry; not weighted in v2 by default
        - macro_sync
      strength_features:
        - volume_spike
        - volatility_state
      strength_alpha: 0.5
      strength_cap: 1.0

    liquidity_gate:
      enabled: true
      kappa_min: 0.1
      kappa_max: 1.0
      failsafe_qty_check: true

    essential_features:
      - obi
      - delta_price
      - macro_resid  # Phase 4 Fix: Require macro_resid for fail-closed behavior

    # [Phase 3 Fix] Anchor Shock Veto: Block long signals during BTC crash
    anchor_shock_veto:
      enabled: true
      anchor_symbol: "BTCUSDT"
      threshold: -2.0  # Block BUY if macro_resid < -2.0 (strong crash)

    # === Minimum Holding Period (Anti-Churn Gate) ===
    # Prevents HFT-style churn by enforcing minimum time in position before
    # allowing signal-based exits. Does NOT affect safety exits (SL/TP/Risk).
    # RFC: docs/RFC_min_duration_logic.md
    holding_period:
      enabled: true
      min_duration_sec: 30          # Minimum seconds to hold position
      emergency_exit_threshold: 0.7  # |score| threshold for emergency override
      apply_to_flips: true          # Also apply holding period to FLIP signals

    # === VOL-ADJ-GATES-01: Sigma-normalized Motion Gates ===
    # Anti-Flat: Block entry when normalized motion too small (fee churn in dead market)
    # Anti-FOMO: Block entry when normalized motion too extreme (snapback risk)
    # Formula: pm_norm = clip(ret_window / (k_vol * vol_window), -1, 1)
    gates:
      enabled: true
      anti_flat_sigma: 0.48  # Підвищено 0.35→0.48 (2026-02-18)
      anti_fomo_sigma: 10.5  # Підвищено 7.0→10.5: менше ANTI_FOMO блоків
      # P0-2: FIXED 900 → 300 (pm_norm_900s doesn't exist in schema, only 10/60/300)
      motion_window_sec: 300 # Use 5-minute window (pm_norm_300s)

    # === Re-entry Cooldown (Anti-Ping-Pong Gate) ===
    # Prevents immediate re-entry after position closes.
    # After exiting a position, wait this many seconds before allowing new entry.
    reentry_cooldown_sec: 840  # Підвищено 300→840: Anti-Churn (2026-02-18)

    feature_neutrals:
      obi: 0.0
      tfi: 0.0
      delta_price: 0.0
      ema_bias: 0.5
      volume_spike: 0.0
      volatility_state: 0.0
      depth_imbalance: 0.5
      macro_sync: 0.5
      macro_resid: 0.0

    signal_weights:
      obi: 0.15
      tfi: 0.15
      delta_price: 0.1
      ema_bias: 0.15
      volume_spike: 0.1
      volatility_state: 0.1
      # depth_imbalance: phi in [0,1], higher = ASK dominance (sell pressure) -> negative weight
      depth_imbalance: -0.15
      # R1: macro_resid replaces macro_sync in directional scoring
      macro_resid: 0.1
      # macro_sync: 0.0  # DEPRECATED for scoring (kept as telemetry)

  # Per-symbol overrides (AuroraInstrumentConfig)
  assets:
    # ETHUSDT - Phase 3+ Optuna optimized parameters
    # Source: aurora_optimal_full_v1.yaml, aurora_phase3_production.yaml
    ETHUSDT:
      enabled: true
      position_mode: "STRICT"

      # P1: Active Leverage Management
      leverage:
        target: 20
        mode: "ISOLATED"

      # Holding period: ETH trend-following, longer holding
      holding_period:
        min_duration_sec: 360
        emergency_exit_threshold: 0.68

      # Re-entry cooldown: conservative for trend-following
      reentry_cooldown_sec: 120

      # Adjusted weights: Liquidity moved to Gate
      weights:
        ema_bias: 0.20
        volume_spike: 0.20
        # R1: macro_resid replaces macro_sync
        macro_resid: 0.25
        # macro_sync: 0.0  # DEPRECATED (telemetry only)
        # liquidity_kappa: 0.341 (Moved to Gate)
        obi: 0.15
        tfi: 0.093
        volatility_state: 0.036
        depth_imbalance: -0.256
        delta_price: 0.10

      liquidity_gate:
        enabled: true
        kappa_min: 0.2
        kappa_max: 1.0
        failsafe_qty_check: true

      side_bias:
        penalty_factor: 0.9
        window_sec: 600
        target_ratio: 0.6

      regime_thresholds:
        HIGH_VOLATILITY: 1.3
        LOW_VOLATILITY: 0.85
        MEAN_REVERSION: 1.05
        DEFAULT: 1.0

      regime_sizing:
        HIGH_VOLATILITY: 0.7
        LOW_VOLATILITY: 0.0
        MEAN_REVERSION: 0.8

      exit:
        sl_pct: 0.019
        max_hold_sec: 3000
        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          # ETH менш волатильна → консервативніші мультиплікатори
          sl_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.65        # Tight for flat low
            LOW_VOLATILITY: 0.70
            FLAT_NORMAL: 0.80
            MEAN_REVERSION: 0.90
            TREND_UP: 1.05        # Дещо шире для тренду
            TREND_DOWN: 1.05
            HIGH_VOLATILITY: 1.30
            UNCERTAIN: 1.00
          tp_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.70
            LOW_VOLATILITY: 0.75
            FLAT_NORMAL: 0.85
            MEAN_REVERSION: 0.80
            TREND_UP: 1.20        # ETH trend-following → higher TP
            TREND_DOWN: 1.20
            HIGH_VOLATILITY: 1.60
            UNCERTAIN: 1.00
          min_sl_pct: 0.002       # 0.2% - ETH дозволяє тісніший SL
          max_sl_pct: 0.015       # 1.5% max (режим дрібних профітів)
          min_tp_rr: 0.3
          max_tp_rr: 3.5
          min_dist_bps: 12        # 12 bps for ETH (більш ліквідна)

      take_profit:
        tp_low_ratio: 0.4
        tp_high_ratio: 1.4
        partial_exit_pct: 0.7

      trailing_stop:
        enabled: false
        activation_pct: 0.003
        trail_pct: 0.006
        min_update_interval_sec: 5

      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY", "UNCERTAIN"]
      signal_threshold:
        enabled: true
        value: 0.09
      cooldown_sec: null

      # Smart Limit Entry: Volatility-based pricing (Maker/GTX compliance)
      volatility_entry_logic:
        enabled: true
        regime_multipliers:
          HIGH_VOLATILITY: 0.32
          LOW_VOLATILITY: 0.17
          MEAN_REVERSION: 0.25
          TREND_UP: 0.22
          TREND_DOWN: 0.22
          UNCERTAIN: 0.25
          DEFAULT: 0.22

      timeframe_sec: null

    # SOLUSDT - Phase 3 Optuna optimized parameters
    SOLUSDT:
      # Holding period: SOL волатильна → довша утримання
      holding_period:
        min_duration_sec: 300
        emergency_exit_threshold: 0.65

      # P1: Active Leverage Management
      leverage:
        target: 20
        mode: "ISOLATED"

      # Re-entry cooldown: conservative for ALT
      reentry_cooldown_sec: 120

      # Adjusted weights: Liquidity moved to Gate
      weights:
        ema_bias: 0.20
        volume_spike: 0.20
        # R1: macro_resid replaces macro_sync
        macro_resid: 0.25
        # macro_sync: 0.0  # DEPRECATED (telemetry only)
        # liquidity_kappa: 0.25 (Moved to Gate)
        obi: 0.15
        tfi: 0.09
        volatility_state: 0.05
        depth_imbalance: -0.20
        delta_price: 0.10
      enabled: true
      position_mode: "STRICT"

      liquidity_gate:
        enabled: true
        kappa_min: 0.15
        kappa_max: 1.0
        failsafe_qty_check: true

      side_bias:
        penalty_factor: 0.0
        window_sec: 300
        target_ratio: 0.5

      regime_thresholds:
        HIGH_VOLATILITY: 1.15    # SOL ?????????? ? ????? ?????
        LOW_VOLATILITY: 0.75
        MEAN_REVERSION: 1.00
        TREND_UP: 0.90
        TREND_DOWN: 0.90
        UNCERTAIN: 1.25
        DEFAULT: 1.0

      regime_sizing:
        HIGH_VOLATILITY: 0.7
        LOW_VOLATILITY: 0.9
        TREND_UP: 1.3
        TREND_DOWN: 1.3
        MEAN_REVERSION: 3.0

      exit:
        sl_pct: 0.0135
        max_hold_sec: 3000
        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          # SOL дуже волатильна → більші мультиплікатори
          sl_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.60        # Tight SL для flat
            LOW_VOLATILITY: 0.65
            FLAT_NORMAL: 0.75
            MEAN_REVERSION: 0.85
            TREND_UP: 1.15        # Wide SL для тренду
            TREND_DOWN: 1.15
            HIGH_VOLATILITY: 1.30
            UNCERTAIN: 1.00
          tp_mult:
            DEFAULT: 1.0
            FLAT_LOW: 0.65
            LOW_VOLATILITY: 0.70
            FLAT_NORMAL: 0.80
            MEAN_REVERSION: 0.75
            TREND_UP: 1.30        # Higher TP for trends
            TREND_DOWN: 1.30
            HIGH_VOLATILITY: 1.60
            UNCERTAIN: 1.00
          min_sl_pct: 0.0025      # 0.25% - дозволяємо тіснішу SL
          max_sl_pct: 0.020       # 2.0% max (режим дрібних профітів)
          min_tp_rr: 0.25         # Нижчий мін RR для SOL (менше потенціалу)
          max_tp_rr: 3.5
          min_dist_bps: 18        # 18 bps (менш ліквідна ніж BTC/ETH)

      take_profit:
        tp_low_ratio: 0.36
        tp_high_ratio: 0.60
        partial_exit_pct: 0.31

      allowed_regimes: ["TREND_UP", "TREND_DOWN", "MEAN_REVERSION", "HIGH_VOLATILITY", "LOW_VOLATILITY"]

      trailing_stop:
        enabled: true
        activation_pct: 0.046
        trail_pct: 0.018
        min_update_interval_sec: 5

      signal_threshold:
        enabled: true
        value: 0.09
      cooldown_sec: null

      # Smart Limit Entry: Volatility-based pricing (Maker/GTX compliance)
      volatility_entry_logic:
        enabled: true
        regime_multipliers:
          HIGH_VOLATILITY: 0.37
          LOW_VOLATILITY: 0.16
          MEAN_REVERSION: 0.28
          TREND_UP: 0.24
          TREND_DOWN: 0.24
          UNCERTAIN: 0.27
          DEFAULT: 0.24           # REQUIRED fallback

      timeframe_sec: null

    # =========================================================================
    # P2-2: DOGE/XRP REMOVED - MR-only symbols per strategies.yaml registry
    # =========================================================================
    # DOGEUSDT and XRPUSDT are assigned to mean_reversion ONLY in strategies.yaml.
    # Keeping them in aurora.assets was a source of confusion.
    # Registry SSOT (strategies_registry.assignments) now controls activation.
    # See: dm_strategy_ssot_implement_01.md, P1-1 fix.
    # =========================================================================

    # BTCUSDT - Golden Run Configuration (CLEAN SLATE RESTORE)
    BTCUSDT:
      enabled: true
      position_mode: "STRICT"

      # 1. Leverage & Sizing
      leverage:
        target: 35
        mode: "ISOLATED"
      side_bias:
        penalty_factor: 0.5
        window_sec: 600
        target_ratio: 0.6

      # 2. Weights (Standard)
      weights:
        ema_bias: 0.20
        volume_spike: 0.15
        macro_resid: 0.15
        obi: 0.20
        tfi: 0.10
        volatility_state: 0.10
        depth_imbalance: -0.05
        delta_price: 0.05

      # 3. Safety Gates
      holding_period:
        min_duration_sec: 20
        emergency_exit_threshold: 0.7
      reentry_cooldown_sec: 300
      liquidity_gate:
        enabled: true
        kappa_min: 0.1
        kappa_max: 1.0
        failsafe_qty_check: true

      # 4. Regime Filters (The Logic)
      # Block MR/Uncertain via thresholds. Enable others.
      regime_thresholds:
        HIGH_VOLATILITY: 0.18
        LOW_VOLATILITY: 0.12
        TREND_UP: 0.1
        TREND_DOWN: 0.1
        MEAN_REVERSION: 0.07
        UNCERTAIN: 99.0
        DEFAULT: 99.0

      # 5. Position Sizing per Regime
      regime_sizing:
        HIGH_VOLATILITY: 0.7
        LOW_VOLATILITY: 0.7
        TREND_UP: 1.3
        TREND_DOWN: 1.3
        MEAN_REVERSION: 0.7  # Redundant safety

      # 6. Exits (The Profit Engine)
      exit:
        sl_pct: 0.005  # Base 0.5%
        max_hold_sec: 3000

        regime_tpsl:
          enabled: true
          mode: "pct_mult"
          sl_mult:
            LOW_VOLATILITY: 0.8   # Tight stop
            HIGH_VOLATILITY: 1.3
            TREND_UP: 1.0
            TREND_DOWN: 1.0
            DEFAULT: 1.0
          tp_mult:
            LOW_VOLATILITY: 1.5   # Target ~0.75%
            HIGH_VOLATILITY: 1.6
            TREND_UP: 3.5
            TREND_DOWN: 3.5
            DEFAULT: 1.5
          # Guardrails
          min_sl_pct: 0.003
          max_sl_pct: 0.06
          min_tp_rr: 0.5
          max_tp_rr: 5.0
          min_dist_bps: 15

      take_profit:
        tp_low_ratio: 1.0
        tp_high_ratio: 2.0
        partial_exit_pct: 0.5

      trailing_stop:
        enabled: false
        activation_pct: 0.02
        trail_pct: 0.01
        min_update_interval_sec: 5

      allowed_regimes: ["TREND_UP", "TREND_DOWN", "HIGH_VOLATILITY", "MEAN_REVERSION", "LOW_VOLATILITY"]
      signal_threshold:
        enabled: false
        value: null
      cooldown_sec: null

      # 7. Entry Logic (Smart Pullback)
      # High Vol: Deep pullback (0.5). Low Vol: Moderate (0.2).
      volatility_entry_logic:
        enabled: true
        regime_multipliers:
          HIGH_VOLATILITY: 0.5
          LOW_VOLATILITY: 0.2
          TREND_UP: 0.2
          TREND_DOWN: 0.2
          MEAN_REVERSION: 0.2
          UNCERTAIN: 0.2
          DEFAULT: 0.2

      timeframe_sec: null
