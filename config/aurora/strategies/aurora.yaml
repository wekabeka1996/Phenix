        window_sec: 600
        target_ratio: 0.6

      regime_thresholds:
        HIGH_VOLATILITY: 1.3
        LOW_VOLATILITY: 0.85
        MEAN_REVERSION: 1.05
        DEFAULT: 1.0

      regime_sizing:
        HIGH_VOLATILITY: 0.3
