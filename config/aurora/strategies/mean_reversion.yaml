# ==================================================================================
# 3m Mean Reversion Strategy Configuration
# ==================================================================================
# Phase B4: Production configuration for Mean Reversion 3m strategy
#
# This config defines parameters for the bar-based MR strategy that uses:
# - Bollinger Bands for entry signals
# - FLAT regime filtering
# - ATR-based stops adjusted by regime type
#
# Source: January 2024 research calibration
# ==================================================================================

mean_reversion:
  # Global enable/disable
  # CFG-STRATEGIES-SSOT-05: SSOT for MR config (no longer in trading.yaml)
  enabled: true

  # Timeframe for bar aggregation
  # FIX-TF-ALIGNMENT: Changed from 180 (3m) to 300 (5m) to match the active bar pipeline.
  # The strategy operates on 5m bars; 3m inputs were rejected by the runtime path.
  timeframe_sec: 300  # 5-minute bars

  # Global allowed regimes whitelist (default; can be overridden per-asset)
  allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

  # ORDER-POLICY-01: Entry order execution policy (SSOT for strategy)
  # MR uses MARKET orders for fast mean-reversion entries
  execution:
    entry_order_type: "MARKET"   # MUST be one of: LIMIT, MARKET
    entry_tif: null              # null for MARKET orders (ignored)

  # DM-SAFETY-BYPASSES-P1: Explicit safety gates control (fail-closed if missing)
  # Mean reversion trades AGAINST trend  safety gates DISABLED.
  # Phase 0.6: off  MR is counter-trend; stress overlay does not apply.
  safety_gates:
    enabled: false
    system_stress_policy: "off"       # "off" | "attenuate" | "block" (quoted: YAML parses bare 'off' as bool)

  objective:
    enabled: true
    regimes:
      FLAT_LOW:
        weights:
          cost: 1.1
          risk: 1.0
          edge: 1.2
          execution: 1.1
          information: 1.0
          behavior: 0.9
        multiplier:
          m_min: 0.2
          m_max: 1.2
          lambda_scale: 1.0
          penalty_center: -4.5
          penalty_scale: 2.0
        gate:
          min_objective_score: 0.05
          enforcement_mode: "OBSERVE"
      FLAT_NORMAL:
        weights:
          cost: 1.0
          risk: 1.0
          edge: 1.4
          execution: 1.0
          information: 1.0
          behavior: 0.8
        multiplier:
          m_min: 0.2
          m_max: 1.3
          lambda_scale: 1.0
          penalty_center: -4.5
          penalty_scale: 2.0
        gate:
          min_objective_score: 0.06
          enforcement_mode: "OBSERVE"
      FLAT_HIGH:
        weights:
          cost: 1.2
          risk: 1.3
          edge: 1.0
          execution: 1.2
          information: 1.0
          behavior: 1.0
        multiplier:
          m_min: 0.15
          m_max: 1.1
          lambda_scale: 1.0
          penalty_center: -4.0
          penalty_scale: 2.0
        gate:
          min_objective_score: 0.08
          enforcement_mode: "OBSERVE"
      MEAN_REVERSION:
        weights:
          cost: 1.3
          risk: 1.0
          edge: 1.3
          execution: 1.1
          information: 1.0
          behavior: 0.9
        multiplier:
          m_min: 0.2
          m_max: 1.25
          lambda_scale: 1.0
          penalty_center: -4.5
          penalty_scale: 2.0
        gate:
          min_objective_score: 0.06
          enforcement_mode: "OBSERVE"


  #
  # Strategy Parameters (global defaults)
  #
  strategy:
    # Bollinger Bands
    bb_window: 20
    bb_num_std: 2.0

    # Other indicators
    atr_window: 14
    rsi_window: 14

    # Entry thresholds
    entry_threshold: 0.115     # %B threshold (5% inside band)
    rsi_oversold: 30
    rsi_overbought: 70

    # Minimum bars before generating signals
    min_bars: 25

    # BB width filters (avoid too tight/wide ranges)
    min_bb_width: 0.001        # 0.1%
    max_bb_width: 0.15         # 15%

    # Stop loss (ATR multiple)
    sl_atr_mult: 1.5

    # Take profit: target mid BB
    tp_to_mid: true

    # Cooldown between signals (seconds)
    cooldown_sec: 60

    #  Tier D: Confidence Scalars
    # Controls how signal confidence [0, 1] is calculated:
    #   confidence = confidence_base + |pct_b_distance| * confidence_bb_slope
    #   + confidence_rsi_bonus (if RSI confirms)
    # Clamped to 1.0 before emitting.
    confidence_base: 0.5        # Base confidence when BB threshold just touched (50%)
    confidence_bb_slope: 2.0    # Sensitivity: 0.1 extra distance  +0.2 confidence
    confidence_rsi_bonus: 0.2   # Bonus when RSI confirms oversold/overbought (+20%)

  #
  # FLAT Regime Thresholds (for regime classification)
  #
  regime_thresholds:
    high_vol_pct: 0.003        # 0.3% ATR  FLAT_HIGH
    low_vol_pct: 0.001         # 0.1% ATR  FLAT_LOW

  #
  # Per-Asset Configurations
  #
  # Champion parameters from Phase 3 Track B production testing
  # Source: trading.yaml optimization (December 2025)

  assets:
    # --- DOGE (CHAMPION ) ---
    DOGEUSDT:
      enabled: true
      position_mode: "STRICT"

      # P1: Active Leverage Management
      leverage:
        target: 10
        mode: "ISOLATED"

      strategy:
        bb_window: 20
        bb_num_std: 2.1
        min_bb_width: 0.005  # (min_vol_atr from report)
        entry_threshold: 0.05
        # Exit parameters
        sl_atr_mult: 2.0     # P0.5: widened from 0.75 — 3/4 BUY orders hit SL instantly at old value
        tp_to_mid: false     # False for outer band target
        cooldown_sec: 210
      # Regime Gating - DOGE champion (+$387) - includes FLAT_HIGH for ""
      allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

    # --- BTC (BRONZE ) ---
    BTCUSDT:
      enabled: false
      position_mode: "STRICT"

      # P1: Active Leverage Management
      leverage:
        target: 12
        mode: "ISOLATED"

      strategy:
        bb_window: 40
        bb_num_std: 1.6
        min_bb_width: 0.004
        entry_threshold: 0.24
        tp_to_mid: true      # Default behavior
        sl_atr_mult: 2.0   # FIX: Was null, preventing ATR-based SL. 2.0x ATR = industry standard
        cooldown_sec: 360    # No cooldown
      # Regime Gating - BTC conservative (+$103) - include MEAN_REVERSION for backtest
      allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

    # --- XRP (SILVER ) ---
    XRPUSDT:
      enabled: false
      position_mode: "STRICT"

      # P1: Active Leverage Management
      leverage:
        target: 10
        mode: "ISOLATED"

      strategy:
        bb_window: 40
        bb_num_std: 2.5
        min_bb_width: 0.007
        entry_threshold: 0.05
        tp_to_mid: true
        sl_atr_mult: 2.0   # FIX: Was null, preventing ATR-based SL. 2.0x ATR = industry standard
        cooldown_sec: 165
      # Regime Gating - XRP stable (+$121) - similar to DOGE
      allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

    # --- Optional assets (disabled) ---
    ETHUSDT:
      enabled: false
      position_mode: "STRICT"
      strategy:
        bb_window: null
        bb_num_std: null
        min_bb_width: null
        entry_threshold: null
        tp_to_mid: null
        sl_atr_mult: null
        cooldown_sec: null
      allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

    SOLUSDT:
      enabled: false
      position_mode: "STRICT"
      strategy:
        bb_window: 24
        bb_num_std: 1.8
        min_bb_width: 0.025
        entry_threshold: 0.12
        tp_to_mid: true
        sl_atr_mult: 1.0
        cooldown_sec: 210
      allowed_regimes: ["FLAT_LOW", "FLAT_NORMAL", "FLAT_HIGH", "MEAN_REVERSION"]

  #
  # Vector 1: Microstructure Veto Overlay
  #
  # Bivariate logic using TFI (Trade Flow Imbalance) + price reaction.
  # Blocks toxic continuation, allows absorption.
  # Fail-closed when required features are missing.
  #
  microstructure_veto:
    enabled: false                          # Disabled by default until validated
    tfi_ema_span: 5                         # EMA smoothing for raw TFI
    tfi_adverse_threshold: 0.3              # |TFI| > 0.3 = adverse flow
    obi_confirm_enabled: false              # OBI is confirm-only, not sole driver
    obi_adverse_threshold: 0.3              # |OBI| > 0.3 = adverse book state
    price_reaction_lookback_sec: 60         # 60s window for price continuation
    price_continuation_threshold: 0.001     # 0.1% adverse move = toxic continuation
    absorption_wick_ratio_min: 0.4          # Wick >= 40% of range = absorption
    absorption_rebound_threshold: 0.0005    # 0.05% favorable move = rebound
    readiness_min_bars: 5                   # Min bars before veto engages
    missing_policy: "block"                 # Only "block" accepted (fail-closed); "skip" removed in R1 hardening

  #
  # Vector 2: Directional Bias Threshold Modulation
  #
  # Splits symmetric entry_threshold into base_long and base_short.
  # Funding rate modulates thresholds dynamically.
  # Missing funding degrades to static split thresholds (no fail-closed).
  #
  directional_bias:
    enabled: false                          # Disabled by default until validated
    base_long_threshold: 0.115              # Static %B for LONG (matches legacy entry_threshold)
    base_short_threshold: 0.115             # Static %B for SHORT (matches legacy entry_threshold)
    funding_shift_magnitude: 0.02           # Max threshold shift per unit normalized funding
    funding_normalization_scale: 0.0003     # funding_rate / this = normalized [-1, 1]
    funding_deadband: 0.1                   # |norm_funding| < 0.1 = zero (noise)
    threshold_clamp_min: 0.01               # Floor: prevents degenerate entries
    threshold_clamp_max: 0.3                # Ceiling: prevents unreachable entries

  #
  # Regime Sizing Multipliers
  #
  # Adjust position size based on FLAT regime type

  regime_sizing:
    FLAT_LOW:
      sizing_mult: 0.8         # Smaller size in low vol
      stop_mult: 1.0           # Tighter stops -> Standard stops (prevent suffocation)
      target_mult: 0.8         # Smaller targets

    FLAT_NORMAL:
      sizing_mult: 1.0         # Standard size
      stop_mult: 1.0           # Standard stops
      target_mult: 1.0         # Standard targets

    FLAT_HIGH:
      sizing_mult: 0.7         # Smaller size in high vol
      stop_mult: 1.5           # Wider stops
      target_mult: 1.2         # Larger targets
