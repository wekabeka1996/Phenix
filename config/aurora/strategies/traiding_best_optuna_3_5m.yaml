# Generated: 2025-12-03
# Optimizer: Optuna (1500 trials per asset with fine-grained steps)
# Validation Period: January 2024
# Portfolio PnL: +$283.30/month
#
# STRATEGY IMPROVEMENT SUMMARY:
# ══════════════════════════════════════════════════════════════════════════════
# Version 1 (600 trials, 3m only, no OBI/TFI):
#   - SOL: +$130.04, XRP: +$23.17, DOGE: +$3.98
#   - ETH/BTC: NEGATIVE (failed on 3m)
#
# Version 2 (600 trials, 3m, WITH OBI/TFI):
#   - Breakthrough: Order Flow metrics enabled profitable trading
#
# Version 3 (1500 trials, 3m/5m mixed, fine steps):
#   - SOL: +$173.73 (3m) - EMA + TFI hybrid
#   - ETH: +$76.12 (5m) - Pure Order Flow (TFI/OBI = 0.92 weight)
#   - XRP: +$28.95 (3m) - Balanced
#   - DOGE: +$5.20 (3m) - Low volatility scalping
#   - BTC: -$3.77 (5m) - Macro anchor (acceptable)
#
# KEY INSIGHTS:
# ──────────────────────────────────────────────────────────────────────────────
# 1. TFI (Trade Flow Imbalance) is the alpha:
#    - SOL: weight 0.36, ETH: weight 0.47
#    - Measures aggressive buying/selling, confirms trend quality
#
# 2. 5m works for efficient markets (ETH, BTC):
#    - Reduces noise, increases signal quality
#    - ETH win rate: 67.7% on 5m
#
# 3. 3m works for volatile altcoins (SOL, XRP, DOGE):
#    - Fast reaction to micro-trends
#    - SOL captures TREND_DOWN crashes
#
# 4. Regime filtering is critical:
#    - TREND_DOWN > LOW_VOLATILITY > TREND_UP (priority)
#    - TREND_UP consistently loses money
#
# ══════════════════════════════════════════════════════════════════════════════

strategy:
  name: "Aurora Multi-Timeframe"
  version: "v4.0-optuna-obi-tfi"
  description: "Mixed 3m/5m strategy with Order Flow (OBI/TFI) integration"
  
  # Global Settings
  global:
    position_size_usd: 1000
    maker_fee: 0.0002  # 0.02%
    taker_fee: 0.0005  # 0.05%
    slippage: 0.0001   # 0.01%
    cost_basis: 0.0008 # maker + taker + slippage
    
  # Risk Management
  risk:
    max_concurrent_positions: 5
    daily_loss_limit_usd: 500
    per_asset_exposure_pct: 20  # 20% of capital per asset
    
  # Asset Configurations (Optimized via 1500-trial Optuna)
  assets:
    
    # ──────────────────────────────────────────────────────────────────────
    # SOLUSDT (3m) - The Cash Cow 🐮
    # ──────────────────────────────────────────────────────────────────────
    SOLUSDT:
      enabled: true
      timeframe: "3m"
      
      # EMA Configuration
      ema_period_short: 7
      ema_period_long: 25
      
      # Volume Spike Detection
      volume_window_sec: 280
      volume_sma_length: 16
      volume_cap_max: 3.439
      
      # Liquidity Assessment
      liquidity_depth_half: 3000.0
      liquidity_kappa_min: 0.345
      
      # Order Flow (OBI/TFI) - KEY ALPHA
      obi_window_sec: 70
      tfi_window_sec: 160
      
      # Decision Weights (normalized internally)
      weight_ema: 0.467        # Price structure
      weight_volume: 0.242     # Activity
      weight_macro: 0.138      # BTC correlation
      weight_liquidity: 0.138  # Market depth
      weight_obi: 0.344        # Order book pressure
      weight_tfi: 0.363        # Trade flow aggression (CRITICAL)
      
      # Signal & Risk Filters
      signal_threshold: 0.110
      max_risk_score: 0.784
      
      # Risk Management
      sl_pct: 0.526  # 0.526% stop loss
      max_hold_sec: 660  # 11 minutes max hold
      
      # Regime Filter
      allowed_regimes:
        - TREND_DOWN  # Primary edge: shorting crashes
        
      # Expected Performance
      metrics:
        expected_pnl: 173.73
        win_rate: 0.508
        calmar: 3.08
        trades_per_month: 199
        max_drawdown: -56.47
        
