# ==============================================================================
# STRATEGIES REGISTRY SSOT
# ==============================================================================
# Phase 0: Strategy assignments + arbitration (CFG-STRATEGIES-SSOT-01-REGISTRY-ARBITRATION)
#
# CANONICAL SOURCE OF TRUTH  :
# 1.
# 2.
#
# ConfigLoader    AuroraConfig.strategies_registry
# Strict mode: missing file  ValueError
# ==============================================================================

version: "1.0.0"

# ==============================================================================
# STRATEGY ASSIGNMENTS (per-symbol)
# ==============================================================================
#       (strategy_id)
# Valid strategy_id values:
# - "aurora": Bar-driven multi-signal strategy (5m basis)
# - "mean_reversion": Bar-based Bollinger Bands strategy (1m bars)
# - "alpha_mr_s01": S01 weighted mean-reversion strategy candidate (5m basis)
# ==============================================================================
assignments:
  ETHUSDT:
    - aurora
    - alpha_mr_s01
    - mean_reversion
    - md_amr
    - llm_microstructure
  SOLUSDT:
    - alpha_ta_ensemble
    - mean_reversion
  XRPUSDT:
    - aurora
    - alpha_mr_s01
    - mean_reversion
    - md_amr
  BTCUSDT:
    - aurora
    - alpha_mr_s01
    - mean_reversion
    - md_amr
    - llm_microstructure
  BNBUSDT:
    - aurora
    - alpha_mr_s01
    - mean_reversion
    - md_amr
  1000PEPEUSDT:
    - aurora
    - alpha_mr_s01
    - mean_reversion
    - md_amr
  DOGEUSDT:
    - alpha_ta_ensemble
    - mean_reversion
# New entries only. Existing-position SL/TP/CLOSE paths remain authorized.
entry_quarantine:
  XRPUSDT:
    - SELL

counterfactual_overlays:
  - experiment_id: btc_md_amr_nrr063
    enabled: true
    strategy_id: md_amr
    symbol: BTCUSDT
    regime: TREND_DOWN
    sides: [BUY, SELL]
    nrr_codes: [NRR-063]
    holding_horizons_min: [15, 30, 60, 120]
    minimum_independent_episodes: 30
    minimum_market_days: 3
  - experiment_id: btc_md_amr_nrr030
    enabled: true
    strategy_id: md_amr
    symbol: BTCUSDT
    regime: TREND_DOWN
    sides: [BUY, SELL]
    nrr_codes: [NRR-030]
    holding_horizons_min: [15, 30, 60, 120]
    minimum_independent_episodes: 30
    minimum_market_days: 3

# New-risk churn guard. Existing-position management bypasses this budget.
turnover_budgets:
  aurora:
    "*":
      max_entry_intents_per_hour: 6
      min_entry_spacing_sec: 60
  mean_reversion:
    "*":
      max_entry_intents_per_hour: 4
      min_entry_spacing_sec: 180
  md_amr:
    "*":
      max_entry_intents_per_hour: 4
      min_entry_spacing_sec: 180
  alpha_mr_s01:
    "*":
      max_entry_intents_per_hour: 3
      min_entry_spacing_sec: 300
  alpha_ta_ensemble:
    "*":
      max_entry_intents_per_hour: 3
      min_entry_spacing_sec: 300
  llm_microstructure:
    "*":
      max_entry_intents_per_hour: 2
      min_entry_spacing_sec: 300


# ==============================================================================
# ARBITRATION (conflict resolution)
# ==============================================================================
#  symbol  >1      intent
# "decision window",     .
#
# Modes:
# - "priority":    (strategy_id  rank)
# - "regime":      (NOT IMPLEMENTED yet)
# - "round_robin":  (NOT IMPLEMENTED yet)
# ==============================================================================
arbitration:
  mode: priority

  # Decision window (ms): priority arbitration applies only within the same window.
  # This prevents permanent suppression of the lower-priority strategy on hybrid symbols (e.g. BTC).
  window_ms: 1000

  # Priority ranks (lower = higher priority)
  #  Aurora  MR    BTC:
  # - Aurora   1 ()
  # - Alpha MR S01   2 ()
  # - MR   3 ()
  # : Aurora intent , MR intent
  priority:
    aurora: 1
    alpha_mr_s01: 2
    mean_reversion: 3
    md_amr: 4
    llm_microstructure: 5
    alpha_ta_ensemble: 6

  # Logging policy:  ,  intent
  # - rejected_strategy: ID ,
  # - reason:  why- (80 )
  logging:
    rejected_why_prefix: "ARBITRATION_REJECT"  # Prefix  why-
    log_level: "INFO"  #   (INFO/WARNING)
