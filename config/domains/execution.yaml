# v2 config for execution domain
# See docs/config_v2/specification.md for full contract.

# ExecutorPool: Per-symbol parallel execution (Phase 2 migration)
# Replaces single SyncOrderExecutor with per-symbol executors
executor_pool:
  enabled: true                      # Enable per-symbol parallel execution
  max_orders_per_second: 8           # Global rate limit (below Binance 10/sec)
  fill_timeout_sec: 60.0             # Max wait time for fill before timeout

# HTTP adapter configuration for Binance REST API
# Used by BinanceExecutionAdapter for timeout/retry settings
adapter:
  timeouts:
    connect: 10.0    # TCP connection timeout (sec) - testnet default
    read: 30.0       # Response read timeout (sec) - testnet needs generous timeouts
    write: 10.0      # Request write timeout (sec)
    pool: 10.0       # Connection pool timeout (sec)
  retry:
    max_retries: 3
    initial_backoff_sec: 0.5
    max_backoff_sec: 8.0
    backoff_multiplier: 2.0
  websocket:
    initial_delay_sec: 1.0   # Initial reconnect delay after WS disconnect
    max_delay_sec: 60.0      # Maximum reconnect delay cap (was 30, matches ws_max_reconnect_delay)
    multiplier: 2.0          # Exponential backoff multiplier
    reset_after_success: true  # Reset delay to initial after successful connect
    listen_key_keepalive_sec: 2700  # Listen key refresh interval (45 min = 45*60)
  # Time synchronization configuration for Binance API
  # Addresses -1021 timestamp errors by maintaining fresh server time offset
  time_sync:
    # recvWindow per environment (ms) - max allowed request age
    recv_window_mainnet_ms: 5000     # Mainnet: 5s (tighter, lower latency)
    recv_window_testnet_ms: 20000    # Testnet: 20s (more lenient for high latency)
    # Sync schedule
    interval_sec: 30                  # How often to refresh offset in background
    cache_valid_sec: 25               # How long cached offset is considered valid
    # Drift monitoring
    max_drift_warn_ms: 500            # Warn if drift exceeds this (ms)
    max_drift_change_warn_ms: 10000   # Warn if drift changes by more than this (ms)
    max_drift_hard_limit_ms: 60000    # Hard limit - reject requests if exceeded
    # Sync retry configuration (for _do_sync method)
    sync_max_attempts: 5              # Max attempts for initial/forced sync
    sync_backoff_base_sec: 0.5        # Base backoff between sync attempts
    sync_timeout_sec: 10.0            # HTTP timeout for /fapi/v1/time
    stale_cache_grace_period_sec: 300.0  # Allow stale offset for 5 min if sync fails
    # Retry configuration for -1021 errors specifically
    error_1021:
      max_retries: 2                  # Retry count after -1021 (not initial attempt)
      backoff_base_sec: 0.3           # Base backoff between retries
      backoff_multiplier: 2.0         # Exponential backoff multiplier
      force_sync_before_retry: true   # Force time sync before each retry
  # Open orders query configuration
  open_orders:
    max_attempts: 3                   # Max retry attempts for get_open_orders
    backoff_ms: [200, 500]            # Backoff delays between attempts (ms)
    fallback_reason: "API_ORDERS_FAILED"  # Reason code for fallback mode

exposure:
  # from trading.execution.exposure.*
  max_equity_utilization_pct: 10.0  # matches trading.execution.exposure.max_equity_utilization_pct (percent scale, 10% limit)
  max_portfolio_fraction: 0.10       # Notional-based fallback: max 10% for testnet
  max_side_utilization_pct:
    long: 10.0                      # Limit long exposure to 10%
    short: 10.0                     # Limit short exposure to 10%
  max_directional_ratio: 3.0         # Max ratio between long and short margin (3:1)
  per_symbol_cap_pct: 8.0            # Max 8% of equity per symbol per side
  count_pending_orders: true
  exclude_reduce_only: true
  pending_ttl_sec: 45                # Reduced from 90 for faster cleanup on testnet
  post_fill_hold_ttl_sec: 10         # Hold filled intents a bit longer to avoid churn
  positions_stale_ttl_sec: 5         # Consider reserved capacity stale quickly on testnet
  leverage_defaults:                 # Leverage per symbol - testnet high leverage
    enable: true                     # Enable bracket order management with atomic close and cancellation
    oco_emulation: true              # Enable OCO emulation: when SL or TP fills, cancel the counterpart
    stop_loss_bps: 50                # Fallback distance in bps, used by Kelly calculation
    take_profit_low_ratio: 0.5       # Used if tp.fixed_bps not set
    take_profit_high_ratio: 1.0      # Used if tp.fixed_bps not set
    sl:
      fixed_bps: 50                  # Priority over stop_loss_bps for SL calculation
    tp:
      fixed_bps: 100                 # Priority over take_profit_*_ratio for TP calculation
    offset_bps: 5                    # Safety offset to apply before placing SL/TP (avoids -2021 errors)
    working_type_default: "MARK_PRICE"  # Default workingType for SL/TP orders
    price_protect: false             # Set priceProtect=true for SL/TP to prevent slippage
    sl_roi_pct: 35.0                 # ROI-based SL distance (% of margin with leverage)
    tp_roi_pct: 50.0                 # ROI-based TP distance (% of margin with leverage)
    roi_basis: "margin"              # Basis for ROI calc (margin or equity)
    leverage_source: "instrument_max"  # instrument_max | exposure_defaults
    retry:
      max_attempts: 3                # Max retry attempts for -2021/-4116/-4137 errors
      backoff_ms: [120, 250, 400]    # Exponential backoff (ms)
      fallback_to_limit: true        # After max retries on -2021, fallback to LIMIT order
    timeout_sec: 5                   # Timeout for pending order cleanup (seconds)
    atomic_close: true               # Prevent orphaned bracket accumulation
    bracket_tracking: true           # Track SL/TP order IDs per symbol
  aggregated_oco:
    enabled: true                  # Enable Aggregated OCO management for TP/SL
    aggregated_only_mode: true     # Force clean entry/exit orders (no inline TP/SL)
    sl_roi_pct: 35.0
    tp_roi_pct: 50.0
    roi_basis: "margin"
    leverage_source: "instrument_max"
    recalc_on_scale_in: true       # Rebuild brackets when position grows
    recalc_on_partial_close: true  # Rebuild brackets when position shrinks
    ttl_protect_new_bracket_ms: 3000
    allow_unprotected_position: false
    recreate_missing_brackets: true  # R2-E: Recreate SL/TP if missing during open position (fail-closed mode)
    watchdog:
      enabled: true
      interval_sec: 5
      auto_heal_orphans: true
      grace:
        enabled: true
        period_sec: 2.0
        kinds:
          - NO_SL_FOR_OPEN_POSITION
          - ORPHAN_SL_FOR_ZERO_POSITION
  quick_profit:
    enabled: false                   # Quick profit (close when profit target reached) - default disabled
    mode: "fixed_usd"
    target_usd: 2.0
    priority: "highest"
    ignore_other_rules: true
  order_guardian:
    poll_interval_ms: 500
    batch_limit: 50
    rate_limit_per_min: 120
  guardian:
    unified: true
    emit_tidy_event: true
    poll_interval_ms: 500
    cleanup_ttl_ms: 700
    symbol_cooldown_ms: 800
  watchdog:
    ack_ttl_ms: 8000
    fill_ttl_ms: 300000
    check_interval_ms: 1000
    timeouts:
      ack_ttl_ms: 8000
      fill_ttl_ms: 300000
      check_interval_ms: 1000
  orphan_monitor:
    enabled: true                    # Master switch for background monitor
    run_on_startup: true             # One-time sync on startup to cancel orphans immediately
    periodic_interval_sec: 90        # Reduced from 300 to 90 seconds for faster cleanup
    min_order_age_sec: 0             # Skip cancelling orders newer than this age (0 disables)
    batch_cancel_limit: 50           # Max cancels per single loop run to avoid bursts
    rate_limit_per_min: 120          # Global per-minute cancel cap across symbols (0 disables)
    offset_bps: 30                   # Safety offset to apply before TP/SL (in basis points)

fallback:
  policy: fail_closed
  risk_reduction_pct: 0.5
  backoff_ms: [200, 500, 1000]
  max_attempts: 4
  enabled: true

# Execution Position Configuration - ULTRA CONSERVATIVE Profile
execution:
  aggregated_oco:
    enabled: true
    aggregated_only_mode: false
    sl_pct: 0.002      # 0.2% stop-loss
    tp_rr: 2.0        # 2.0x risk-reward ratio
    recalc_on_scale_in: true
    recalc_on_partial_close: false
    ttl_protect_new_bracket_ms: 3000
    allow_unprotected_position: false
    max_sl_legs: 2
    max_tp_legs: 3
    watchdog:
      enabled: true
      interval_sec: 10
      auto_heal_orphans: true
      grace:
        enabled: true
        period_sec: 3.0
        kinds:
          - NO_SL_FOR_OPEN_POSITION
          - ORPHAN_SL
          - TOO_MANY_SL

brackets:
  # Canonical brackets block for resolve_brackets_config (mirrors manage.brackets during migration)
  enable: true
  oco_emulation: true
  stop_loss_bps: 50
  take_profit_low_ratio: 0.5
  take_profit_high_ratio: 1.0
  sl:
    fixed_bps: 50
  tp:
    fixed_bps: 100
  offset_bps: 5
  working_type_default: "MARK_PRICE"
  price_protect: false
  retry:
    max_attempts: 3
    backoff_ms: [120, 250, 400]
    fallback_to_limit: true
  timeout_sec: 5
  atomic_close: true
  bracket_tracking: true
  aggregated_oco:
    enabled: true
    aggregated_only_mode: true
    sl_roi_pct: 35.0
    tp_roi_pct: 50.0
    roi_basis: "margin"
    leverage_source: "instrument_max"
    recalc_on_scale_in: true
    recalc_on_partial_close: true
    ttl_protect_new_bracket_ms: 3000
    allow_unprotected_position: false
    watchdog:
      enabled: true
      interval_sec: 5
      auto_heal_orphans: true
      grace:
        enabled: true
        period_sec: 2.0
        kinds:
          - NO_SL_FOR_OPEN_POSITION
          - ORPHAN_SL_FOR_ZERO_POSITION
