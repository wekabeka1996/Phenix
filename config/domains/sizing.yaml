# v2 config for sizing domain
# See docs/config_v2/specification.md and migration_standards.md

defaults:
  mode: "fixed_risk_pct"     # fixed_risk_pct / fixed_usd / kelly / hybrid
  max_risk_pct: 1.0          # % від equity на одну угоду (risk_fraction_q * 100)
  max_risk_usd: 50.0         # hard cap у USD
  min_notional_usd: 10.0     # мінімальний розмір угоди
  max_notional_usd: 10000.0  # максимальний розмір угоди (liquidity_based_cap_usd)
  liquidity_kappa: 1.0       # liquidity kappa factor
  liquidity_kappa_mode: "dynamic"  # dynamic / static
  kelly:
    base_probability: 0.55
    kelly_cap: 0.25
    kelly_alpha: 0.8
    payoff_ratio_r: 2.0

symbols: {}

regimes:
  HIGH_VOLATILITY: 0.60   # sizing multiplier
  LOW_VOLATILITY: 1.20
  MEAN_REVERSION: 0.50
  UNCERTAIN: 0.50
