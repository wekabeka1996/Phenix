# =============================================================================
# Optimizer Configuration — Aurora Hierarchical Optimization
# =============================================================================

# Optuna study settings
optuna:
  sampler: TPE                 # Tree-structured Parzen Estimator
  storage: "sqlite:///optimization_studies.db"
  n_jobs: 1
  pruner:
    type: MedianPruner
    n_startup_trials: 5
    n_warmup_steps: 3

# Stage 0: Regime Calibration
stage0:
  n_trials: 50
  study_name_prefix: "aurora_regime"
  # Outer grid: basis_tf_sec values to iterate over
  # Each value gets its own Optuna study; best stability_score across grids wins
  outer_grid:
    basis_tf_sec: [300]
  acceptance:
    min_stability_score: 0.0   # FAST-FULL temporary forensic profile
    min_definite_ratio: 0.0    # FAST-FULL temporary forensic profile

# Stage 1: Alpha Search
stage1:
  n_trials: 50
  study_name_prefix: "aurora_alpha"
  acceptance:
    min_sharpe: -1000000000.0  # FAST-FULL temporary forensic profile
    max_dd_pct: 35.0           # Hard reject above this drawdown

# Stage 2: Robustness Check
stage2:
  walk_forward:
    train_pct: 0.60
    gap_pct: 0.10
    test_pct: 0.30
    n_folds: 2                 # FAST-FULL temporary profile
  block_bootstrap:
    n_resamples: 50
    block_size_bars: 30        # ~2.5 hours at 5m bars
    confidence_level: 0.95
  execution_stress:
    n_seeds: 2
    latency_ms_range: [50, 500]
    slippage_bps_range: [1, 10]
    fee_multiplier_range: [1.0, 1.5]
    funding_bps_per_day_range: [0.0, 12.0]
  acceptance:
    min_median_sharpe: -1000000000.0      # FAST-FULL temporary forensic profile
    max_sharpe_degradation: 1000000000.0  # FAST-FULL temporary forensic profile
    bootstrap_pnl_positive_pct: 0.0       # FAST-FULL temporary forensic profile

# Cold Holdout (final go/no-go gate)
holdout:
  # Reserve last N months of data — NEVER seen during S0/S1/S2
  reserve_months: 3
  acceptance:
    min_sharpe: -1000000000.0  # FAST-FULL temporary forensic profile
    max_mdd_p90_pct: 1000.0    # FAST-FULL temporary forensic profile

# Data settings
data:
  symbols: ["BTCUSDT"]
  strategy_id: "aurora"
  # Timeframe for backtests (must match available data)
  timeframe: "5m"
