# =============================================================================
# Stage 1: Alpha Search — Search Space
# =============================================================================
# Strategy-level parameters optimized for risk-adjusted return (median_sharpe).
# Regime config is FROZEN from Stage 0 best result.

objective:
  metric: alpha_score          # median_sharpe − sum(penalties)
  direction: maximize

# Penalty configuration for objective function:
#   alpha_score = base_sharpe − P_mdd − P_churn − P_reject − P_starvation − P_util
penalties:
  max_dd_soft_pct: 20.0       # MDD above this starts penalty ramp
  max_dd_hard_pct: 35.0       # MDD above this → hard reject (-1e9)
  churn_threshold: 0.4        # Churn ratio above this triggers penalty
  reject_rate_threshold: 0.3  # GUARD_REJECT rate above this triggers penalty
  starvation_min_trades: 10   # Fewer trades → starvation penalty
  util_proximity_max: 0.95    # Utilization above this → proximity penalty

search_space:
  # Decision-making parameters
  # Path roots:
  #   DecisionConfig (default) -> strategies.aurora.decision
  #   DirectionalSanityConfig -> domains.decision_making.directional_sanity

  strategies.aurora.decision.signal_threshold:
    type: float
    low: 0.3
    high: 0.9
    step: 0.05

  domains.decision_making.directional_sanity.min_confidence:
    type: float
    low: 0.4
    high: 0.9
    step: 0.05
