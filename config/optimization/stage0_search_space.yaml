# =============================================================================
# Stage 0: Regime Calibration — Search Space
# =============================================================================
# Parameters that control regime detection clarity.
# PnL is IGNORED in this stage. Objective: maximize stability_score.
# basis_tf_sec is NOT here — it's an outer grid parameter (see optimizer_config.yaml).

objective:
  metric: stability_score
  direction: maximize

# ⚠️ IMPORTANT: These weights are FIXED CONSTANTS, NOT trial dimensions.
# They control the objective function formula, not regime detector behaviour.
# Optimizing them would mean "tuning how we evaluate" rather than "tuning stability".
# If you need to adjust, edit here manually — do NOT add to search_space.
weights:
  w_flicker: 2.0       # Penalty for regime flicker (switches per hour)
  w_uncertain: 1.0     # Penalty for uncertain regime share

search_space:
  # Regime Detection Params (Root of AuroraConfig)
  uncertain_cutoff:
    type: float
    low: 0.1
    high: 0.6
    step: 0.05
    comment: "Below this confidence → regime = 'uncertain'"

  hysteresis_bars:
    type: int
    low: 1
    high: 10
    comment: "Minimum bars before allowing regime switch"

  # SMA Trend Model
  models.sma_trend.sma_short_period:
    type: int
    low: 5
    high: 30

  models.sma_trend.sma_long_period:
    type: int
    low: 30
    high: 120

  # Volatility Model
  models.volatility.atr_period:
    type: int
    low: 5
    high: 30

  models.volatility.atr_sma_length:
    type: int
    # 5m bars: 288 ~= 1 trading day. Short baselines (<=50) make ATR ratio hug ~1.0
    # and can effectively eliminate HIGH_VOLATILITY classification even with sane thresholds.
    low: 100
    high: 400
    step: 10

  models.volatility.threshold_multiplier:
    type: float
    low: 1.0
    high: 3.0
    step: 0.1
    comment: "ATR ratio above this → high volatility regime"
