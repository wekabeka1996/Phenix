basis_tf_sec: 300       # Bar-Only updates (5 min)
uncertain_cutoff: 0.22  # ЗМЕНШИТИ ПОРІГ: 0.35 → 0.22 (частіше розпізнавати ТРЕНД)

# DM-CRITICAL-PATCHES-02: Liveness guard factor
# If no heartbeat received within (basis_tf_sec * liveness_factor) ms, block trading.
# Default: 3 (i.e., 15 minutes for 5m basis)
liveness_factor: 3

# HYSTERESIS-SLOPE-GATE-01
# NOTE: These are top-level regime.yaml keys (NOT under `models:`).
# FIX-HYST-01: Increased from 3→5 bars (25 min confirmation at 5m basis).
# Prevents rapid regime flipping that causes mass CANCEL_STALE_REGIME.
# Original: 3 bars (15 min) — too responsive, median regime life = 5 min.
hysteresis_bars: 3
vol_slope_gate_enabled: true
vol_slope_gate_eps: -0.005
vol_slope_gate_confirm_bars: 5

