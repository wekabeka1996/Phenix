# ═══════════════ SYSTEM STRESS GUARD (Phase 0.0) ═══════════════
# Independent circuit-breaker overlay: NORMAL → STRESS → EXTREME.
# NOT a replacement for TREND/MR regimes — a separate guard layer.
# When enabled + state=STRESS/EXTREME, DM can gate/attenuate entries.
system_stress:
  enabled: false                 # OFF by default (additive, opt-in)
  sources_enabled: ["price"]     # ["price"] | ["price","orderbook"]
  require_l2_if_enabled: true    # fail-fast if orderbook in sources but L2 fields missing

  baseline_method: rolling       # rolling | expanding
  baseline_window: 100           # REQUIRED if rolling
  burn_in_bars: 120              # minimum bars before emitting stress signal
  robust_method: none            # none | mad

  thresholds:
    atr_sigma: 2.0
    vol_sigma: 2.0
    gap_sigma: 3.0
    range_sigma: 2.5
    volume_sigma: 0.0            # 0.0 = disabled (avoid false positives on seasonal volume)
    spread_sigma: 0.0            # 0.0 = disabled (requires orderbook in sources_enabled)
    depth_drop_pct: 0.0          # disabled by default; enable only with L2

  aggregation:
    method: weighted_vote        # weighted_vote | k_of_n | max
    weights:                     # REQUIRED if weighted_vote; keys must match enabled triggers
      atr: 0.30
      vol: 0.30
      gap: 0.20
      range: 0.20
    k: 2                         # REQUIRED if k_of_n

  state_mapping:
    enter_stress: 0.60
    exit_stress: 0.40
    enter_extreme: 0.85
    exit_extreme: 0.70
    # A4 preset (Phase 0.3 winner — anti-flip hard, wide CB window):
    consecutive_bars_enter: 6    # was 3; 30 min confirmation at 5m basis
    consecutive_bars_exit: 4     # was 2
    min_duration_bars: 15        # was 5; re-entry cooldown (75 min at 5m = 15 bars)
    switch_window_bars: 200      # was 50; ~16.7h window — main anti-churn stabiliser
    max_switches_per_window: 2   # was 3; strict CB limit
    circuit_breaker_mode: halt   # halt (fail-closed)
