# ==========================================================================
# COMMON SETTINGS
# ==========================================================================
common:
  # Regime Filter (All assets)
  regime_filter:
    enabled: true
    always_reject:
      - TREND_UP  # Consistently unprofitable
      - MEAN_REVERSION  # Low performance across all assets
      - HIGH_VOLATILITY  # Too risky
    note: "TREND_DOWN and LOW_VOLATILITY are the only profitable regimes"
  
  # Backtest Settings
  backtest:
    maker_fee: 0.0002  # 0.02%
    taker_fee: 0.0005  # 0.05%
    slippage: 0.0001  # 0.01%
    position_size_usd: 1000  # Fixed size per trade
    use_compounding: false  # Not used in training
  
