name: Config Contract CI

on:
  push:
    paths:
      - "config/**"
      - "config_schema_v1.py"
      - "config_validate.py"
      - "config_contract_map.md"
      - "CONFIG_CONTRACT_FROZEN.md"
      - ".github/workflows/config_contract_ci.yml"
  pull_request:
    paths:
      - "config/**"
      - "config_schema_v1.py"
      - "config_validate.py"
      - "config_contract_map.md"
      - "CONFIG_CONTRACT_FROZEN.md"
      - ".github/workflows/config_contract_ci.yml"

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validate SSOT contract
        run: python config_validate.py --ci
