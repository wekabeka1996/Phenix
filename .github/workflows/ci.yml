name: CI/QA Gates (P1)

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, 'feat/**', 'chore/**']

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff
      
      - name: Run ruff check (strict, no fixes)
        run: ruff check . --no-fix
        working-directory: ./vfoundation

  type:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e vfoundation[dev]
      
      - name: Run mypy
        run: mypy vfoundation apps cli
        working-directory: ./vfoundation

  test:
    name: Test + Coverage (   90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e vfoundation[dev]
          pip install pytest-cov
      
      - name: Run tests with coverage
        run: pytest --cov=vfoundation --cov=apps --cov=cli --cov-report=xml --cov-report=html --cov-fail-under=90
        working-directory: ./
      
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov/
          retention-days: 7

  smoke:
    name: Smoke E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e vfoundation[dev]
      
      - name: Run smoke tests
        run: pytest tests/test_ci_smoke.py -v
        working-directory: ./

  build:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install build tools
        run: pip install build
      
      - name: Build wheel and sdist
        run: python -m build
        working-directory: ./vfoundation
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: vfoundation/dist/
          retention-days: 7

  gate-summary:
    name: Gate Summary (All Passed)
    runs-on: ubuntu-latest
    needs: [lint, type, test, smoke, build]
    if: always()
    steps:
      - name: Check all gates passed
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.type.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "    Some gates failed!"
            exit 1
          fi
          echo "    All P1 gates passed!"
