# ==============================================================================
# Feature Neutrals Search Space
# Target: aurora.decision.feature_neutrals.*
# Source of truth: config/aurora/strategies/aurora.yaml (aurora.decision.feature_neutrals)
# Current defaults: obi=0.0, tfi=0.0, delta_price=0.0, ema_bias=0.0,
#                   volume_spike=0.0, volatility_state=0.0, depth_imbalance=0.0,
#                   macro_sync=0.5, macro_resid=0.0, absorption=0.0
#
# Neutrals define the "center" of each feature (value at which feature = neutral signal).
# Tuning these shifts the interpretation of each feature's directionality.
# ==============================================================================

meta:
  description: "Feature neutral centers for aurora.decision (shift feature baselines)"
  target_path_prefix: "aurora.decision.feature_neutrals"
  strategy: aurora

search_space:
  aurora:
    decision:
      feature_neutrals:
        obi:
          type: float
          low: -0.10
          high: 0.10
        tfi:
          type: float
          low: -0.10
          high: 0.10
        delta_price:
          type: float
          low: -0.005
          high: 0.005
        ema_bias:
          type: float
          low: -0.05
          high: 0.05
        volume_spike:
          type: float
          low: 0.0
          high: 0.20
        volatility_state:
          type: float
          low: 0.0
          high: 0.30
        depth_imbalance:
          type: float
          low: -0.10
          high: 0.10
        macro_resid:
          type: float
          low: -0.20
          high: 0.20
        absorption:
          type: float
          low: -0.05
          high: 0.05
