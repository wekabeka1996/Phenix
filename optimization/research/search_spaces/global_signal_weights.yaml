# ==============================================================================
# Global Signal Weights Search Space
# Target: aurora.decision.signal_weights.*
# Source of truth: config/aurora/strategies/aurora.yaml (aurora.decision.signal_weights)
# Current defaults: obi=0.25, tfi=0.25, delta_price=0.35, ema_bias=0.15,
#                   volume_spike=0.10, volatility_state=0.10, depth_imbalance=0.20,
#                   macro_resid=0.10, absorption=0.05
#
# NOTE: These are GLOBAL weights applied to all symbols.
#       Per-symbol overrides (aurora.assets.<SYM>.weights) take precedence if set.
# ==============================================================================

meta:
  description: "Global aurora.decision signal weights (all symbols fallback)"
  target_path_prefix: "aurora.decision.signal_weights"
  strategy: aurora

search_space:
  aurora:
    decision:
      signal_weights:
        obi:
          type: float
          low: 0.05
          high: 0.50
        tfi:
          type: float
          low: 0.05
          high: 0.50
        delta_price:
          type: float
          low: 0.10
          high: 0.60
        ema_bias:
          type: float
          low: 0.05
          high: 0.40
        volume_spike:
          type: float
          low: 0.0
          high: 0.30
        volatility_state:
          type: float
          low: 0.0
          high: 0.30
        depth_imbalance:
          type: float
          low: -0.40
          high: 0.40
        macro_resid:
          type: float
          low: 0.0
          high: 0.30
        absorption:
          type: float
          low: 0.0
          high: 0.15
