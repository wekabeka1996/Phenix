# ==============================================================================
# Quadratic Brain (Pillar) Weights Search Space
# Target: feature_engineering.pillars.weights.*
#         feature_engineering.pillars.<name>.sensitivity
# Source of truth: config/aurora/domains.yaml (feature_engineering.pillars)
# Current defaults:
#   weights: tactician=0.30, operator=0.40, strategist=0.30
#   sensitivity: tactician=3.0, operator=3.0, strategist=3.0
# ==============================================================================

meta:
  description: "Quadratic Brain pillar weights and tanh sensitivity tuning"
  target_path_prefix: "feature_engineering.pillars"
  config_file: "domains.yaml"

search_space:
  feature_engineering:
    pillars:
      # Relative weights of the three timeframe pillars (sum need not equal 1 — normalized internally)
      weights:
        tactician:
          type: float
          low: 0.05
          high: 0.60
        operator:
          type: float
          low: 0.10
          high: 0.70
        strategist:
          type: float
          low: 0.05
          high: 0.60

      # tanh sensitivity: higher = signals saturate faster (more binary directional response)
      tactician:
        sensitivity:
          type: float
          low: 1.0
          high: 6.0
          step: 0.5

      operator:
        sensitivity:
          type: float
          low: 1.0
          high: 6.0
          step: 0.5

      strategist:
        sensitivity:
          type: float
          low: 1.0
          high: 6.0
          step: 0.5
