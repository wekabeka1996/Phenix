# ==============================================================================
# Regime Knobs Search Space
# Target: aurora.decision.regime_threshold_multipliers.*
#         aurora.decision.regime_thresholds.*
# Source of truth: config/aurora/strategies/aurora.yaml
# Current regime_threshold_multipliers:
#   HIGH_VOLATILITY=1.30, LOW_VOLATILITY=1.15, MEAN_REVERSION=1.10,
#   TREND_UP=1.50, TREND_DOWN=0.85, UNCERTAIN=1.50, DEFAULT=1.00
# Current regime_thresholds (global decision):
#   HIGH_VOLATILITY=0.10, LOW_VOLATILITY=0.09, MEAN_REVERSION=0.075,
#   TREND_UP=0.1, TREND_DOWN=0.1, UNCERTAIN=0.115, DEFAULT=0.1
# ==============================================================================

meta:
  description: "Regime threshold multipliers and absolute thresholds for aurora.decision"
  strategy: aurora

search_space:
  aurora:
    decision:
      # Multipliers applied to per-symbol regime_thresholds (scales entry barrier per regime)
      regime_threshold_multipliers:
        HIGH_VOLATILITY:
          type: float
          low: 0.80
          high: 2.00
        LOW_VOLATILITY:
          type: float
          low: 0.80
          high: 1.80
        MEAN_REVERSION:
          type: float
          low: 0.80
          high: 1.80
        TREND_UP:
          type: float
          low: 0.80
          high: 2.50
        TREND_DOWN:
          type: float
          low: 0.50
          high: 1.50
        UNCERTAIN:
          type: float
          low: 1.00
          high: 3.00
        DEFAULT:
          type: float
          low: 0.80
          high: 1.50

      # Global signal_threshold (entry gate for all symbols)
      signal_threshold:
        type: float
        low: 0.003
        high: 0.05
        step: 0.001

      # Anti-FOMO and Anti-Flat sigma gates
      gates:
        anti_flat_sigma:
          type: float
          low: 0.10
          high: 1.50
          step: 0.05
        anti_fomo_sigma:
          type: float
          low: 2.0
          high: 8.0
          step: 0.25

      # Liquidity gate minimum kappa (global)
      liquidity_gate:
        kappa_min:
          type: float
          low: 0.05
          high: 0.40
          step: 0.01
