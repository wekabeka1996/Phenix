# ==============================================================================
# Risk Management Weights Search Space
# Target: risk_management.risk_score_weights.*
# Source of truth: config/aurora/domains.yaml (risk_management.risk_score_weights)
# Current defaults:
#   delta_price_pct=0.1, obi=0.3, tfi=0.3,
#   absorption_inverse=0.3, absorption_feature=0.2
# Also: trading_allowed_thresholds.max_risk_score=0.96
# ==============================================================================

meta:
  description: "Risk management score weights (affects position entry gate)"
  target_path_prefix: "risk_management.risk_score_weights"
  config_file: "domains.yaml"

search_space:
  risk_management:
    risk_score_weights:
      delta_price_pct:
        type: float
        low: 0.05
        high: 0.30
      obi:
        type: float
        low: 0.10
        high: 0.50
      tfi:
        type: float
        low: 0.10
        high: 0.50
      absorption_inverse:
        type: float
        low: 0.10
        high: 0.50
      absorption_feature:
        type: float
        low: 0.05
        high: 0.40

    # Risk gate threshold: max cumulative risk score to allow a trade
    trading_allowed_thresholds:
      max_risk_score:
        type: float
        low: 0.80
        high: 0.99
        step: 0.01
