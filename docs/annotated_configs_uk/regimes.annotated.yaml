# Файл: regimes.yaml — Налаштування детектора режимів ринку (regimes)
# Мета: параметри детектора режиму (нормальний/висока волатильність/кризовий)
# і правила, коли змінюється режим.
#
# Ключі:
# - detector:
#   - window_minutes: розмір вікна (в хвилинах) для розрахунку метрик (наприклад, std vol)
#   - min_regime_duration_min: мінімальна тривалість режиму (щоб не фліпати часто)
#   - debounce_changes: чи використовувати загладжування при зміні режиму
# - regimes: межі для класифікації за vol std (bps)
#   - NORMAL / HIGH_VOLATILITY / CRISIS: кожен має min/max
# - hotreload.allowed: список режимів, які можна міняти на льоту
#
# Порада: обирайте window_minutes достатньо великим, щоб уникнути шуму, але
# достатньо малим, щоб реагувати на реальні зміни ринку.

# --- Оригінальний вміст файлу ---
# v2 config for regimes domain
# See docs/config_v2/specification.md and migration_standards.md

detector:
  window_minutes: 2          # rv_window / 60 ≈ 120/60 = 2 minutes
  min_regime_duration_min: 15 # min time to hold regime
  debounce_changes: true

regimes:
  NORMAL:
    vol_std_bps_min: 0
    vol_std_bps_max: 80
  HIGH_VOLATILITY:
    vol_std_bps_min: 80
    vol_std_bps_max: 200
  CRISIS:
    vol_std_bps_min: 200
    vol_std_bps_max: 10000

hotreload:
  allowed: ["NORMAL", "HIGH_VOLATILITY", "CRISIS"]
