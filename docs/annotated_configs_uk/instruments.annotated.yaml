# Файл: instruments.yaml — Профілі інструментів (symbols)
# Мета: визначає торгові інструменти (символи), їх точність (precision),
# обмеження (limits) та інші властивості, необхідні для роботи торгових адаптерів.
#
# Які ключі тут важливі і що вони означають:
# - instruments: словник символів -> налаштування
#   - <SYMBOL> (наприклад, SOLUSDT): блок налаштувань для цього символу
#     - exchange: біржа/адаптер (binance, etc.) — визначає, який адаптер використовувати
#     - base_asset / quote_asset: активи пари
#     - precision:
#       - quantity: кількість знаків після коми для розміру ордера (скільки десятк. місць)
#       - price: кількість знаків після коми для ціни
#       Пояснення: precision потрібен для округлення/валідності запиту на біржу.
#     - limits:
#       - min_notional: мінімальна вартість ордера у котирувальній валюті (USDT)
#       - min_qty: мінімальний розмір лота
#       - min_price: мінімальна ціна за одиницю
#       - step_size: крок кількості (лот)
#       - tick_size: крок ціни
#       - max_position_size: локальний ліміт розміру позиції (захисний кап)
#       - max_leverage: максимальний левередж для цього інструменту
#
# Порада: якщо адаптер повертає фільтри (LOT_SIZE, PRICE_FILTER), ці параметри
# повинні узгоджуватися з ними. Якщо не узгоджено — адаптер може відхилити ордер.

# --- Оригінальний вміст файлу ---
# v2 instruments config (base profiles)
# See docs/config_v2/instrument_profile.md and INSTRUMENT_TEMPLATE.md

instruments:
  SOLUSDT:
    exchange: binance
    base_asset: SOL
    quote_asset: USDT
    precision:
      quantity: 2  # from trading.instruments.SOLUSDT.step_size "0.01"
      price: 2     # from trading.instruments.SOLUSDT.tick_size "0.01"
    limits:
      min_notional: 10.0  # from trading.instruments.SOLUSDT.min_notional "10"
      min_qty: 0.01       # inferred from Binance LOT_SIZE filter
      min_price: 0.01     # inferred from Binance PRICE_FILTER
      step_size: 0.01     # from trading.instruments.SOLUSDT.step_size "0.01"
      tick_size: 0.01     # from trading.instruments.SOLUSDT.tick_size "0.01"
      max_position_size: 5.0  # default cap until per-symbol data collected
      max_leverage: 20        # conservative base leverage, overrides bump to 125 for testnet
  ETHUSDT:
    exchange: binance
    base_asset: ETH
    quote_asset: USDT
    precision:
      quantity: 3  # from trading.instruments.ETHUSDT.step_size "0.001"
      price: 2     # from trading.instruments.ETHUSDT.tick_size "0.01"
    limits:
      min_notional: 10.0  # from trading.instruments.ETHUSDT.min_notional "10"
      min_qty: 0.001
      min_price: 0.01
      step_size: 0.001    # from trading.instruments.ETHUSDT.step_size "0.001"
      tick_size: 0.01     # from trading.instruments.ETHUSDT.tick_size "0.01"
      max_position_size: 5.0
      max_leverage: 20
  BTCUSDT:
    exchange: binance
    base_asset: BTC
    quote_asset: USDT
    precision:
      quantity: 3  # from trading.instruments.BTCUSDT.step_size "0.001"
      price: 2     # from trading.instruments.BTCUSDT.tick_size "0.10" -> 2 decimals? Wait, "0.10" is 1 decimal, but typically 2 for price
      # Actually, tick_size "0.10" means 1 decimal place, but for BTC it's usually 2. But follow legacy.
    limits:
      min_notional: 10.0  # from trading.instruments.BTCUSDT.min_notional "10"
      min_qty: 0.001
      min_price: 0.10
      step_size: 0.001    # from trading.instruments.BTCUSDT.step_size "0.001"
      tick_size: 0.10     # from trading.instruments.BTCUSDT.tick_size "0.10"
      max_position_size: 3.0  # stricter cap due to volatility
      max_leverage: 20
  BNBUSDT:
    exchange: binance
    base_asset: BNB
    quote_asset: USDT
    precision:
      quantity: 2  # from trading.instruments.BNBUSDT.step_size "0.01"
      price: 2     # from trading.instruments.BNBUSDT.tick_size "0.01"
    limits:
      min_notional: 10.0  # from trading.instruments.BNBUSDT.min_notional "10"
      min_qty: 0.01
      min_price: 0.01
      step_size: 0.01     # from trading.instruments.BNBUSDT.step_size "0.01"
      tick_size: 0.01     # from trading.instruments.BNBUSDT.tick_size "0.01"
      max_position_size: 5.0
      max_leverage: 20
