# Файл: core.yaml — Основні налаштування ядра системи (v2)
# Мета: центральні опції, пов'язані з логуванням, операційними налаштуваннями
# і загальними системними параметрами.
#
# Коментарі українською пояснюють, що означає кожен ключ та як він впливає на систему.
#
# Верхні ключі (приклади):
# - logging: Параметри логування (рівень, файл, формат, ротація).
#   - level: мінімальний рівень логів, що записується (DEBUG, INFO, WARNING, ERROR).
#   - file: шлях до файлу логів.
#   - format: формат запису (plain, json).
#   - rotation: налаштування ротації файлу логів (max_bytes, backup_count).
# - system: загальні операційні налаштування (моніторинг, метрики, шляхи для звітів).
#   - metrics_url: куди шлються метрики; використовується Prometheus або локальний експортер.
#   - reports_dir: папка для збереження артефактів/звітів.
#
# Підказка: цей файл в репозиторії містить шаблон (skeleton) — конкретні значення
# можуть знаходитися в інших конфігах/overrides або в runtime resolver.

