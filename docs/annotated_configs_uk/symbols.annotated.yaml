# Файл: symbols.yaml — Універс символів (список торгованих пар)
# Мета: визначає набір символів, на яких працюватиме система, та базові фільтри
# які застосовуються при відборі інструментів (наприклад, мінімальний обсяг торгів).
#
# Ключі та пояснення:
# - symbols: список символів у форматі <BASE><QUOTE> (наприклад, SOLUSDT)
#   Система ініціалізує тільки ті символи, що тут наведені.
# - filters:
#   - min_volume_24h: мінімальний сумарний обсяг торгів за 24 години (у квотній валюті),
#     нижче якого символ буде ігнорований/виключений з робочого набору.
#
# Порада: додавання символів тут не автоматично додає їх до адаптера — потрібно
# щоб `instruments.yaml` мав відповідний профіль для символу.

# --- Оригінальний вміст файлу ---
# v2 config for trading symbols/universe
# See docs/config_v2/specification.md for full structure.

symbols:
  - SOLUSDT
  - ETHUSDT
  - BTCUSDT
  - BNBUSDT

filters:
  min_volume_24h: 1000000
