# Приклад конфігурації домену account_balance

# =============================================================================
# ОСНОВНІ НАЛАШТУВАННЯ СИСТЕМИ
# =============================================================================

# Режим торгівлі (впливає на вибір API)
trading_mode: "hybrid_live_data_testnet_exec"

# =============================================================================
# API КОНФІГУРАЦІЯ BINANCE
# =============================================================================

binance_api:
  # Конфігурація для бойового середовища
  live:
    api_key: "${BINANCE_LIVE_API_KEY}"
    api_secret: "${BINANCE_LIVE_API_SECRET}"
    rest_url: "https://fapi.binance.com"

  # Конфігурація для тестового середовища
  testnet:
    api_key: "${BINANCE_TESTNET_API_KEY}"
    api_secret: "${BINANCE_TESTNET_API_SECRET}"
    rest_url: "https://testnet.binancefuture.com"

# =============================================================================
# КОНФІГУРАЦІЯ ДОМЕНУ ACCOUNT_BALANCE
# =============================================================================

account_balance:
  # Інтервал опитування API в секундах
  poll_interval: 30

  # Налаштування повторів при помилках
  retry_attempts: 3
  backoff_multiplier: 2.0

  # Таймаути та обмеження
  timeout: 10
  max_concurrent_requests: 2

  # Фільтри даних
  enable_balance_filtering: true    # Тільки активи з балансом > 0
  enable_position_filtering: true   # Тільки відкриті позиції

  # Додаткові налаштування логування
  log_level: "INFO"
  enable_detailed_balance_logging: true

# =============================================================================
# ЗАГАЛЬНІ НАЛАШТУВАННЯ ACCOUNT_OBSERVER (для сумісності)
# =============================================================================

account_observer:
  poll_interval: 30  # Має співпадати з account_balance.poll_interval

# =============================================================================
# ПРИКЛАДИ РІЗНИХ КОНФІГУРАЦІЙ
# =============================================================================

# Для розробки з мінімальним інтервалом
development_config:
  account_balance:
    poll_interval: 10
    log_level: "DEBUG"
    enable_detailed_balance_logging: true

# Для продакшену з оптимізацією
production_config:
  account_balance:
    poll_interval: 60
    retry_attempts: 5
    log_level: "WARN"
    enable_detailed_balance_logging: false

# Для тестування з швидкими інтервалами
testing_config:
  account_balance:
    poll_interval: 5
    retry_attempts: 1
    timeout: 5
    log_level: "DEBUG"

# =============================================================================
# ЗМІННІ СЕРЕДОВИЩА (для .env файлу)
# =============================================================================

# BINANCE_LIVE_API_KEY=your_live_api_key_here
# BINANCE_LIVE_API_SECRET=your_live_api_secret_here
# BINANCE_TESTNET_API_KEY=your_testnet_api_key_here
# BINANCE_TESTNET_API_SECRET=your_testnet_api_secret_here

# =============================================================================
# ПРИКЛАД КОНФІГУРАЦІЇ З КОМЕНТАРЯМИ
# =============================================================================

# Детальний приклад з поясненнями
detailed_example:
  trading_mode: "testnet"  # Використовувати testnet для безпеки

  binance_api:
    testnet:
      api_key: "your_testnet_key"
      api_secret: "your_testnet_secret"
      rest_url: "https://testnet.binancefuture.com"

  account_balance:
    # Як часто опитувати API (в секундах)
    poll_interval: 30

    # Поведінка при помилках
    retry_attempts: 3          # Спробувати 3 рази
    backoff_multiplier: 2.0    # Подвоювати затримку між спробами
    timeout: 10               # Максимальний час очікування відповіді

    # Фільтрація даних
    enable_balance_filtering: true   # Показувати тільки активи з балансом
    enable_position_filtering: true  # Показувати тільки відкриті позиції

    # Логування
    log_level: "INFO"                    # Рівень логування
    enable_detailed_balance_logging: true # Детальне логування балансу USDT</content>
