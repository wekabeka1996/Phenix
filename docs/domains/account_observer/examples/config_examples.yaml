# Приклад конфігурації домену Account Observer

## Продуктивна конфігурація (production.yaml)

```yaml
# Повна конфігурація � и� теми з account_observer доменом
trading_mode: live

binance_api:
  live:
    api_key: "${BINANCE_LIVE_API_KEY}"
    api_secret: "${BINANCE_LIVE_API_SECRET}"

account_observer:
  # Параметри моніторингу
  poll_interval: 5          # Опитування кожні 5 � екунд
  trade_limit: 50          # О� танні 50 трейдів за запит

  # Спи� ок � имволів для моніторингу
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - ADAUSDT
    - SOLUSDT
    - DOTUSDT
    - LINKUSDT
    - LTCUSDT
```

