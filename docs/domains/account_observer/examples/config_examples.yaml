#                                                      Account Observer

##                                                 (production.yaml)

```yaml
#                                                       account_observer               
trading_mode: live

binance_api:
  live:
    api_key: "${BINANCE_LIVE_API_KEY}"
    api_secret: "${BINANCE_LIVE_API_SECRET}"

account_observer:
  #                                          
  poll_interval: 5          #                                 5             
  trade_limit: 50          #                50                               

  #                                                            
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - ADAUSDT
    - SOLUSDT
    - DOTUSDT
    - LINKUSDT
    - LTCUSDT
```

##                                         (testnet.yaml)

```yaml
trading_mode: testnet

binance_api:
  testnet:
    api_key: "${BINANCE_TESTNET_API_KEY}"
    api_secret: "${BINANCE_TESTNET_API_SECRET}"

account_observer:
  poll_interval: 10
  trade_limit: 20
  symbols:
    - BTCUSDT
    - ETHUSDT
```

##                                               (minimal.yaml)

```yaml
trading_mode: live

binance_api:
  live:
    api_key: "your_api_key"
    api_secret: "your_api_secret"

account_observer:
  symbols: [BTCUSDT]
```

