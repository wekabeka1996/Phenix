basis_tf_sec: 300       # Bar-Only updates (5 min)
uncertain_cutoff: 0.40  # ЗМЕНШИТИ ПОРІГ: 0.35 → 0.20 (частіше розпізнавати ТРЕНД)

# DM-CRITICAL-PATCHES-02: Liveness guard factor
# If no heartbeat received within (basis_tf_sec * liveness_factor) ms, block trading.
# Default: 3 (i.e., 15 minutes for 5m basis)
liveness_factor: 3

